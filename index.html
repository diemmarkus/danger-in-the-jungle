<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0F3324">
<title>Danger in the Jungle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: the jungle canvas fills the whole screen. Everything else floats on top of it:
   glass arrow pads on the ground, a pause button, and scene overlays (title, intro, pause, results). */
:root{
  --paper:#FFD45A;--ink:#2A1C14;--jungle:#4FAE5A;--deep:#2B7A43;--leaf:#8FDB6A;--hedge:#3E9A55;--bark:#7A4A2A;--dirt:#A8703F;
  --pop:#F04E3E;--blue:#2F86F0;--vest:#FF8A1F;--soda:#7FE3F0;--white:#FFFDF6;--night:#0F3324;--gold:#FFC53D;
  --display:"Fredoka","Baloo 2","Arial Rounded MT Bold",system-ui,sans-serif;
  --hand:"Nunito","Segoe UI",system-ui,sans-serif;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;margin:0;background:var(--night)}
body{color:var(--white);font-family:var(--hand);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;overscroll-behavior:none}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0;touch-action:none}
canvas{display:block;width:100%;height:100%;transition:filter .6s ease}
canvas.dim{filter:saturate(.35) brightness(.7)}
#safe{position:absolute;visibility:hidden;padding:var(--st) var(--sr) var(--sb) var(--sl)}

/* glass: the one surface style used for every control */
.glass{background:linear-gradient(180deg,rgba(255,255,255,.26),rgba(255,255,255,.1));border:1.5px solid rgba(255,255,255,.42);box-shadow:0 8px 22px rgba(0,25,10,.35),inset 0 1px 0 rgba(255,255,255,.45);backdrop-filter:blur(10px) saturate(1.2);-webkit-backdrop-filter:blur(10px) saturate(1.2)}
.round{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;padding:0;cursor:pointer}
.round svg{width:22px;height:22px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}
.round:active{transform:scale(.92)}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.act:focus-visible{outline:none}.act:focus-visible .round{outline:3px solid var(--gold);outline-offset:3px}

/* in-game: pause button top right */
#pauseBtn{position:absolute;top:calc(var(--st) + 12px);right:calc(var(--sr) + 12px)}

/* arrow pads sit on the ground; each half of the bottom strip is one big touch zone */
#ctrl{position:absolute;left:0;right:0;bottom:0;height:calc(150px + var(--sb));display:flex;touch-action:none;transition:opacity .35s ease,transform .35s ease}
#ctrl.off{opacity:0;transform:translateY(30px);pointer-events:none}
.pg{flex:1 1 0;min-width:0;display:flex;align-items:center;gap:14px;padding:10px calc(14px + var(--sr)) calc(14px + var(--sb)) calc(14px + var(--sl));touch-action:none;cursor:pointer}
.pg.h{justify-content:flex-start}
.pg.v{flex-direction:column;align-items:flex-end;justify-content:center;gap:10px}
.pg button{pointer-events:none;flex:none;width:76px;height:64px;border-radius:24px;display:grid;place-items:center;padding:0;transition:transform .08s,background .08s}
.pg.v button{height:54px}
.pg button svg{width:30px;height:30px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}
.pg button.on{background:linear-gradient(180deg,#FFE58A,#FFC53D);color:#5A3B00;border-color:#FFE9A8;transform:scale(.93)}

/* title screen: the sign is painted on the canvas; the controls sit at the bottom */
#menu{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:calc(var(--st) + 12px) calc(var(--sr) + 14px) calc(var(--sb) + 18px) calc(var(--sl) + 14px);pointer-events:none}
#menu>*{pointer-events:auto}
.mtop{display:flex;justify-content:space-between;align-items:center}
.pill{border-radius:999px;padding:9px 16px;font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.04em;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.pill svg{width:18px;height:18px}
.mbottom{display:flex;flex-direction:column;align-items:center;gap:14px}
.seg{display:flex;padding:4px;border-radius:999px;gap:2px}
.seg button{border:none;background:none;border-radius:999px;padding:8px 14px;font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:.03em;cursor:pointer;color:rgba(255,255,255,.85);display:flex;align-items:center;gap:6px}
.seg button i{display:inline-flex;gap:2px}
.seg button i b{width:6px;height:10px;border-radius:6px 0 6px 0;background:currentColor;opacity:.9}
.seg button[aria-pressed="true"]{background:linear-gradient(180deg,#FFE58A,#FFC53D);color:#5A3B00;box-shadow:0 3px 10px rgba(255,197,61,.45)}
.medals{display:flex;gap:16px}
.medal{width:62px;height:62px;border-radius:50%;cursor:pointer;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:24px;position:relative;padding:0}
.medal[aria-pressed="true"]{background:radial-gradient(circle at 35% 30%,#FFF1B0,#FFC53D 60%,#E09A10);color:#5A3B00;border-color:#FFF2C0;box-shadow:0 0 0 4px rgba(255,197,61,.35),0 8px 22px rgba(0,25,10,.35)}
.medal:disabled{cursor:default;opacity:.55}
.medal svg{width:22px;height:22px}
.medal small{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-family:var(--display);font-size:11px;font-weight:600;letter-spacing:.06em;white-space:nowrap;opacity:.85}
.play{margin-top:14px;border:none;border-radius:999px;padding:14px 46px 14px 38px;font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.04em;cursor:pointer;color:#fff;background:linear-gradient(180deg,#9BE873,#36A646);box-shadow:0 7px 0 #24782F,0 14px 30px rgba(0,30,10,.45),inset 0 2px 0 rgba(255,255,255,.4);text-shadow:0 2px 0 rgba(0,0,0,.18);display:flex;align-items:center;gap:12px;animation:breathe 2.4s ease-in-out infinite}
.play svg{width:26px;height:26px}
.play:active{transform:translateY(5px);box-shadow:0 2px 0 #24782F,0 6px 14px rgba(0,30,10,.4);animation:none}
@keyframes breathe{50%{transform:scale(1.04)}}
.lbl{font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.12em;opacity:.8;text-transform:uppercase;text-shadow:0 1px 3px rgba(0,0,0,.5)}

/* sheets: how-to, pause, results — a blurred scrim and glass panel, no paper cards */
.scrim{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:calc(var(--st) + 20px) 20px calc(var(--sb) + 20px);background:radial-gradient(circle at 50% 40%,rgba(15,51,36,.25),rgba(8,30,20,.75));animation:fade .3s ease}
@keyframes fade{from{opacity:0}}
.sheet{width:min(360px,100%);max-height:100%;overflow-y:auto;box-sizing:border-box;border-radius:30px;padding:26px 22px 22px;text-align:center;animation:rise .45s cubic-bezier(.2,1.3,.4,1)}
@keyframes rise{from{transform:translateY(40px) scale(.94);opacity:0}}
.sheet h2{font-family:var(--display);font-weight:700;font-size:42px;line-height:1;margin:0 0 10px;letter-spacing:.01em;background:linear-gradient(180deg,#FFF6C8,#FFC53D);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 rgba(120,70,0,.45)) drop-shadow(0 8px 16px rgba(0,0,0,.35));text-wrap:balance}
.sheet.bad h2{background-image:linear-gradient(180deg,#FFC2A8,#F04E3E);filter:drop-shadow(0 3px 0 rgba(110,20,10,.5)) drop-shadow(0 8px 16px rgba(0,0,0,.35))}
.sheet p{margin:6px 0;font-size:15px;line-height:1.45;color:rgba(255,255,255,.92)}
.stats{display:flex;justify-content:center;gap:10px;margin:14px 0 4px;flex-wrap:wrap}
.stat{border-radius:16px;padding:8px 14px;font-family:var(--display);font-weight:600;font-size:17px;display:flex;align-items:center;gap:8px}
.stat svg{width:18px;height:18px}
.cages{display:flex;justify-content:center;gap:12px;margin:12px 0}
.cages span{width:40px;height:40px;border-radius:50%;display:grid;place-items:center}
.cages span svg{width:24px;height:24px}
.cages span.free{background:radial-gradient(circle at 35% 30%,#8FD0FF,#2F86F0);border-color:#BFE3FF}
.actions{display:flex;justify-content:center;gap:16px;margin-top:18px}
.act{display:flex;flex-direction:column;align-items:center;gap:6px;font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.06em;cursor:pointer;background:none;border:none;padding:0}
.act .round{width:58px;height:58px}
.act .round svg{width:26px;height:26px}
.act.main .round{width:72px;height:72px;background:linear-gradient(180deg,#9BE873,#36A646);border-color:#C9F5A8;box-shadow:0 6px 0 #24782F,0 12px 26px rgba(0,30,10,.45)}
.act.main .round svg{width:32px;height:32px}
.rules{list-style:none;padding:0;margin:14px 0 4px;text-align:left;display:grid;gap:12px}
.rules li{display:flex;gap:12px;align-items:flex-start;font-size:14.5px;line-height:1.4}
.rules li b{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:15px;background:linear-gradient(180deg,#FFE58A,#FFC53D);color:#5A3B00}

/* intro: letterbox bars, subtitles, skip */
#cine{position:absolute;inset:0;pointer-events:none}
#cine::before,#cine::after{content:"";position:absolute;left:0;right:0;height:12%;background:#050f0a;animation:bar .6s ease both}
#cine::before{top:0}
#cine::after{bottom:0}
@keyframes bar{from{transform:scaleY(0)}}
#cine::before{transform-origin:top}#cine::after{transform-origin:bottom}
#caption{position:absolute;left:24px;right:24px;bottom:calc(12% + 18px);text-align:center;font-weight:700;font-size:18px;line-height:1.35;text-shadow:0 2px 6px rgba(0,0,0,.8),0 0 2px rgba(0,0,0,.9);transition:opacity .35s ease;z-index:1}
#skipBtn{position:absolute;top:calc(var(--st) + 12px);right:calc(var(--sr) + 12px);pointer-events:auto;z-index:1}

#fade{position:absolute;inset:0;background:#0A2418;opacity:0;pointer-events:none;transition:opacity .3s ease}
#fade.on{opacity:1}
@media (orientation:landscape) and (max-height:540px){
  #ctrl{height:calc(110px + var(--sb))}
  .pg button{width:68px;height:56px}.pg.v button{height:48px}.pg.v{gap:6px}
  .mbottom{position:absolute;right:calc(var(--sr) + 14px);top:50%;transform:translateY(-50%);width:50%;gap:10px}
  .play{margin-top:8px}
}
@media (prefers-reduced-motion:reduce){.play{animation:none}}
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>
  <div id="safe"></div>

  <div id="ctrl" class="off">
    <div class="pg h">
      <button type="button" class="glass" data-d="l" tabindex="-1" aria-label="Left"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 4.5 7 12l8.5 7.5" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button type="button" class="glass" data-d="r" tabindex="-1" aria-label="Right"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 4.5 17 12l-8.5 7.5" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
    <div class="pg v">
      <button type="button" class="glass" data-d="u" tabindex="-1" aria-label="Up"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 15.5 12 7l7.5 8.5" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button type="button" class="glass" data-d="d" tabindex="-1" aria-label="Down"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 8.5 12 17l7.5-8.5" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
  </div>

  <button type="button" id="pauseBtn" class="glass round" hidden aria-label="Pause"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.5" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1.5" fill="currentColor"/></svg></button>

  <div id="menu">
    <div class="mtop">
      <button type="button" id="langBtn" class="glass pill"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18" fill="none" stroke="currentColor" stroke-width="2"/></svg><span id="langName">EN</span></button>
      <button type="button" id="howBtn" class="glass round" aria-label="How to play"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 9a3 3 0 1 1 4.2 2.8c-.8.4-1.2 1-1.2 1.9V15" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><circle cx="12" cy="18.6" r="1.6" fill="currentColor"/></svg></button>
    </div>
    <div class="mbottom">
      <div class="seg glass" id="diffs" role="group" aria-label="Difficulty"></div>
      <span class="lbl" id="lvlLbl">Level</span>
      <div class="medals" id="medals" role="group" aria-label="Level"></div>
      <button type="button" class="play" id="playBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12.5-7.5z" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg><span id="playLbl">PLAY</span></button>
    </div>
  </div>

  <div id="cine" hidden>
    <p id="caption"></p>
    <button type="button" id="skipBtn" class="glass pill"><span id="skipLbl">Skip</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5l7 7-7 7M13 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>

  <div class="scrim" id="howOv" hidden>
    <div class="sheet glass">
      <h2 id="howTitle">How to play</h2>
      <ol class="rules" id="rules"></ol>
      <div class="actions"><button type="button" class="act main" id="howClose"><span class="glass round"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span id="okLbl">OK</span></button></div>
    </div>
  </div>

  <div class="scrim" id="sheetOv" hidden>
    <div class="sheet glass" id="sheet">
      <h2 id="sTitle"></h2>
      <p id="sText"></p>
      <div class="cages" id="sCages"></div>
      <div class="stats" id="sStats"></div>
      <div class="actions" id="sActs"></div>
    </div>
  </div>

  <div id="fade"></div>
</div>

<script>
(()=>{
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d');
const css=getComputedStyle(document.documentElement);
const V=n=>css.getPropertyValue(n).trim();
const C={paper:V('--paper'),ink:V('--ink'),jungle:V('--jungle'),deep:V('--deep'),leaf:V('--leaf'),hedge:V('--hedge'),bark:V('--bark'),dirt:V('--dirt'),pop:V('--pop'),blue:V('--blue'),vest:V('--vest'),soda:V('--soda'),white:V('--white')};

// World units: the clearing is 10 units wide, x to the right, y downward from the top of the stage.
const WORLD=10,LINE=5,BOSS_X=9,LEVELS=3;
const PR=.3;                 // parrot hit radius
const PV=4.8;                // parrot flying speed (units/s)
const G=6;                   // gravity on thrown things (units/s²)
const ITEMS=['rope','net','kescher','basket','rope','net'];
const ITEM_R={rope:.34,net:.26,kescher:.36,basket:.36};
// per level: worker walking speed, throw cooldown range, wind-up time, throw speed, max things in the air at once
const LV=[
  {walk:1,cd:[4.5,7.5],wind:.8,speed:4.2,max:1},
  {walk:1.15,cd:[3.6,6],wind:.7,speed:5.2,max:2},
  {walk:1.35,cd:[2.8,4.8],wind:.6,speed:6.2,max:3},
];
// difficulty: slower throws, longer cooldowns and wind-ups, slower walkers, less aiming ahead
const DIFFS=[{k:'easy',cd:1.45,wind:1.25,speed:.8,walk:.85,lead:0},{k:'medium',cd:1.2,wind:1.1,speed:.9,walk:.93,lead:.25},{k:'hard',cd:1,wind:1,speed:1,walk:1,lead:.5}];

// ---------- i18n ----------
const NB=' ';
const I18N={
  en:{name:'EN',title:'DANGER IN THE JUNGLE!',story:'You’re a blue parrot having breakfast when you hear rumbling, whistling and sawing. You push a leaf aside: workers are cutting down your jungle! Not in your home.',
    rules:['Press the arrows to fly.','The boss’s crew throws ropes, nets, landing nets and baskets at you. Dodge them!','Lure all 6 workers to the left of the log.','Then snatch the key from the boss’s neck, fly through the door and free your friend.','Get caught and you have to do the level again.'],
    start:'FLY!',skip:'TAP TO SKIP',from:'START AT LEVEL',diff:['EASY','MEDIUM','HARD'],restart:'Restart',
    lvl:n=>'LVL '+n+'/3',lured:n=>'LURED '+n+'/6',keyReady:'ALL LURED: GRAB THE KEY!',escape:'FLY THROUGH THE DOOR!',
    level:n=>'LEVEL '+n+'!',lureSub:'LURE ALL 6 TO THE LEFT!',notYet:'NOT YET!',snatch:'SNATCH!',door:'TO THE DOOR!',click:'CLICK!',free:'FREE!',saved:'SAVED!',
    intro:['RUMBLE!','TWEEET!','RRRATSCH!'],introBan:'NOT IN MY JUNGLE!',caughtPop:'GOTCHA!',huh:'HUH?',
    caughtT:'CAUGHT!',caughtP:'The crew got you. Do the level again!',again:'AGAIN',
    doneT:n=>'LEVEL '+n+' DONE!',doneP:'Your friend is free, the workers are gone and the jungle grows back. But there are more of them…',next:'NEXT',
    winT:'JUNGLE SAVED!',winP:'All three friends are free and the lumberjacks are gone for good.',stats:(t,c)=>t+' · CAUGHT '+c+'×',best:t=>'Best time: '+t},
  de:{name:'DE',title:'DANGER IN THE JUNGLE!',story:'Du bist ein blauer Papagei und frühstückst gerade, da hörst du Rollen, Pfeifen und Sägen. Du schiebst ein Blatt zur Seite: Arbeiter holzen deinen Wald ab! Nicht in deiner Heimat.',
    rules:['Drück auf die Pfeile, um zu fliegen.','Die Komplizen vom Chef werfen Seile, Netze, Kescher und Körbe nach dir. Weich aus!','Lock alle 6 Arbeiter auf die linke Seite vom Baumstamm.','Dann schnapp dir den Schlüssel vom Hals des Chefs, flieg durch die Tür und befreie deinen Artgenossen.','Wirst du eingefangen, musst du das Level wiederholen.'],
    start:'LOSFLIEGEN!',skip:'TIPPEN ZUM ÜBERSPRINGEN',from:'STARTEN BEI LEVEL',diff:['LEICHT','MITTEL','SCHWER'],restart:'Neu starten',
    lvl:n=>'LVL '+n+'/3',lured:n=>'GELOCKT '+n+'/6',keyReady:'ALLE GELOCKT: HOL DEN SCHLÜSSEL!',escape:'FLIEG DURCH DIE TÜR!',
    level:n=>'LEVEL '+n+'!',lureSub:'LOCK ALLE 6 NACH LINKS!',notYet:'NOCH NICHT!',snatch:'SCHNAPP!',door:'ZUR TÜR!',click:'KLICK!',free:'FREI!',saved:'GERETTET!',
    intro:['BRUMM!','PFIIIFF!','RRRATSCH!'],introBan:'NICHT IN MEINEM DSCHUNGEL!',caughtPop:'ERWISCHT!',huh:'HÄ?',
    caughtT:'GEFANGEN!',caughtP:'Die Komplizen haben dich erwischt. Nochmal von vorn!',again:'NOCHMAL',
    doneT:n=>'LEVEL '+n+' GESCHAFFT!',doneP:'Dein Artgenosse ist frei, die Arbeiter ziehen ab und der Wald wächst nach. Aber da kommen noch mehr…',next:'WEITER',
    winT:'DSCHUNGEL GERETTET!',winP:'Alle drei Artgenossen sind frei und die Holzfäller sind für immer weg.',stats:(t,c)=>t+' · GEFANGEN '+c+'×',best:t=>'Bestzeit: '+t},
  fr:{name:'FR',title:'DANGER IN THE JUNGLE!',story:'Tu es un perroquet bleu en plein petit-déjeuner quand tu entends des grondements, des sifflets et des scies. Tu écartes une feuille'+NB+': des ouvriers abattent ta jungle'+NB+'!',
    rules:['Appuie sur les flèches pour voler.','L’équipe du chef te lance des cordes, des filets, des épuisettes et des paniers. Esquive'+NB+'!','Attire les 6 ouvriers à gauche du tronc.','Puis arrache la clé au cou du chef, vole jusqu’à la porte et libère ton ami.','Si tu te fais attraper, tu recommences le niveau.'],
    start:'VOLE'+NB+'!',skip:'TOUCHE POUR PASSER',from:'COMMENCER AU NIVEAU',diff:['FACILE','MOYEN','DIFFICILE'],restart:'Recommencer',
    lvl:n=>'NIV. '+n+'/3',lured:n=>'ATTIRÉS '+n+'/6',keyReady:'TOUS ATTIRÉS'+NB+': PRENDS LA CLÉ'+NB+'!',escape:'VOLE JUSQU’À LA PORTE'+NB+'!',
    level:n=>'NIVEAU '+n+NB+'!',lureSub:'ATTIRE LES 6 À GAUCHE'+NB+'!',notYet:'PAS ENCORE'+NB+'!',snatch:'HOP'+NB+'!',door:'À LA PORTE'+NB+'!',click:'CLIC'+NB+'!',free:'LIBRE'+NB+'!',saved:'SAUVÉ'+NB+'!',
    intro:['VROUM'+NB+'!','FIIIOU'+NB+'!','RRRATCH'+NB+'!'],introBan:'PAS DANS MA JUNGLE'+NB+'!',caughtPop:'ATTRAPÉ'+NB+'!',huh:'HEIN'+NB+'?',
    caughtT:'ATTRAPÉ'+NB+'!',caughtP:'L’équipe t’a eu. Recommence le niveau'+NB+'!',again:'ENCORE',

  const r=cv.getBoundingClientRect();dpr=Math.min(2,window.devicePixelRatio||1);

  const sp=getComputedStyle($('safe'));safe={t:parseFloat(sp.paddingTop)||0,r:parseFloat(sp.paddingRight)||0,b:parseFloat(sp.paddingBottom)||0,l:parseFloat(sp.paddingLeft)||0};

  // portrait: the arrows sit below the ground line; landscape: they float over the bottom corners
  const ground=land?H-safe.b-44:H-ctrlH;

  VW=W/S;GY=ground/S+.2;

// and sliding the finger over switches arrows without lifting.
const padTouch=new Map();
function paintPad(){
  for(const k in held)held[k]=0;
  for(const d of padTouch.values())held[d]=1;
  document.querySelectorAll('.pg button').forEach(b=>b.classList.toggle('on',!!held[b.dataset.d]));
}
function nearest(zone,e){
  let best=null,bd=1e9;
  for(const b of zone.querySelectorAll('button')){const r=b.getBoundingClientRect(),d=Math.hypot(e.clientX-(r.left+r.width/2),e.clientY-(r.top+r.height/2));if(d<bd){bd=d;best=b.dataset.d}}
  return best;
}
document.querySelectorAll('.pg').forEach(zone=>{
  zone.addEventListener('pointerdown',e=>{e.preventDefault();try{zone.setPointerCapture(e.pointerId)}catch(_){}padTouch.set(e.pointerId,nearest(zone,e));paintPad()});
  zone.addEventListener('pointermove',e=>{if(!padTouch.has(e.pointerId))return;const d=nearest(zone,e);if(d!==padTouch.get(e.pointerId)){padTouch.set(e.pointerId,d);paintPad()}});
  const off=e=>{if(padTouch.delete(e.pointerId))paintPad()};
  zone.addEventListener('pointerup',off);zone.addEventListener('pointercancel',off);zone.addEventListener('lostpointercapture',off);
  zone.addEventListener('contextmenu',e=>e.preventDefault());
});

function throwFrom(w){
  const L=LV[st.level-1],D=DIFFS[st.diff],p=st.parrot,o=handPos(w);
  const sp=L.speed*D.speed;
  let tx=p.x,ty=p.y;const d0=Math.hypot(tx-o.x,ty-o.y),T0=Math.max(.5,d0/sp);
  tx+=p.vx*T0*D.lead;ty+=p.vy*T0*D.lead*.5;
  tx=Math.max(.3,Math.min(9.7,tx));ty=Math.max(.4,Math.min(GY-.4,ty));
  const dx=tx-o.x,dy=ty-o.y,Tf=Math.max(.5,Math.hypot(dx,dy)/sp);
  st.projs.push({type:w.item,x:o.x,y:o.y,vx:dx/Tf,vy:(dy-.5*G*Tf*Tf)/Tf,rot:0,spin:(w.item==='net'?2:w.item==='basket'?3:7)*(dx<0?-1:1),age:0,landed:0,dud:false});
}
function catchParrot(type){
  if(st.mode!=='play')return;
  st.mode='caught';st.caught=type;st.sceneT=0;st.catches++;st.banner=null;
  popText(st.parrot.x,st.parrot.y,T.caughtPop,C.white);burst(st.parrot.x,st.parrot.y,10,'feather',2.5);
}
function lured(){let n=0;for(const w of st.workers)if(w.x<LINE)n++;return n}
function update(dt){
  if(!st)return;
  for(const p of st.parts){p.t+=dt;if(p.type!=='pop'&&p.type!=='gain'){p.vy+=(p.type==='heart'?-1:3)*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt}}
  st.parts=st.parts.filter(p=>p.t<p.life);
  if(st.banner){st.banner.t-=dt;if(st.banner.t<=0)st.banner=null}
  const p=st.parrot;if(!p)return;
  st.sceneT+=dt;p.flap+=dt*(p.sit?0:18);
  for(const w of st.workers){w.ph+=dt;if(w.stun>0)w.stun+=dt}
  if(st.mode==='intro'){
    const t=st.sceneT,pts=[[1.9,3.9,GY-2.6],[2.6,5.4,GY-3.4],[3.3,3.2,GY-1.6]];
    pts.forEach(([at,x,y],i)=>{if(t-dt<at&&t>=at)popText(x,y,T.intro[i],C.white)});
    if(t-dt<3.8&&t>=3.8)popText(p.x+.4,p.y-.7,'?',C.white);
    st.leafOff=Math.max(0,Math.min(1,(t-4.1)/.7));
    if(t-dt<6&&t>=6){popText(p.x+.4,p.y-.7,'!',C.white);p.sit=false;p.vy=-2}
    if(t>6){p.flap+=dt*18;p.y+=(BRANCH().y-.9-p.y)*Math.min(1,dt*3)}
    if(t-dt<6.2&&t>=6.2)st.banner={text:T.introBan,t:1.6,max:1.6};
    if(t>7.8)startPlay();
    return;
  }
  if(st.mode==='play'||st.mode==='escape'){
    st.runT+=dt;
    const d=dir(),k=Math.min(1,dt*10);
    p.vx+=(d.x*PV-p.vx)*k;p.vy+=(d.y*PV-p.vy)*k;
    if(st.boss.cd>0){st.boss.cd-=dt}
    p.x+=p.vx*dt;p.y+=p.vy*dt;
    p.x=Math.max(.45,Math.min(9.6,p.x));p.y=Math.max(TOP(),Math.min(GY-.45,p.y));
    if(Math.abs(p.vx)>.4)p.f=p.vx>0?1:-1;
  }
  // thrown things fly in arcs; once they hit the ground they lie there for a moment
  for(const q of st.projs){
    q.age+=dt;
    if(q.landed){q.landed+=dt;continue}
    q.vy+=G*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.rot+=q.spin*dt;
    if(q.type==='net')q.r=Math.min(.62,ITEM_R.net+q.age*.55);else q.r=ITEM_R[q.type];
    if(q.y>=GY-.12&&q.vy>0){q.y=GY-.12;q.landed=.001;q.rot=q.type==='basket'?0:q.rot}
    if(!q.dud&&!q.landed&&st.mode==='play'&&Math.hypot(q.x-p.x,q.y-p.y)<PR*.85+q.r*.7){catchParrot(q.type);q.gone=true}
  }
  st.projs=st.projs.filter(q=>!q.gone&&q.landed<1&&q.x>-1&&q.x<11);
  if(st.mode==='play'){
    const L=LV[st.level-1],D=DIFFS[st.diff];
    let busy=st.projs.filter(q=>!q.landed&&!q.dud).length+st.workers.filter(w=>w.wind>0).length;
    for(const w of st.workers){
      if(w.reload>0)w.reload-=dt;
      w.f=p.x<w.x?-1:1;
      if(w.wind>0){
        w.wind-=dt;
        if(w.wind<=0){throwFrom(w);w.reload=.9;w.cd=rnd(...L.cd)*D.cd}
        continue;   // they stand still while throwing
      }
      const tx=Math.max(.6,Math.min(7.6,p.x+w.off)),dx=tx-w.x,sp=L.walk*D.walk;
      w.walking=Math.abs(dx)>.05;w.x+=Math.sign(dx)*Math.min(Math.abs(dx),sp*dt);
      w.cd-=dt;
      if(w.cd<=0&&w.reload<=0){
        if(busy<L.max&&Math.abs(p.x-w.x)<7.5){w.wind=L.wind*D.wind;busy++}else w.cd=.25+Math.random()*.4;
      }
      // fly too close to a worker and he grabs you
      if(Math.abs(p.x-w.x)<.35&&p.y>GY-1.35){catchParrot('hands');return}
    }
    const n=lured(),all=n===st.workers.length;
    if(all&&!st.allLured)popText(BOSS_X-.2,GY-2.4,'!',C.white);
    st.allLured=all;
    // the boss: touch him only when all six are lured, otherwise he shoos you away
    const b=st.boss;b.ph+=dt;
    if(Math.abs(p.x-b.x)<.62&&p.y>GY-2.05&&b.cd<=0){
      if(all){
        b.key=false;p.key=true;st.mode='escape';st.sceneT=0;
        popText(b.x,GY-1.6,T.snatch,C.white);burst(b.x,GY-1.4,8,'spark',3);
        st.banner={text:T.door,t:1.6,max:1.6};
        for(const q of st.projs)q.dud=true;
        for(const w of st.workers){w.wind=0;w.stun=.001}
        b.stun=.001;
      }else{
        b.cd=.9;p.vx=-7;p.vy=-2;p.x-=.25;popText(b.x-.3,GY-2.2,T.notYet,C.white);
      }
    }
  }else if(st.mode==='escape'){
    const dr=DOOR();
    if(Math.hypot(p.x-dr.x,p.y-dr.y)<.8){setUI('scene');st.mode='free';st.sceneT=0;st.banner=null;st.projs=[]}
  }else if(st.mode==='free'){
    const t=st.sceneT;
    if(t-dt<1&&t>=1)st.parts.push({type:'pop',sx:.56,sy:.38,t:0,life:.8,rot:-.2,text:T.click,col:C.white});
    if(t-dt<2.1&&t>=2.1)st.parts.push({type:'pop',sx:.5,sy:.2,t:0,life:1,rot:.1,text:T.free,col:C.white});
    if(t>3.4){st.mode='outro';st.sceneT=0;const dr=DOOR();p.x=dr.x+.3;p.y=dr.y;p.key=false;st.buddy={x:dr.x+.2,y:dr.y+.2,ph:1};
      st.banner={text:T.saved,t:2.2,max:2.2}}
  }else if(st.mode==='outro'){
    const t=st.sceneT;
    for(const w of st.workers){if(t>.3){w.x+=3.6*dt;w.f=1;w.walking=true;w.stun=0}}
    if(t>.6){st.boss.x+=3*dt;st.boss.leave=1}
    for(const s of st.stumps)s.g=Math.max(0,Math.min(1,(t-.5-s.x*.06)/1.4));
    // the two parrots loop over the clearing
    const a=t*2.2;
    const tx=5+Math.cos(a)*2.6,ty=GY-4.3+Math.sin(a)*1.1;
    p.vx=(tx-p.x)*3;p.vy=(ty-p.y)*3;p.x+=p.vx*dt;p.y+=p.vy*dt;p.f=p.vx>0?1:-1;
    const bd=st.buddy;bd.ph+=dt;const bx=5+Math.cos(a-.7)*2.6,by=GY-4.3+Math.sin(a-.7)*1.1+.2;
    bd.f=bx>bd.x?1:-1;bd.x+=(bx-bd.x)*Math.min(1,dt*3);bd.y+=(by-bd.y)*Math.min(1,dt*3);
    if(Math.random()<dt*5)st.parts.push({type:'heart',x:p.x,y:p.y-.3,vx:rnd(-.4,.4),vy:-.6,rot:0,vr:0,t:0,life:1.1});
    if(t>3.6&&!card)levelDone();
  }else if(st.mode==='caught'){
    // the parrot drops to the ground, tangled up
    if(p.y<GY-.38){p.vy+=G*1.2*dt;p.y=Math.min(GY-.38,p.y+p.vy*dt);p.x+=p.vx*dt*.3}
    if(st.sceneT>1.2&&!card)showCard('caught');
  }
}

function star(x,y,R,r,n){ctx.beginPath();for(let i=0;i<n*2;i++){const a=i/(n*2)*Math.PI*2-Math.PI/2,rr=i%2?r:R;ctx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}ctx.closePath()}

function inkText(txt,x,y,size,fill,rot=0){
  ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.font=`700 ${size}px ${V('--display')}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineJoin='round';
  const rim=fill===C.pop?'#8E1D14':fill===C.white?'#2B5C8F':'#9A4F0A';

const LW=()=>Math.max(1.1,S*.028);
// hex colour scaled toward black (f<1) or white (f>1)
function shade(c,f){
  if(typeof c!=='string'||c[0]!=='#')return'rgba(40,25,18,.55)';
  const n=parseInt(c.slice(1,7),16);let r=n>>16,g=n>>8&255,b=n&255;
  if(f<=1){r*=f;g*=f;b*=f}else{const k=f-1;r+=(255-r)*k;g+=(255-g)*k;b+=(255-b)*k}
  return`rgb(${r|0},${g|0},${b|0})`;
}
// fill with a soft top-light gradient and a thin darker rim of the same colour
function inkFill(fill,lw){
  if(typeof fill==='string'&&fill[0]==='#'){
    ctx.fillStyle=fill;ctx.fill();
    ctx.lineWidth=(lw||LW())*.85;ctx.strokeStyle=shade(fill,.62);
  }else{ctx.fillStyle=fill;ctx.fill();ctx.lineWidth=(lw||LW())*.85;ctx.strokeStyle='rgba(40,25,18,.5)'}
  ctx.lineJoin='round';ctx.stroke();

// fill a path with a vertical gradient between two y values
function gradFill(y0,y1,c0,c1,rim,lw){const g=ctx.createLinearGradient(0,y0,0,y1);g.addColorStop(0,c0);g.addColorStop(1,c1);ctx.fillStyle=g;ctx.fill();if(rim){ctx.lineWidth=lw||LW();ctx.strokeStyle=rim;ctx.lineJoin='round';ctx.stroke()}}

    {trunk:'#5E9E6E',crown:'#6DB173',hi:'#8FCB86',w:[.3,.5],step:[1.1,1.8],crownY:[.2,1.4],cr:[.8,1.2],bush:'#5FA266'},
    {trunk:'#3D7A50',crown:'#47905A',hi:'#68AE6B',w:[.45,.7],step:[1.8,2.8],crownY:[-.2,.8],cr:[1,1.4],bush:'#3F8752'},
  ];
  for(const L of layers){
    for(let x=x0+R()*L.step[0];x<x1;x+=L.step[0]+R()*(L.step[1]-L.step[0])){
      const w=(L.w[0]+R()*(L.w[1]-L.w[0]))*S,cx=X(x);

    }

    g=b.createLinearGradient(0,0,0,gy);g.addColorStop(0,'rgba(240,250,215,.28)');g.addColorStop(1,'rgba(200,235,190,.12)');b.fillStyle=g;b.fillRect(0,0,W,gy);
  }

  for(let i=0;i<5;i++){
    const sx=W*(.45+R()*.6),w=S*(.4+R()*.9),ang=.35+R()*.15,len=H*1.2;
    b.save();b.translate(sx,-S*.5);b.rotate(ang);

    b.fillStyle=g;b.beginPath();b.moveTo(-w*.3,0);b.lineTo(w*.3,0);b.lineTo(w,len);b.lineTo(-w,len);b.closePath();b.fill();b.restore();
  }

  b.fillStyle='rgba(255,230,180,.12)';for(let i=0;i<60;i++){b.beginPath();b.ellipse(R()*W,gy+R()*(H-gy),S*(.04+R()*.08),S*.025,0,0,7);b.fill()}
  // mossy edge
  b.fillStyle='#5DA34A';b.beginPath();b.moveTo(0,gy+S*.12);for(let x=0;x<=W+S*.3;x+=S*.3)b.quadraticCurveTo(x+S*.15,gy-S*.06-R()*S*.06,x+S*.3,gy+S*.1);b.lineTo(W,gy+S*.2);b.lineTo(0,gy+S*.2);b.fill();
  b.fillStyle='#7CC062';b.beginPath();b.moveTo(0,gy+S*.02);for(let x=0;x<=W+S*.3;x+=S*.3)b.quadraticCurveTo(x+S*.15,gy-S*.1-R()*S*.05,x+S*.3,gy);b.lineTo(W,gy+S*.06);b.lineTo(0,gy+S*.06);b.fill();
  for(let x=0;x<W;x+=S*.12+R()*S*.18){const h=S*(.12+R()*.26),a=(R()-.5)*.9;
    b.beginPath();b.moveTo(x-S*.03,gy+2);b.quadraticCurveTo(x+Math.sin(a)*h*.5,gy-h*.6,x+Math.sin(a)*h,gy-h);b.quadraticCurveTo(x+Math.sin(a)*h*.4,gy-h*.5,x+S*.03,gy+2);
    b.fillStyle=R()<.5?'#5DA34A':'#86C96A';b.fill()}

  const tx=X(-.4),tw=X(1.75)-tx;
  b.beginPath();b.moveTo(tx,-5);b.lineTo(tx+tw,-5);b.quadraticCurveTo(tx+tw*.9,gy*.6,tx+tw*1.2,gy+S*.1);b.quadraticCurveTo(tx+tw*.5,gy-S*.25,tx-S*.6,gy+S*.1);b.closePath();
  g=b.createLinearGradient(tx,0,tx+tw*1.1,0);g.addColorStop(0,'#3E2414');g.addColorStop(.55,'#7A4A2A');g.addColorStop(.85,'#9C6638');g.addColorStop(1,'#C88A52');

  for(let i=0;i<14;i++){const y=R()*gy,x=tx+tw*(.1+R()*.75),l=S*(.5+R()*1.2);b.lineWidth=S*(.03+R()*.04);b.beginPath();b.moveTo(x,y);b.bezierCurveTo(x+S*.12,y+l*.3,x-S*.1,y+l*.6,x+S*.03,y+l);b.stroke()}
  for(let i=0;i<6;i++){const y=R()*gy,x=tx+tw*(.2+R()*.6),r=S*(.25+R()*.35);b.fillStyle='rgba(110,170,80,.55)';b.beginPath();b.ellipse(x,y,r,r*.55,R(),0,7);b.fill()}
  b.restore();
  // canopy leaves hanging in from the top

  for(const[x,y,r]of top){g=b.createRadialGradient(x+r*.3,y-r*.2,r*.1,x,y,r*1.1);g.addColorStop(0,'#6DBA5E');g.addColorStop(1,'#2A6B3E');b.fillStyle=g;b.beginPath();b.arc(x,y,r,0,7);b.fill()}
  for(let i=0;i<22;i++){const x=X(x0+R()*(x1-x0)),y=S*(.1+R()*.6),r=S*(.5+R()*.6);
    leafShape(x,y,r,Math.PI/2+(R()-.5)*1.6);g=b.createLinearGradient(x,y,x,y+r);g.addColorStop(0,'#3F8F4F');g.addColorStop(1,'#62AE5E');b.fillStyle=g;b.fill()}

    const x=X(1.7+R()*8),len=S*(1.2+R()*Math.max(.5,Math.min(5,GY*.3))),sw=S*.2*(R()<.5?-1:1);
    b.beginPath();b.moveTo(x,S*.2);b.bezierCurveTo(x+sw,len*.35,x-sw,len*.7,x+sw*.3,len);b.lineCap='round';b.lineWidth=Math.max(1.5,S*.05);b.strokeStyle='#3C7A31';b.stroke();
    for(let k=1;k<7;k++){const t=k/7,yy=S*.2+(len-S*.2)*t,xx=x+sw*Math.sin(t*3.1)*.6,r=S*.24;leafShape(xx,yy,r,(k%2?.5:Math.PI-.5));b.fillStyle=k%2?'#5FA84A':'#7CC062';b.fill()}
  }
  W=sW;camX=sC;bgDirty=false;
}
function shadeB(c,f){return shade(c,f)}
// big dark leaves in the very front, gently swaying; plus a soft vignette and drifting light motes

  for(const side of[-1,1])for(let i=0;i<4;i++)fgLeaves.push({x:side<0?R()*W*.12:W-R()*W*.12,y:H+S*.2,r:S*(1.1+R()*.9),a:(side<0?-1:-Math.PI)+(side<0?1:-1)*(.2+R()*.9),ph:R()*7,c:R()<.5?'#1E5233':'#28663F'});

// inside the tree: the cage with the friend, the key turns, the door swings open
function drawFree(t){
  const now=performance.now()/1000,cs=Math.min(W*.3,H*.19),cx=W/2,cy=H*.46,lw=Math.max(2,cs*.035);
  // the hollow
  ctx.fillStyle='#2E1C10';ctx.fillRect(0,0,W,H);
  let g=ctx.createRadialGradient(cx,cy-cs*.3,cs*.3,cx,cy,Math.max(W,H)*.65);g.addColorStop(0,'#A9743F');g.addColorStop(.45,'#6B4426');g.addColorStop(1,'#24150B');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(30,15,5,.25)';ctx.lineWidth=lw*1.2;for(let k=1;k<7;k++){ctx.beginPath();ctx.ellipse(cx,cy+cs*.2,cs*1.25*k,cs*1.05*k,0,0,7);ctx.stroke()}
  g=ctx.createRadialGradient(cx,cy-cs*1.6,0,cx,cy-cs*1.6,cs*2.6);g.addColorStop(0,'rgba(255,235,170,.55)');g.addColorStop(1,'rgba(255,235,170,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const L=cx-cs*.85,R=cx+cs*.85,top=cy-cs*.55,bot=cy+cs*.75,dl=cx-cs*.28,dr=cx+cs*.28;
  const open=Math.max(0,Math.min(1,(t-1.5)/.5)),out=Math.max(0,Math.min(1,(t-1.95)/1.2));
  const bar=(x1,y1,x2,y2,w)=>{ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.lineWidth=w||lw;ctx.lineCap='round';ctx.strokeStyle='#5E3A12';ctx.stroke();ctx.lineWidth=(w||lw)*.45;ctx.strokeStyle='#E8B85A';ctx.stroke()};
  // chain and ring
  bar(cx,0,cx,top-cs*.62,lw*1.2);ctx.beginPath();ctx.arc(cx,top-cs*.62,cs*.07,0,7);ctx.lineWidth=lw;ctx.strokeStyle='#C99A3A';ctx.stroke();
  // back of the cage: dome and back bars (behind the friend)
  ctx.beginPath();ctx.ellipse(cx,bot,cs*.85,cs*.17,0,0,7);gradFill(bot-cs*.17,bot+cs*.17,'#C98E58','#7A4A2A');
  ctx.save();ctx.globalAlpha=.55;for(let k=-3;k<=3;k++){const x=cx+k*cs*.24;bar(x,bot-cs*.05,x,top+cs*.02,lw*.8)}ctx.restore();
  // perch and the friend
  bar(cx-cs*.55,cy+cs*.32,cx+cs*.55,cy+cs*.32,lw*1.3);
  const fu=cs*.62;
  if(out<=0)drawParrot(cx-cs*.05,cy+cs*.12,fu,-1,0,{sit:true,pal:st.pal,seed:1.3});
  // front bars, leaving a gap for the door
  for(let k=-3;k<=3;k++){const x=cx+k*cs*.27;if(x>dl+2&&x<dr-2)continue;bar(x,bot,x,top+cs*.05)}
  ctx.beginPath();ctx.ellipse(cx,top+cs*.05,cs*.85,cs*.72,0,Math.PI,0);ctx.lineWidth=lw*1.5;ctx.strokeStyle='#5E3A12';ctx.stroke();ctx.lineWidth=lw*.6;ctx.strokeStyle='#E8B85A';ctx.stroke();
  for(const a of[-.55,0,.55]){ctx.beginPath();ctx.moveTo(cx,top-cs*.67);ctx.quadraticCurveTo(cx+a*cs*.9,top-cs*.55,cx+a*cs*1.45,top+cs*.05);ctx.lineWidth=lw;ctx.strokeStyle='#5E3A12';ctx.stroke();ctx.lineWidth=lw*.45;ctx.strokeStyle='#E8B85A';ctx.stroke()}
  bar(L,top+cs*.05,R,top+cs*.05,lw*1.4);bar(L,bot-cs*.02,R,bot-cs*.02,lw*1.4);
  // the door: a little panel of bars hinged on its left side, swinging open toward us
  const dw=(dr-dl)*Math.cos(open*Math.PI*.48),dTop=top+cs*.22;
  ctx.save();
  const sk=open*cs*.12;   // perspective: the swinging edge grows as it comes closer
  ctx.beginPath();ctx.moveTo(dl,dTop);ctx.lineTo(dl+dw,dTop-sk);ctx.lineTo(dl+dw,bot+sk);ctx.lineTo(dl,bot);ctx.closePath();

  bar(dl,dTop,dl+dw,dTop-sk,lw*1.2);bar(dl,bot,dl+dw,bot+sk,lw*1.2);

    ctx.beginPath();ctx.arc(0,-cs*.1,cs*.085,Math.PI,0);ctx.lineWidth=lw*1.4;ctx.strokeStyle='#8A949B';ctx.stroke();
    ctx.beginPath();ctx.roundRect?ctx.roundRect(-cs*.13,-cs*.11,cs*.26,cs*.22,cs*.05):ctx.rect(-cs*.13,-cs*.11,cs*.26,cs*.22);gradFill(-cs*.11,cs*.11,'#FFE07A','#D99A00','#8A5A00',lw*.7);

  if(out>0)for(let k=0;k<3;k++){const hx=dr+out*W*.5-k*cs*.4,hy=cy-cs*.3-out*cs*.9+Math.sin(now*4+k)*cs*.1;ctx.save();ctx.globalAlpha=Math.max(0,1-out)*.9;ctx.beginPath();const r=cs*.06;ctx.moveTo(hx,hy+r);ctx.bezierCurveTo(hx-r*2,hy-r*.4,hx-r*.6,hy-r*1.6,hx,hy-r*.5);ctx.bezierCurveTo(hx+r*.6,hy-r*1.6,hx+r*2,hy-r*.4,hx,hy+r);ctx.fillStyle='#F04E3E';ctx.fill();ctx.restore()}
}
function draw(){
  if(!st)return;
  if(st.mode==='free'){drawFree(st.sceneT);drawParts(true);return}
  if(bgDirty)renderBg();
  ctx.drawImage(bcv,X(bgX0),0,bcv.width/dpr,bcv.height/dpr);
  drawBranch();drawDoor();
  for(const s of st.stumps)drawStump(s);
  if(st.mode!=='intro'&&st.mode!=='outro'&&st.mode!=='menu')drawLog();
  for(const q of st.projs)if(q.landed)drawItem(q.type,X(q.x),Y(q.y),S*(q.r||ITEM_R[q.type]),q.rot,1-q.landed);
  drawWorker(st.boss,true);
  for(const w of st.workers)drawWorker(w,false);
  for(const q of st.projs)if(!q.landed)drawItem(q.type,X(q.x),Y(q.y),S*q.r,q.rot,q.dud?.6:1);
  const p=st.parrot;
  if(st.buddy)drawParrot(X(st.buddy.x),Y(st.buddy.y),S,st.buddy.f||1,st.buddy.ph*18,{seed:1.7,pal:st.pal});
  drawParrot(X(p.x),Y(p.y),S,p.f,p.flap,{key:p.key,sit:p.sit,vy:p.vy});
  if(st.mode==='intro'||st.mode==='menu'){
    if(st.mode==='menu'||st.sceneT<3.8){ctx.beginPath();ctx.ellipse(X(p.x+.5*p.f),Y(p.y-.12),S*.1,S*.06,.4,0,7);gradFill(Y(p.y-.18),Y(p.y-.06),'#FFC86B','#F08A1A')}
    if(st.mode==='intro')drawBigLeaf(st.leafOff);
  }
  if(st.mode==='caught'&&st.caught)drawItem(st.caught,X(p.x),Y(p.y),S*.42,.2);
  drawFg();
  drawParts(false);
  if(st.banner){
    const bn=st.banner,k=Math.min(1,(bn.max-bn.t)*6),sz=Math.min(54,W*.11),y=safe.t+H*.26;
    ctx.save();ctx.globalAlpha=Math.min(1,bn.t*3);
    inkText(bn.text,W/2,y,sz*k+1,C.paper,-.04);
    if(bn.sub)inkText(bn.sub,W/2,y+sz*.9,sz*.42*k+1,C.white,.02);
    ctx.restore();
  }
  if(st.mode==='menu')drawSign();
  if(st.mode==='play'||st.mode==='escape'||st.mode==='caught'){drawIndicators();drawHud()}
}

// ---------- in-world HUD ----------
function glassCircle(x,y,r,ring){
  ctx.beginPath();ctx.arc(x,y,r,0,7);
  const g=ctx.createLinearGradient(0,y-r,0,y+r);g.addColorStop(0,'rgba(255,255,255,.32)');g.addColorStop(1,'rgba(255,255,255,.1)');
  ctx.fillStyle=g;ctx.shadowColor='rgba(0,25,10,.35)';ctx.shadowBlur=8;ctx.shadowOffsetY=3;ctx.fill();ctx.shadowColor='transparent';
  ctx.lineWidth=ring?3:1.5;ctx.strokeStyle=ring||'rgba(255,255,255,.45)';ctx.stroke();
}
function helmetIcon(x,y,r,on){
  ctx.save();ctx.globalAlpha=on?1:.55;
  ctx.beginPath();ctx.arc(x,y+r*.18,r*.55,0,7);ctx.fillStyle='#F6C9A3';ctx.fill();
  ctx.beginPath();ctx.arc(x,y+r*.05,r*.62,Math.PI,0);ctx.closePath();gradFill(y-r*.6,y+r*.05,'#FFE680','#F2B705');
  ctx.beginPath();ctx.moveTo(x-r*.72,y+r*.06);ctx.lineTo(x+r*.72,y+r*.06);ctx.lineWidth=r*.16;ctx.lineCap='round';ctx.strokeStyle='#D99A00';ctx.stroke();
  ctx.restore();
}
function hudText(txt,x,y,size,align='left',col='#fff'){
  ctx.save();ctx.font=`600 ${size}px ${V('--display')}`;ctx.textAlign=align;ctx.textBaseline='middle';
  ctx.shadowColor='rgba(0,0,0,.55)';ctx.shadowBlur=4;ctx.shadowOffsetY=1;ctx.fillStyle=col;ctx.fillText(txt,x,y);ctx.restore();
}
function drawHud(){
  const now=performance.now()/1000,y=safe.t+35,x0=safe.l+30,n=lured(),gap=Math.min(34,(W-safe.l-safe.r-110)/6);
  // six helmets: one lights up for every worker on the lure side
  for(let i=0;i<6;i++){
    const on=i<n,cx=x0+i*gap,r=13;
    glassCircle(cx,y,r,on?'#8EF07A':null);
    helmetIcon(cx,y,r,on);
    if(on){ctx.beginPath();ctx.arc(cx+r*.7,y+r*.7,6,0,7);ctx.fillStyle='#3FAF4A';ctx.fill();ctx.beginPath();ctx.moveTo(cx+r*.7-3,y+r*.7);ctx.lineTo(cx+r*.7-1,y+r*.7+2.2);ctx.lineTo(cx+r*.7+3,y+r*.7-2);ctx.lineWidth=1.8;ctx.strokeStyle='#fff';ctx.stroke()}
  }
  // level: three little cages, the freed ones glowing blue
  for(let l=1;l<=LEVELS;l++){const cx=x0+(l-1)*16-4,cy=y+27;ctx.beginPath();ctx.arc(cx,cy,5,0,7);ctx.fillStyle=l<st.level?'#6CB8FF':l===st.level?'#FFC53D':'rgba(255,255,255,.3)';ctx.fill()}
  hudText(T.lvlLbl+' '+st.level+'/3',x0+40,y+27,12);
  // objective toast
  let msg=null,key=false;
  if(st.mode==='play'&&st.allLured){msg=T.getKey;key=true}
  if(st.mode==='escape')msg=T.toDoor;
  if(msg){
    const ty=y+62,pulse=1+.04*Math.sin(now*6);
    ctx.save();ctx.font=`600 15px ${V('--display')}`;const tw=ctx.measureText(msg).width+(key?34:20);
    ctx.translate(W/2,ty);ctx.scale(pulse,pulse);
    ctx.beginPath();ctx.roundRect?ctx.roundRect(-tw/2,-17,tw,34,17):ctx.rect(-tw/2,-17,tw,34);
    const g=ctx.createLinearGradient(0,-17,0,17);g.addColorStop(0,'#FFE58A');g.addColorStop(1,'#FFC53D');ctx.fillStyle=g;
    ctx.shadowColor='rgba(255,197,61,.6)';ctx.shadowBlur=16;ctx.fill();ctx.shadowColor='transparent';
    ctx.fillStyle='#5A3B00';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(msg,key?10:0,1);
    if(key)drawKey(-tw/2+18,0,26,0);
    ctx.restore();
  }
}
// arrows at the screen edge for whatever is off camera: workers (with a count), the boss, the door
function drawIndicators(){
  const left=[],right=[];
  for(const w of st.workers){const x=X(w.x);if(x<-8)left.push(w);else if(x>W+8)right.push(w)}
  const yW=Math.min(Y(GY-1.1),H-ctrlH-30);
  const ind=(side,y,draw)=>{
    const x=side<0?safe.l+24:W-safe.r-24,now=performance.now()/1000,bob=Math.sin(now*5)*3*side;
    glassCircle(x+bob,y,18);
    ctx.beginPath();ctx.moveTo(x+bob+side*27,y);ctx.lineTo(x+bob+side*19,y-6);ctx.lineTo(x+bob+side*19,y+6);ctx.closePath();ctx.fillStyle='rgba(255,255,255,.9)';ctx.fill();
    draw(x+bob,y);

  const crowd=(arr,side)=>{if(!arr.length)return;ind(side,yW,(x,y)=>{helmetIcon(x,y-1,15,true);
    ctx.beginPath();ctx.arc(x+side*-12,y+11,8,0,7);ctx.fillStyle='#F04E3E';ctx.fill();hudText(String(arr.length),x+side*-12,y+11.5,11,'center')})};
  crowd(left,-1);crowd(right,1);

  if(st.mode==='escape'&&X(DOOR().x)<-8)ind(-1,Y(DOOR().y),(x,y)=>{ctx.beginPath();ctx.roundRect?ctx.roundRect(x-6,y-9,12,18,[6,6,1,1]):ctx.rect(x-6,y-9,12,18);ctx.fillStyle='#8A5A33';ctx.fill()});
}
// title sign hanging from two vines
function drawSign(){
  const now=performance.now()/1000,sw=land?Math.min(W*.42,380):Math.min(W*.84,400),sh=sw*.46,cx=land?W*.28:W/2,top=land?Math.max(safe.t+60,H*.5-sh*.5-20):safe.t+64+Math.min(30,H*.03),a=Math.sin(now*1.1)*.025;
  ctx.save();ctx.translate(cx,top-50);ctx.rotate(a);
  for(const sd of[-1,1]){ctx.beginPath();ctx.moveTo(sd*sw*.36,-top);ctx.bezierCurveTo(sd*sw*.38,-top*.4,sd*sw*.33,0,sd*sw*.36,50+sh*.1);ctx.lineWidth=5;ctx.strokeStyle='#3C7A31';ctx.lineCap='round';ctx.stroke();
    for(let k=0;k<4;k++){const yy=-top*.75+k*(top*.75+40)/4;ctx.save();ctx.translate(sd*sw*.36+(k%2?6:-6),yy);ctx.rotate(k%2?.6:Math.PI-.6);ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(9,-8,18,0);ctx.quadraticCurveTo(9,8,0,0);ctx.fillStyle=k%2?'#5FA84A':'#7CC062';ctx.fill();ctx.restore()}}
  ctx.translate(0,50);
  // plank
  ctx.shadowColor='rgba(0,20,8,.45)';ctx.shadowBlur=24;ctx.shadowOffsetY=10;
  ctx.beginPath();ctx.roundRect?ctx.roundRect(-sw/2,0,sw,sh,sh*.14):ctx.rect(-sw/2,0,sw,sh);
  let g=ctx.createLinearGradient(0,0,0,sh);g.addColorStop(0,'#C98E58');g.addColorStop(.5,'#A86C3C');g.addColorStop(1,'#80502A');ctx.fillStyle=g;ctx.fill();ctx.shadowColor='transparent';
  ctx.save();ctx.clip();ctx.strokeStyle='rgba(70,35,15,.28)';ctx.lineWidth=2;
  for(let k=1;k<6;k++){const yy=sh*k/6;ctx.beginPath();ctx.moveTo(-sw/2,yy);ctx.bezierCurveTo(-sw*.2,yy+4,sw*.1,yy-5,sw/2,yy+2);ctx.stroke()}
  ctx.fillStyle='rgba(255,230,190,.18)';ctx.fillRect(-sw/2,0,sw,sh*.12);ctx.restore();
  ctx.lineWidth=3;ctx.strokeStyle='#5E3519';ctx.stroke();
  for(const sd of[-1,1]){ctx.beginPath();ctx.arc(sd*sw*.36,sh*.13,4.5,0,7);gradFill(sh*.13-5,sh*.13+5,'#E2E6EA','#7A858C')}

}

function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(!paused&&st&&!st.paused){update(dt);moveCam(dt);captions()}
  draw();requestAnimationFrame(loop);
}

// ---------- flow ----------
let capIdx=-1;
function captions(){
  if(st.mode!=='intro')return;
  const t=st.sceneT,i=t<1.7?0:t<4.1?1:2;
  if(i!==capIdx){capIdx=i;const c=$('caption');c.style.opacity=0;setTimeout(()=>{c.textContent=T.captions[i];c.style.opacity=1},capIdx===0?0:250)}
}
function setUI(mode){
  $('menu').hidden=mode!=='menu';$('cine').hidden=mode!=='intro';
  $('ctrl').classList.toggle('off',mode!=='play');$('pauseBtn').hidden=mode!=='play';
  if(mode!=='sheet'){$('sheetOv').hidden=true;card=null;cv.classList.remove('dim')}
  if(mode!=='menu')$('howOv').hidden=true;
  padTouch.clear();paintPad();
}
function fadeTo(cb){
  const f=$('fade');f.classList.add('on');
  setTimeout(()=>{cb();requestAnimationFrame(()=>requestAnimationFrame(()=>f.classList.remove('on')))},320);
}
function begin(level){
  try{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{})}catch(_){}
  fadeTo(()=>{st=fresh(level,level===1);camX=camMin();newLevel(level,level===1)});
}
function toMenu(){
  fadeTo(()=>{st=fresh(1,false);newLevel(1,true);st.mode='menu';setUI('menu');paintMenu();camX=camTarget()});
}
function pause(){if(!st||st.paused)return;st.paused=true;showCard('pause')}
function resume(){if(!st)return;st.paused=false;last=performance.now();setUI('play')}
function levelDone(){
  if(st.level<LEVELS){setReached(st.level+1);showCard('done')}
  else{
    let best=null;
    if(st.fromStart){try{const b=+localStorage.getItem(bestKey(st.diff))||0;best=b&&b<st.runT?b:st.runT;localStorage.setItem(bestKey(st.diff),best)}catch(_){best=st.runT}}
    else{try{best=+localStorage.getItem(bestKey(st.diff))||null}catch(_){}}
    st.best=best;showCard('win');
  }
}
function act(icon,label,fn,main){
  const b=document.createElement('button');b.type='button';b.className='act'+(main?' main':'');
  b.innerHTML='<span class="glass round">'+ICON[icon]+'</span>';const s=document.createElement('span');s.textContent=label;b.append(s);
  b.addEventListener('click',fn);return b;
}
function stat(icon,txt){const d=document.createElement('div');d.className='stat glass';d.innerHTML=ICON[icon];d.append(txt);return d}
function showCard(kind){
  setUI('sheet');card={kind};
  const sh=$('sheet');sh.className='sheet glass'+(kind==='caught'?' bad':'');
  cv.classList.toggle('dim',kind==='caught'||kind==='pause');
  const title={caught:T.caughtT,done:T.doneT(st.level),win:T.winT,pause:T.pause}[kind];
  const text={caught:T.caughtP,done:T.doneP,win:T.winP,pause:''}[kind];
  $('sTitle').textContent=title;$('sText').textContent=text;$('sText').hidden=!text;
  const freed=kind==='done'?st.level:kind==='win'?3:0;
  $('sCages').hidden=!freed;
  $('sCages').replaceChildren(...[1,2,3].map(l=>{const s=document.createElement('span');s.className='glass'+(l<=freed?' free':'');s.innerHTML=l<=freed?ICON.bird:ICON.cage;return s}));
  if(freed)$('sCages').setAttribute('aria-label',T.freed(freed));
  const stats=[];
  if(kind==='done'||kind==='win')stats.push(stat('clock',fmt(st.runT)));
  if(kind==='win'){stats.push(stat('net',T.caught+' '+st.catches+'×'));if(st.best)stats.push(stat('trophy',T.bestL+' '+fmt(st.best)))}
  $('sStats').replaceChildren(...stats);$('sStats').hidden=!stats.length;
  const acts=[act('home',T.menu,toMenu)];
  if(kind==='caught')acts.push(act('retry',T.retry,()=>fadeTo(()=>newLevel(st.level,false)),true));
  if(kind==='done')acts.push(act('play',T.next,()=>fadeTo(()=>newLevel(st.level+1,false)),true));
  if(kind==='win')acts.push(act('retry',T.retry,()=>begin(1),true));
  if(kind==='pause'){acts.push(act('retry',T.restartL,()=>fadeTo(()=>{st.paused=false;newLevel(st.level,false)})));acts.push(act('play',T.resume,resume,true))}
  $('sActs').replaceChildren(...acts);
  $('sheetOv').hidden=false;
  setTimeout(()=>{const m=$('sActs').querySelector('.main');m&&m.focus({preventScroll:true})},60);
}
$('playBtn').addEventListener('click',()=>begin(startLvl||1));
$('pauseBtn').addEventListener('click',e=>{e.currentTarget.blur();pause()});
$('howBtn').addEventListener('click',()=>{$('howOv').hidden=false;$('howClose').focus()});
$('howClose').addEventListener('click',()=>{$('howOv').hidden=true});
$('howOv').addEventListener('click',e=>{if(e.target===e.currentTarget)$('howOv').hidden=true});

// title screen: the parrot at breakfast, workers sawing off to the right
st=fresh(1,false);
applyLang(lang,false);
resize();newLevel(1,true);st.mode='menu';setUI('menu');camX=camTarget();
document.fonts&&document.fonts.ready.then(()=>{bgDirty=true});
requestAnimationFrame(loop);
// test hook
window.__jungle={get st(){return st},keys,held,begin,startPlay,pause,toMenu};
function drawParts(screen){
  for(const p of st.parts){
    const k=p.t/p.life;
    if(screen&&p.sx==null)continue;
    if(p.type==='feather'){ctx.save();ctx.translate(X(p.x),Y(p.y));ctx.rotate(p.rot);ctx.globalAlpha=1-Math.max(0,k-.6)/.4;ctx.beginPath();ctx.ellipse(0,0,S*.12,S*.04,0,0,7);inkFill(C.blue,1.5);ctx.restore();continue}
    if(p.type==='spark'){ctx.save();ctx.globalAlpha=1-k;star(X(p.x),Y(p.y),S*.12,S*.05,5);inkFill(C.paper,1.5);ctx.restore();continue}
    if(p.type==='heart'){const x=X(p.x),y=Y(p.y),r=S*.12;ctx.save();ctx.globalAlpha=1-k;ctx.beginPath();ctx.moveTo(x,y+r);ctx.bezierCurveTo(x-r*2,y-r*.4,x-r*.6,y-r*1.6,x,y-r*.5);ctx.bezierCurveTo(x+r*.6,y-r*1.6,x+r*2,y-r*.4,x,y+r);inkFill(C.pop,1.5);ctx.restore();continue}
    if(p.type!=='pop')continue;
    let px=p.sx!=null?p.sx*W:X(p.x),py=p.sx!=null?p.sy*H:Y(p.y);
    const sc=Math.min(1,k*5)*(1-k*.3),R=Math.max(24,S*.85)*sc,yy=py-S*.3-k*S*.4;
    px=Math.max(R*1.3,Math.min(W-R*1.3,px));
    ctx.save();ctx.globalAlpha=1-Math.max(0,k-.7)/.3;
    ctx.lineJoin='round';star(px,yy,R,R*.7,10);ctx.shadowColor='rgba(0,0,0,.3)';ctx.shadowBlur=R*.4;ctx.shadowOffsetY=R*.1;ctx.fillStyle='rgba(255,253,246,.96)';ctx.fill();ctx.shadowColor='transparent';ctx.lineWidth=R*.12;ctx.strokeStyle='rgba(255,253,246,.96)';ctx.stroke();
    const fs=Math.min(R*.5+1,R*2.4/Math.max(2,p.text.length*.55));
    inkText(p.text,px,yy,fs,C.pop,p.rot);ctx.restore();
  }
}
