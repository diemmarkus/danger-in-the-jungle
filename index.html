<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#FFD93B">
<title>Danger in the Jungle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Kalam:wght@400;700&display=swap">
<style>
/* Layout: one-screen comic panel — inked HUD strip on top, the jungle clearing in the middle, the arrow pad at the bottom. */
:root{
  --paper:#FFD93B;      /* comic yellow */
  --ink:#16120F;        /* outlines */
  --jungle:#4FAE5A;     /* jungle backdrop */
  --deep:#2B7A43;       /* far trees */
  --leaf:#8FDB6A;       /* highlights */
  --hedge:#2E9A4B;      /* canopy */
  --bark:#8A5A33;
  --dirt:#B07A45;
  --pop:#E8322E;        /* danger */
  --blue:#2F7FE0;       /* the parrot */
  --vest:#FF8A1F;       /* workers */
  --soda:#7FE3F0;
  --white:#FFFDF6;
  --display:"Bangers","Impact","Arial Black",sans-serif;
  --hand:"Kalam","Comic Sans MS","Chalkboard SE",cursive;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;margin:0}
html{background:var(--paper)}
body{background:var(--paper);color:var(--ink);font-family:var(--hand);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
.app{height:100%;display:flex;flex-direction:column;gap:8px;padding-block:10px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
.hud{display:flex;align-items:center;gap:12px;font-family:var(--display);letter-spacing:.04em}
.chip{background:var(--white);border:3px solid var(--ink);border-radius:6px;padding:2px 10px;font-size:20px;box-shadow:3px 3px 0 var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.restart{flex:none;width:40px;height:34px;display:grid;place-items:center;background:var(--leaf);color:var(--ink);border:3px solid var(--ink);border-radius:6px;box-shadow:3px 3px 0 var(--ink);padding:0;cursor:pointer}
.restart svg{width:22px;height:22px;display:block}
.restart:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.restart:focus-visible{outline:3px dashed var(--pop);outline-offset:3px}
.meter{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.meter span{font-size:13px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:16px;background:var(--white);border:3px solid var(--ink);border-radius:6px;box-shadow:3px 3px 0 var(--ink);overflow:hidden}
.fill{height:100%;width:0;background:var(--vest);background-image:radial-gradient(rgba(0,0,0,.2) 1.5px,transparent 2px);background-size:6px 6px;transition:width .2s}
.fill.ready{background-color:var(--paper);animation:blink .3s steps(2) infinite}
@keyframes blink{50%{background-color:var(--leaf)}}
.stage{position:relative;flex:1;min-height:0;margin-left:calc(-1*max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1*max(16px,env(safe-area-inset-right,0px)));touch-action:none;border-block:3px solid var(--ink)}
canvas{display:block;width:100%;height:100%}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px}
.card{box-sizing:border-box;width:min(350px,100%);background:var(--white);border:4px solid var(--ink);border-radius:10px;box-shadow:7px 7px 0 var(--ink);padding:18px 20px;text-align:center;transform:rotate(-1.5deg);max-height:100%;overflow-y:auto}
.card h1{font-family:var(--display);font-size:52px;line-height:.9;margin:0 0 6px;letter-spacing:.03em;color:var(--blue);-webkit-text-stroke:2px var(--ink);text-shadow:4px 4px 0 var(--ink);text-wrap:balance}
#cardOv.bad h1{color:var(--pop)}
#cardOv.good h1{color:var(--hedge)}
.card p{margin:6px 0;font-size:16px;line-height:1.35}
.card ul{list-style:none;padding:0;margin:8px 0;text-align:left;font-size:14px;line-height:1.25;display:grid;gap:3px}
.card li::before{content:"★ ";color:var(--pop)}
.btn{font-family:var(--display);font-size:28px;letter-spacing:.06em;background:var(--leaf);color:var(--ink);border:4px solid var(--ink);border-radius:10px;padding:8px 26px;box-shadow:5px 5px 0 var(--ink);cursor:pointer;margin-top:8px}
.btn:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink)}
.btn:focus-visible{outline:3px dashed var(--pop);outline-offset:4px}
.big{font-family:var(--display);font-size:22px;letter-spacing:.04em}
.hint{position:absolute;left:50%;transform:translateX(-50%);bottom:10px;background:var(--white);border:3px solid var(--ink);border-radius:6px;box-shadow:3px 3px 0 var(--ink);padding:2px 10px;font-family:var(--display);letter-spacing:.05em;font-size:14px;white-space:nowrap;pointer-events:none}
.diffs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 4px}
.diffs button{font-family:var(--display);font-size:17px;letter-spacing:.02em;background:var(--white);color:var(--ink);border:3px solid var(--ink);border-radius:8px;padding:5px 2px;box-shadow:3px 3px 0 var(--ink);cursor:pointer;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.diffs button[aria-pressed="true"]{background:var(--paper);transform:translate(-1px,-1px) rotate(-2deg);box-shadow:4px 4px 0 var(--ink)}
.diffs button:focus-visible{outline:3px dashed var(--pop);outline-offset:2px}
.lvls{margin:6px 0 2px}
.lvls>span{display:block;font-family:var(--display);letter-spacing:.05em;font-size:14px;margin-bottom:4px}
.lvlrow{display:flex;justify-content:center;gap:6px}
.lvlrow button{font-family:var(--display);font-size:17px;width:40px;height:32px;padding:0;background:var(--white);color:var(--ink);border:2px solid var(--ink);border-radius:6px;box-shadow:2px 2px 0 var(--ink);cursor:pointer}
.lvlrow button[aria-pressed="true"]{background:var(--pop);color:var(--white)}
.lvlrow button:focus-visible{outline:3px dashed var(--pop);outline-offset:2px}
.langs{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:14px}
.langs button{font-family:var(--display);font-size:15px;letter-spacing:.06em;background:var(--white);color:var(--ink);border:2px solid var(--ink);border-radius:6px;padding:2px 8px;box-shadow:2px 2px 0 var(--ink);cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--paper)}
.langs button:focus-visible{outline:3px dashed var(--pop);outline-offset:2px}
/* arrow pad: left/right under the left thumb, up/down under the right thumb */
.pad{flex:none;display:flex;justify-content:space-between;align-items:center;padding:2px 4px calc(10px + env(safe-area-inset-bottom,0px));touch-action:none}
.pg{display:flex;gap:12px}
.pg.v{flex-direction:column;gap:8px}
.pad button{width:68px;height:52px;display:grid;place-items:center;background:var(--white);color:var(--ink);border:4px solid var(--ink);border-radius:12px;box-shadow:4px 4px 0 var(--ink);padding:0;cursor:pointer;touch-action:none}
.pg.v button{height:46px}
.pad button svg{width:30px;height:30px;display:block}
.pad button.on{background:var(--paper);transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.pad button:focus-visible{outline:3px dashed var(--pop);outline-offset:2px}
</style>
<style>:root{padding:env(safe-area-inset-top,0px) 0 0;box-sizing:border-box;height:100%}body{font-size:14px}</style>
</head>
<body>
<div class="app">
  <div class="hud">
    <div class="chip" id="lvl">LVL 1/3</div>
    <div class="meter"><span id="lureLbl">LURED 0/6</span><div class="bar"><div class="fill" id="fill"></div></div></div>
    <button type="button" class="restart" id="restartBtn" aria-label="Restart" title="Restart" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/><path d="M20.5 3.5v5.5H15z" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg></button>
  </div>
  <div class="stage" id="stage">
    <canvas id="c"></canvas>
    <div class="hint" id="hint" hidden data-i18n="skip">TAP TO SKIP</div>
    <div class="overlay" id="startOv">
      <div class="card">
        <h1 data-i18n="title">DANGER IN THE JUNGLE!</h1>
        <p data-i18n="story">You're a blue parrot.</p>
        <ul id="rules"></ul>
        <div class="diffs" role="group" aria-label="Difficulty"></div>
        <div class="lvls" hidden><span data-i18n="from">START AT LEVEL</span><div class="lvlrow" role="group"></div></div>
        <button class="btn" id="startBtn" data-i18n="start">FLY!</button>
        <div class="langs" id="langs" role="group" aria-label="Language"></div>
      </div>
    </div>
    <div class="overlay" id="cardOv" hidden>
      <div class="card">
        <h1 id="cTitle">CAUGHT!</h1>
        <p id="cText"></p>
        <p class="big" id="cBig" hidden></p>
        <p id="cBest" hidden></p>
        <div class="diffs" id="cDiffs" role="group" aria-label="Difficulty" hidden></div>
        <button class="btn" id="cBtn">AGAIN</button>
      </div>
    </div>
  </div>
  <div class="pad" id="pad">
    <div class="pg">
      <button type="button" data-d="l" aria-label="Left"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 4 6 12l10 8z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></button>
      <button type="button" data-d="r" aria-label="Right"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4l10 8-10 8z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></button>
    </div>
    <div class="pg v">
      <button type="button" data-d="u" aria-label="Up"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17 12 6l8 11z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></button>
      <button type="button" data-d="d" aria-label="Down"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7l8 11 8-11z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></button>
    </div>
  </div>
</div>

<script>

// ---------- input ----------
document.querySelectorAll('.pad button').forEach(b=>{

const KMAP={ArrowLeft:'l',a:'l',ArrowRight:'r',d:'r',ArrowUp:'u',w:'u',ArrowDown:'d',s:'d'};
addEventListener('keydown',e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;if(KMAP[k]){keys[KMAP[k]]=1;e.preventDefault()}
  if(st&&st.mode==='intro'&&(k===' '||k==='Enter'))startPlay()});
addEventListener('keyup',e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;if(KMAP[k])keys[KMAP[k]]=0});

function dir(){
  let x=(held.r||keys.r?1:0)-(held.l||keys.l?1:0),y=(held.d||keys.d?1:0)-(held.u||keys.u?1:0);
  const L=Math.hypot(x,y);if(L>1){x/=L;y/=L}return{x,y};
}

// ---------- update ----------
function popText(x,y,text,col){st.parts.push({type:'pop',x,y,t:0,life:.8,rot:(Math.random()-.5)*.5,text,col})}
function burst(x,y,n,type,spd){
  for(let i=0;i<n;i++){const a=Math.random()*7,v=(.5+Math.random())*spd;
    st.parts.push({type,x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1,rot:Math.random()*7,vr:(Math.random()-.5)*10,t:0,life:.7+Math.random()*.5})}
}
const handPos=w=>({x:w.x-w.f*.1,y:GY-1.55});
function throwFrom(w){
  const L=LV[st.level-1],D=DIFFS[st.diff],p=st.parrot,o=handPos(w);
  const sp=L.speed*D.speed;
  let tx=p.x,ty=p.y;const d0=Math.hypot(tx-o.x,ty-o.y),T0=Math.max(.5,d0/sp);
  tx+=p.vx*T0*D.lead;ty+=p.vy*T0*D.lead*.5;
  tx=Math.max(.3,Math.min(9.7,tx));ty=Math.max(.4,Math.min(GY-.4,ty));
  const dx=tx-o.x,dy=ty-o.y,Tf=Math.max(.5,Math.hypot(dx,dy)/sp);
  st.projs.push({type:w.item,x:o.x,y:o.y,vx:dx/Tf,vy:(dy-.5*G*Tf*Tf)/Tf,rot:0,spin:(w.item==='net'?2:w.item==='basket'?3:7)*(dx<0?-1:1),age:0,landed:0,dud:false});
}
function catchParrot(type){
  if(st.mode!=='play')return;
  st.mode='caught';st.caught=type;st.sceneT=0;st.catches++;st.banner=null;
  popText(st.parrot.x,st.parrot.y,T.caughtPop,C.white);burst(st.parrot.x,st.parrot.y,10,'feather',2.5);
}
function lured(){let n=0;for(const w of st.workers)if(w.x<LINE)n++;return n}
function update(dt){
  if(!st)return;
  for(const p of st.parts){p.t+=dt;if(p.type!=='pop'&&p.type!=='gain'){p.vy+=(p.type==='heart'?-1:3)*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt}}
  st.parts=st.parts.filter(p=>p.t<p.life);
  if(st.banner){st.banner.t-=dt;if(st.banner.t<=0)st.banner=null}
  const p=st.parrot;if(!p)return;
  st.sceneT+=dt;p.flap+=dt*(p.sit?0:18);
  for(const w of st.workers){w.ph+=dt;if(w.stun>0)w.stun+=dt}
  if(st.mode==='intro'){
    const t=st.sceneT,pts=[[.6,6.2,GY-2.2],[1.4,8.2,GY-2.8],[2.2,5.2,GY-2.6]];
    pts.forEach(([at,x,y],i)=>{if(t-dt<at&&t>=at)popText(x,y,T.intro[i],C.white)});
    if(t-dt<2.8&&t>=2.8)popText(p.x+.4,p.y-.7,'?',C.white);
    st.leafOff=Math.max(0,Math.min(1,(t-3.1)/.6));
    if(t-dt<3.8&&t>=3.8){popText(p.x+.4,p.y-.7,'!',C.white);p.sit=false;p.vy=-2}
    if(t>3.8){p.flap+=dt*18;p.y+=(BRANCH().y-.9-p.y)*Math.min(1,dt*3)}
    if(t-dt<4&&t>=4)st.banner={text:T.introBan,t:1.6,max:1.6};
    if(t>5.6)startPlay();
    return;
  }
  if(st.mode==='play'||st.mode==='escape'){
    st.runT+=dt;
    const d=dir(),k=Math.min(1,dt*10);
    p.vx+=(d.x*PV-p.vx)*k;p.vy+=(d.y*PV-p.vy)*k;
    if(st.boss.cd>0){st.boss.cd-=dt}
    p.x+=p.vx*dt;p.y+=p.vy*dt;
    p.x=Math.max(.45,Math.min(9.6,p.x));p.y=Math.max(TOP(),Math.min(GY-.45,p.y));

  for(const q of st.projs){
    q.age+=dt;
    if(q.landed){q.landed+=dt;continue}
    q.vy+=G*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.rot+=q.spin*dt;
    if(q.type==='net')q.r=Math.min(.62,ITEM_R.net+q.age*.55);else q.r=ITEM_R[q.type];

    if(!q.dud&&!q.landed&&st.mode==='play'&&Math.hypot(q.x-p.x,q.y-p.y)<PR*.85+q.r*.7){catchParrot(q.type);q.gone=true}
  }

      }

      }
    }
  }else if(st.mode==='escape'){
    const dr=DOOR();

  }else if(st.mode==='free'){
    const t=st.sceneT;
    if(t-dt<1&&t>=1)st.parts.push({type:'pop',sx:.56,sy:.38,t:0,life:.8,rot:-.2,text:T.click,col:C.white});
    if(t-dt<2.1&&t>=2.1)st.parts.push({type:'pop',sx:.5,sy:.2,t:0,life:1,rot:.1,text:T.free,col:C.white});

}

// The static jungle (backdrop, canopy, vines, ground, the big tree on the left) is drawn once into an offscreen canvas.
function renderBg(){
  bcv.width=cv.width;bcv.height=cv.height;const b=bctx;b.setTransform(dpr,0,0,dpr,0,0);

  b.fillStyle=mkPattern(b,C.dirt,'rgba(90,50,20,.3)',10,1.8);b.fillRect(0,gy,W,H-gy);

  if(w.saw){ctx.save();ctx.translate(hx,hy2);ctx.beginPath();ctx.moveTo(0,-u*.05);ctx.lineTo(f*u*.6,-u*.02);ctx.lineTo(f*u*.6,u*.08);ctx.lineTo(0,u*.1);ctx.closePath();inkFill('#C9D3DA',lw*.8);
    ctx.beginPath();for(let k=0;k<6;k++){ctx.lineTo(f*u*.1*k,u*.1);ctx.lineTo(f*u*(.1*k+.05),u*.15)}ctx.lineWidth=lw*.6;ctx.stroke();ctx.restore()}
  ctx.beginPath();ctx.moveTo(sh.x,sh.y);ctx.lineTo(hx,hy2);ctx.lineWidth=u*.11;ctx.strokeStyle=C.ink;ctx.stroke();ctx.lineWidth=u*.11-lw*1.6;ctx.strokeStyle=boss?'#C8302C':C.vest;ctx.stroke();
  ctx.beginPath();ctx.arc(hx,hy2,u*.06,0,7);inkFill('#F2C49B',lw*.7);
  // stunned: spinning stars
  if(w.stun>0){for(let k=0;k<3;k++){const a=now*5+k*2.1;star(Math.cos(a)*u*.28,hy-u*.32+Math.sin(a)*u*.07,u*.07,u*.03,5);inkFill(C.paper,lw*.6)}}
  // lured: a little tick over the head
  if(!boss&&st.mode==='play'&&w.x<LINE){const ty=hy-u*.48;ctx.beginPath();ctx.arc(0,ty,u*.11,0,7);inkFill(C.leaf,lw*.7);
    ctx.beginPath();ctx.moveTo(-u*.05,ty);ctx.lineTo(-u*.01,ty+u*.04);ctx.lineTo(u*.06,ty-u*.04);ctx.lineWidth=lw;ctx.strokeStyle=C.ink;ctx.stroke()}
  if(!boss&&w.wind>0){inkText('!',f*u*.28,hy-u*.45,u*.34,C.pop,.1)}
  ctx.restore();
}
function drawBigLeaf(off){
  if(off>=1)return;const lw=LW()*1.3,x=X(3.1+off*8),y=Y(GY-2.5),r=S*7.6;
  ctx.save();ctx.translate(x,y);ctx.rotate(-.08);
  ctx.beginPath();ctx.moveTo(0,0);ctx.bezierCurveTo(r*.15,-r*.75,r*.95,-r*.7,r*1.05,0);ctx.bezierCurveTo(r*.95,r*.75,r*.15,r*.75,0,0);inkFill('#3FA34D',lw);
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(r*1.02,0);ctx.lineWidth=lw*1.3;ctx.stroke();
  for(let k=1;k<9;k++){const t=k/9;ctx.beginPath();ctx.moveTo(r*t,0);ctx.quadraticCurveTo(r*(t+.05),-r*.2,r*(t+.12),-r*.42*Math.sin(t*Math.PI)-r*.08);ctx.moveTo(r*t,0);ctx.quadraticCurveTo(r*(t+.05),r*.2,r*(t+.12),r*.42*Math.sin(t*Math.PI)+r*.08);ctx.lineWidth=lw*.6;ctx.stroke()}
  ctx.beginPath();ctx.ellipse(r*.4,-r*.3,r*.2,r*.07,-.4,0,7);ctx.fillStyle='rgba(143,219,106,.6)';ctx.fill();
  ctx.restore();
}
// inside the tree: the cage with the friend, the key turns, the door swings open
function drawFree(t){
  const cx=W/2,cy=H*.48,cs=Math.min(W,H)*.2,lw=Math.max(2,cs*.03);
  ctx.fillStyle='#3A2516';ctx.fillRect(0,0,W,H);
  const g=ctx.createRadialGradient(cx,cy,cs*.2,cx,cy,Math.max(W,H)*.6);g.addColorStop(0,'#8A5A33');g.addColorStop(1,'#3A2516');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(22,18,15,.35)';ctx.lineWidth=lw;for(let k=1;k<6;k++){ctx.beginPath();ctx.ellipse(cx,cy,cs*1.3*k,cs*1.1*k,0,0,7);ctx.stroke()}
  // chain + cage
  ctx.beginPath();ctx.moveTo(cx,0);ctx.lineTo(cx,cy-cs*1.25);ctx.lineWidth=lw*1.5;ctx.strokeStyle=C.ink;ctx.stroke();
  const open=Math.max(0,Math.min(1,(t-1.5)/.5));
  // friend inside / flying out
  const out=Math.max(0,Math.min(1,(t-2)/1.2));
  const fx=cx+out*W*.6,fy=cy+cs*.35-Math.sin(out*Math.PI)*cs*1.2-out*cs;
  ctx.beginPath();ctx.ellipse(cx,cy+cs*.62,cs*.8,cs*.16,0,0,7);inkFill('#B07A45',lw);
  if(out<=0)drawParrot(cx-cs*.05,cy+cs*.3,cs*.95,-1,0,{sit:true});
  ctx.strokeStyle=C.ink;ctx.lineWidth=lw;
  for(let k=-4;k<=4;k++){const xx=cx+k*cs*.17;if(Math.abs(k)<=1)continue;ctx.beginPath();ctx.moveTo(xx,cy+cs*.6);ctx.lineTo(xx,cy-cs*.6);ctx.stroke()}
  ctx.beginPath();ctx.ellipse(cx,cy-cs*.6,cs*.8,cs*.62,0,Math.PI,0);ctx.lineWidth=lw*1.4;ctx.stroke();
  for(const a of[-.6,-.3,0,.3,.6]){ctx.beginPath();ctx.moveTo(cx,cy-cs*1.22);ctx.quadraticCurveTo(cx+a*cs*1.2,cy-cs*1.1,cx+a*cs*1.33,cy-cs*.6);ctx.lineWidth=lw;ctx.stroke()}
  // the door (three bars) swings open toward the viewer
  const dw=cs*.34*Math.cos(open*Math.PI*.45),dx0=cx+cs*.26;
  ctx.save();ctx.translate(dx0,0);ctx.lineWidth=lw*1.2;
  for(const k of[0,.5,1]){ctx.beginPath();ctx.moveTo(-dw*k*2+0,cy+cs*.6);ctx.lineTo(-dw*k*2,cy-cs*.6);ctx.stroke()}
  ctx.beginPath();ctx.moveTo(0,cy-cs*.6);ctx.lineTo(-dw*2,cy-cs*.6);ctx.moveTo(0,cy+cs*.6);ctx.lineTo(-dw*2,cy+cs*.6);ctx.stroke();ctx.restore();
  ctx.beginPath();ctx.ellipse(cx,cy+cs*.6,cs*.8,cs*.14,0,0,Math.PI);ctx.lineWidth=lw*1.4;ctx.stroke();
  // padlock
  const lx=cx+cs*.1,ly=cy+cs*.05,shake=t>.9&&t<1.5?Math.sin(t*60)*cs*.02:0,drop=open>0?(t-1.5)*(t-1.5)*cs*6:0;
  if(ly+drop<H){ctx.save();ctx.translate(lx+shake,ly+drop);ctx.rotate(drop?drop/cs*.6:0);
    ctx.beginPath();ctx.arc(0,-cs*.1,cs*.1,Math.PI,0);ctx.lineWidth=lw*1.6;ctx.strokeStyle=C.ink;ctx.stroke();ctx.lineWidth=lw*.7;ctx.strokeStyle='#C9D3DA';ctx.stroke();
    ctx.beginPath();ctx.roundRect?ctx.roundRect(-cs*.15,-cs*.1,cs*.3,cs*.24,cs*.04):ctx.rect(-cs*.15,-cs*.1,cs*.3,cs*.24);inkFill('#FFC21A',lw);
    ctx.beginPath();ctx.arc(0,0,cs*.03,0,7);ctx.fillStyle=C.ink;ctx.fill();ctx.restore()}
  // the player flies in with the key and turns it
  const a=Math.min(1,t/.9),ease=1-Math.pow(1-a,3);
  const px=-cs+(lx+cs*.55+cs)*ease,py=ly-cs*.15-Math.sin(ease*Math.PI)*cs*.5;
  const turn=t>.9&&t<1.5?(t-.9)/.6*Math.PI/2:0;
  drawParrot(px,py,cs*.95,-1,performance.now()/1000*18,{key:t<1.5});
  if(t>=.9&&t<1.5){ctx.save();ctx.translate(lx+cs*.13,ly+cs*.02);ctx.scale(1,Math.cos(turn)||.05);drawKey(0,0,cs*.5,0);ctx.restore()}
  if(out>0&&out<1)drawParrot(fx,fy,cs*.95,1,performance.now()/1000*18,{});
}
function draw(){
  if(!st){return}
  if(st.mode==='free'){drawFree(st.sceneT);drawParts(true);return}
  if(bgDirty)renderBg();
  ctx.drawImage(bcv,0,0,W,H);
  drawBranch();drawDoor();
  for(const s of st.stumps)drawStump(s);
  if(st.mode!=='intro'&&st.mode!=='outro')drawLog();
  for(const q of st.projs)if(q.landed)drawItem(q.type,X(q.x),Y(q.y),S*(q.r||ITEM_R[q.type]),q.rot,1-q.landed);
  drawWorker(st.boss,true);
  for(const w of st.workers)drawWorker(w,false);
  for(const q of st.projs)if(!q.landed)drawItem(q.type,X(q.x),Y(q.y),S*q.r,q.rot,q.dud?.6:1);
  const p=st.parrot;
  if(st.buddy)drawParrot(X(st.buddy.x),Y(st.buddy.y),S,st.buddy.f||1,st.buddy.ph*18,{});
  drawParrot(X(p.x),Y(p.y),S,p.f,p.flap,{key:p.key,sit:p.sit,vy:p.vy});
  if(st.mode==='intro'){
    // breakfast: a slice of mango in the beak
    if(st.sceneT<2.8){ctx.beginPath();ctx.ellipse(X(p.x+.5*p.f),Y(p.y-.12),S*.1,S*.06,.4,0,7);inkFill('#FFA62B',LW()*.7)}
    drawBigLeaf(st.leafOff);
  }
  if(st.mode==='caught'&&st.caught)drawItem(st.caught,X(p.x),Y(p.y),S*.42,.2);
  drawParts(false);
  if(st.banner){
    const bn=st.banner,k=Math.min(1,(bn.max-bn.t)*6),sz=Math.min(50,W*.1);
    inkText(bn.text,W/2,H*.3,sz*k+1,C.paper,-.06);
    if(bn.sub)inkText(bn.sub,W/2+8,H*.3+sz*.85,sz*.48*k+1,C.white,.04);
  }
}
function drawParts(screen){
  for(const p of st.parts){
    const k=p.t/p.life;
    if(screen&&p.sx==null)continue;
    if(p.type==='feather'){ctx.save();ctx.translate(X(p.x),Y(p.y));ctx.rotate(p.rot);ctx.globalAlpha=1-Math.max(0,k-.6)/.4;ctx.beginPath();ctx.ellipse(0,0,S*.12,S*.04,0,0,7);inkFill(C.blue,1.5);ctx.restore();continue}
    if(p.type==='spark'){ctx.save();ctx.globalAlpha=1-k;star(X(p.x),Y(p.y),S*.12,S*.05,5);inkFill(C.paper,1.5);ctx.restore();continue}
    if(p.type==='heart'){const x=X(p.x),y=Y(p.y),r=S*.12;ctx.save();ctx.globalAlpha=1-k;ctx.beginPath();ctx.moveTo(x,y+r);ctx.bezierCurveTo(x-r*2,y-r*.4,x-r*.6,y-r*1.6,x,y-r*.5);ctx.bezierCurveTo(x+r*.6,y-r*1.6,x+r*2,y-r*.4,x,y+r);inkFill(C.pop,1.5);ctx.restore();continue}
    if(p.type!=='pop')continue;
    let px=p.sx!=null?p.sx*W:X(p.x),py=p.sx!=null?p.sy*H:Y(p.y);
    const sc=Math.min(1,k*5)*(1-k*.3),R=Math.max(24,S*.85)*sc,yy=py-S*.3-k*S*.4;
    px=Math.max(R*1.3,Math.min(W-R*1.3,px));
    ctx.save();ctx.globalAlpha=1-Math.max(0,k-.7)/.3;
    star(px,yy,R,R*.62,10);ctx.fillStyle=C.white;ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=C.ink;ctx.stroke();
    const fs=Math.min(R*.5+1,R*2.4/Math.max(2,p.text.length*.55));
    inkText(p.text,px,yy,fs,C.pop,p.rot);ctx.restore();
  }
}

// ---------- HUD ----------
const lvlEl=$('lvl'),lblEl=$('lureLbl'),fillEl=$('fill');let hudCache='';
function hud(){
  if(!st)return;
  const n=st.workers.length?lured():0,esc=st.mode==='escape'||st.mode==='free'||st.mode==='outro';
  const s=st.level+'|'+n+'|'+st.mode+'|'+lang;if(s===hudCache)return;hudCache=s;
  lvlEl.textContent=T.lvl(st.level);
  lblEl.textContent=st.mode==='free'||st.mode==='outro'?T.saved:esc?T.escape:n===6&&st.mode==='play'?T.keyReady:T.lured(n);
  fillEl.style.width=(esc?100:n/6*100).toFixed(1)+'%';fillEl.classList.toggle('ready',n===6&&st.mode==='play'||st.mode==='escape');
}
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(!paused)update(dt);draw();hud();requestAnimationFrame(loop);
}

// ---------- flow ----------
function hideCards(){card=null;$('cardOv').hidden=true;$('startOv').hidden=true}
function begin(level){
  try{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{})}catch(_){}
  st=fresh(level,level===1);hideCards();$('restartBtn').hidden=false;
  newLevel(level,level===1);
}
function levelDone(){
  if(st.level<LEVELS){setReached(st.level+1);showCard('done')}
  else{
    let best=null;
    if(st.fromStart){try{const b=+localStorage.getItem(bestKey(st.diff))||0;best=b&&b<st.runT?b:st.runT;localStorage.setItem(bestKey(st.diff),best)}catch(_){best=st.runT}}
    else{try{best=+localStorage.getItem(bestKey(st.diff))||null}catch(_){}}
    st.best=best;showCard('win');
  }
}
function showCard(kind){
  card={kind};const ov=$('cardOv');ov.className='overlay '+(kind==='caught'?'bad':'good');
  const set=(id,txt)=>{const el=$(id);el.hidden=txt==null;if(txt!=null)el.textContent=txt};
  if(kind==='caught'){set('cTitle',T.caughtT);set('cText',T.caughtP);set('cBig',null);set('cBest',null);$('cDiffs').hidden=true;set('cBtn',T.again)}
  if(kind==='done'){set('cTitle',T.doneT(st.level));set('cText',T.doneP);set('cBig',null);set('cBest',null);$('cDiffs').hidden=true;set('cBtn',T.next)}
  if(kind==='win'){set('cTitle',T.winT);set('cText',T.winP);set('cBig',T.diff[st.diff]+' · '+T.stats(fmt(st.runT),st.catches));set('cBest',st.best?T.best(fmt(st.best)):null);$('cDiffs').hidden=false;set('cBtn',T.again)}
  ov.hidden=false;fitTitles();setTimeout(()=>$('cBtn').focus(),50);
}
$('cBtn').addEventListener('click',()=>{
  const k=card&&card.kind;
  if(k==='caught'){hideCards();newLevel(st.level,false)}
  else if(k==='done'){hideCards();newLevel(st.level+1,false)}
  else begin(1);
});
$('startBtn').addEventListener('click',()=>begin(startLvl||1));
$('restartBtn').addEventListener('click',e=>{e.currentTarget.blur();if(!st)return;hideCards();newLevel(st.level,false)});

// idle backdrop behind the start card
st=fresh(1,false);
applyLang(lang,false);
resize();newLevel(1,true);st.mode='menu';$('hint').hidden=true;
requestAnimationFrame(loop);
// test hook
window.__jungle={get st(){return st},keys,held,begin,startPlay};
})();
</script>
