<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0F3324">
<title>Danger in the Jungle 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: the jungle canvas fills the whole screen. Everything else floats on top of it:
   glass arrow pads on the ground, a pause button, and scene overlays (title, intro, pause, results). */
:root{
  --paper:#FFD45A;--ink:#2A1C14;--jungle:#4FAE5A;--deep:#2B7A43;--leaf:#8FDB6A;--hedge:#3E9A55;--bark:#7A4A2A;--dirt:#A8703F;
  --pop:#F04E3E;--blue:#2F86F0;--vest:#FF8A1F;--soda:#7FE3F0;--white:#FFFDF6;--night:#0F3324;--gold:#FFC53D;
  --display:"Fredoka","Baloo 2","Arial Rounded MT Bold",system-ui,sans-serif;
  --hand:"Nunito","Segoe UI",system-ui,sans-serif;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;margin:0;background:var(--night)}
body{color:var(--white);font-family:var(--hand);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;overscroll-behavior:none}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0;touch-action:none}
canvas{display:block;width:100%;height:100%;transition:filter .6s ease}
canvas.dim{filter:saturate(.35) brightness(.7)}
#safe{position:absolute;visibility:hidden;padding:var(--st) var(--sr) var(--sb) var(--sl)}

/* glass: the one surface style used for every control */
.glass{background:linear-gradient(180deg,rgba(255,255,255,.26),rgba(255,255,255,.1));border:1.5px solid rgba(255,255,255,.42);box-shadow:0 8px 22px rgba(0,25,10,.35),inset 0 1px 0 rgba(255,255,255,.45);backdrop-filter:blur(10px) saturate(1.2);-webkit-backdrop-filter:blur(10px) saturate(1.2)}
.round{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;padding:0;cursor:pointer}
.round svg{width:22px;height:22px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}
.round:active{transform:scale(.92)}
a.round{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.act:focus-visible{outline:none}.act:focus-visible .round{outline:3px solid var(--gold);outline-offset:3px}

/* in-game: pause button top right */
#pauseBtn{position:absolute;top:calc(var(--st) + 12px);right:calc(var(--sr) + 12px)}

/* joystick: sits on the ground; touch anywhere in the bottom strip and it jumps under your thumb, drag to fly */
#ctrl{position:absolute;left:0;right:0;bottom:0;height:calc(150px + var(--sb));touch-action:none;transition:opacity .35s ease,transform .35s ease}
#ctrl.off{opacity:0;transform:translateY(30px);pointer-events:none}
#joyBase{position:absolute;width:124px;height:124px;margin:-62px 0 0 -62px;border-radius:50%;left:50%;top:calc(50% - var(--sb)/2);pointer-events:none;color:#fff;transition:left .18s ease,top .18s ease,opacity .2s}
#joyBase.live{transition:none}
#joyBase svg{position:absolute;inset:0;width:100%;height:100%}
#joyKnob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFFFFF,#FFE58A 45%,#F2B705);box-shadow:0 6px 14px rgba(0,25,10,.45),inset 0 -3px 6px rgba(150,90,0,.35);transition:transform .15s ease}
#joyBase.live #joyKnob{transition:none}
#dropBtn{position:absolute;right:calc(var(--sr) + 22px);top:calc(50% - var(--sb)/2);margin-top:-44px;width:88px;height:88px;display:none;touch-action:none}
#dropBtn svg{width:54px;height:54px}
#dropBtn.on{background:linear-gradient(180deg,#FFE58A,#FFC53D);transform:scale(.92)}
#ctrl.v #dropBtn{display:grid}
#ctrl.v #joyBase:not(.live){left:34%}
/* title screen: the sign is painted on the canvas; the controls sit at the bottom */
#menu{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:calc(var(--st) + 12px) calc(var(--sr) + 14px) calc(var(--sb) + 18px) calc(var(--sl) + 14px);pointer-events:none}
#menu>*{pointer-events:auto}
.mtop{display:flex;justify-content:space-between;align-items:center}
.pill{border-radius:999px;padding:9px 16px;font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.04em;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.pill svg{width:18px;height:18px}
.mbottom{display:flex;flex-direction:column;align-items:center;gap:14px}
.seg{display:flex;padding:4px;border-radius:999px;gap:2px}
.seg button{border:none;background:none;border-radius:999px;padding:8px 14px;font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:.03em;cursor:pointer;color:rgba(255,255,255,.85);display:flex;align-items:center;gap:6px}
.seg button i{display:inline-flex;gap:2px}
.seg button i b{width:6px;height:10px;border-radius:6px 0 6px 0;background:currentColor;opacity:.9}
.seg button[aria-pressed="true"]{background:linear-gradient(180deg,#FFE58A,#FFC53D);color:#5A3B00;box-shadow:0 3px 10px rgba(255,197,61,.45)}
.medals{display:flex;gap:9px;flex-wrap:wrap;justify-content:center}
.medal{width:48px;height:48px;border-radius:50%;cursor:pointer;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:20px;position:relative;padding:0}
.medal[aria-pressed="true"]{background:radial-gradient(circle at 35% 30%,#FFF1B0,#FFC53D 60%,#E09A10);color:#5A3B00;border-color:#FFF2C0;box-shadow:0 0 0 4px rgba(255,197,61,.35),0 8px 22px rgba(0,25,10,.35)}
.medal:disabled{cursor:default;opacity:.55}
.medal svg{width:22px;height:22px}
.medal small{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-family:var(--display);font-size:11px;font-weight:600;letter-spacing:.06em;white-space:nowrap;opacity:.85}
.play{margin-top:14px;border:none;border-radius:999px;padding:14px 46px 14px 38px;font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.04em;cursor:pointer;color:#fff;background:linear-gradient(180deg,#9BE873,#36A646);box-shadow:0 7px 0 #24782F,0 14px 30px rgba(0,30,10,.45),inset 0 2px 0 rgba(255,255,255,.4);text-shadow:0 2px 0 rgba(0,0,0,.18);display:flex;align-items:center;gap:12px;animation:breathe 2.4s ease-in-out infinite}
.play svg{width:26px;height:26px}
.play:active{transform:translateY(5px);box-shadow:0 2px 0 #24782F,0 6px 14px rgba(0,30,10,.4);animation:none}
@keyframes breathe{50%{transform:scale(1.04)}}
.lbl{font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.12em;opacity:.8;text-transform:uppercase;text-shadow:0 1px 3px rgba(0,0,0,.5)}

/* sheets: how-to, pause, results — a blurred scrim and glass panel, no paper cards */
.scrim{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:calc(var(--st) + 20px) 20px calc(var(--sb) + 20px);background:radial-gradient(circle at 50% 40%,rgba(15,51,36,.25),rgba(8,30,20,.75));animation:fade .3s ease}
@keyframes fade{from{opacity:0}}
.sheet{width:min(360px,100%);max-height:100%;overflow-y:auto;box-sizing:border-box;border-radius:30px;padding:26px 22px 22px;text-align:center;animation:rise .45s cubic-bezier(.2,1.3,.4,1)}
@keyframes rise{from{transform:translateY(40px) scale(.94);opacity:0}}
.sheet h2{font-family:var(--display);font-weight:700;font-size:42px;line-height:1;margin:0 0 10px;letter-spacing:.01em;background:linear-gradient(180deg,#FFF6C8,#FFC53D);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 rgba(120,70,0,.45)) drop-shadow(0 8px 16px rgba(0,0,0,.35));text-wrap:balance}
.sheet.bad h2{background-image:linear-gradient(180deg,#FFC2A8,#F04E3E);filter:drop-shadow(0 3px 0 rgba(110,20,10,.5)) drop-shadow(0 8px 16px rgba(0,0,0,.35))}
.sheet p{margin:6px 0;font-size:15px;line-height:1.45;color:rgba(255,255,255,.92)}
.stats{display:flex;justify-content:center;gap:10px;margin:14px 0 4px;flex-wrap:wrap}
.stat{border-radius:16px;padding:8px 14px;font-family:var(--display);font-weight:600;font-size:17px;display:flex;align-items:center;gap:8px}
.stat svg{width:18px;height:18px}
.cages{display:flex;justify-content:center;gap:12px;margin:12px 0}
.cages span{width:40px;height:40px;border-radius:50%;display:grid;place-items:center}
.cages span svg{width:24px;height:24px}
.cages span.free{background:radial-gradient(circle at 35% 30%,#8FD0FF,#2F86F0);border-color:#BFE3FF}
.actions{display:flex;justify-content:center;gap:16px;margin-top:18px}
.act{display:flex;flex-direction:column;align-items:center;gap:6px;font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.06em;cursor:pointer;background:none;border:none;padding:0}
.act .round{width:58px;height:58px}
.act .round svg{width:26px;height:26px}
.act.main .round{width:72px;height:72px;background:linear-gradient(180deg,#9BE873,#36A646);border-color:#C9F5A8;box-shadow:0 6px 0 #24782F,0 12px 26px rgba(0,30,10,.45)}
.act.main .round svg{width:32px;height:32px}
.rules{list-style:none;padding:0;margin:14px 0 4px;text-align:left;display:grid;gap:12px}
.rules li{display:flex;gap:12px;align-items:flex-start;font-size:14.5px;line-height:1.4}
.rules li b{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:15px;background:linear-gradient(180deg,#FFE58A,#FFC53D);color:#5A3B00}

/* intro: letterbox bars, subtitles, skip */
#cine{position:absolute;inset:0;pointer-events:none}
#cine::before,#cine::after{content:"";position:absolute;left:0;right:0;height:12%;background:#050f0a;animation:bar .6s ease both}
#cine::before{top:0}
#cine::after{bottom:0}
@keyframes bar{from{transform:scaleY(0)}}
#cine::before{transform-origin:top}#cine::after{transform-origin:bottom}
#caption{position:absolute;left:24px;right:24px;bottom:calc(12% + 18px);text-align:center;font-weight:700;font-size:18px;line-height:1.35;text-shadow:0 2px 6px rgba(0,0,0,.8),0 0 2px rgba(0,0,0,.9);transition:opacity .35s ease;z-index:1}
#skipBtn{position:absolute;top:calc(var(--st) + 12px);right:calc(var(--sr) + 12px);pointer-events:auto;z-index:1}

#fade{position:absolute;inset:0;background:#0A2418;opacity:0;pointer-events:none;transition:opacity .3s ease}
#fade.on{opacity:1}
@media (orientation:landscape) and (max-height:540px){
  #ctrl{height:calc(110px + var(--sb))}
  #joyBase{width:104px;height:104px;margin:-52px 0 0 -52px}#joyKnob{width:50px;height:50px;margin:-25px 0 0 -25px}
  .mbottom{position:absolute;right:calc(var(--sr) + 14px);top:50%;transform:translateY(-50%);width:50%;gap:10px}
  .play{margin-top:8px}
}
@media (prefers-reduced-motion:reduce){.play{animation:none}}
.cages{gap:8px;flex-wrap:wrap}
.cages span canvas{display:block}
#dropBtn.hot{box-shadow:0 0 0 4px rgba(255,217,74,.75),0 0 24px rgba(255,217,74,.8),0 8px 22px rgba(0,25,10,.35)}
#ctrl #dropBtn{display:grid}
#ctrl #joyBase:not(.live){left:34%}
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>
  <div id="safe"></div>

  <div id="ctrl" class="off v">
    <div id="joyBase" class="glass" aria-hidden="true">
      <svg viewBox="0 0 120 120"><g fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity=".75"><path d="M52 18l8-8 8 8"/><path d="M52 102l8 8 8-8"/><path d="M18 52l-8 8 8 8"/><path d="M102 52l8 8-8 8"/></g></svg>
      <div id="joyKnob"></div>
    </div>
    <button type="button" id="dropBtn" class="glass round" aria-label="Drop"><svg viewBox="0 0 40 40" aria-hidden="true"><ellipse cx="20" cy="23" rx="10" ry="11" fill="#C98A50"/><ellipse cx="20" cy="15" rx="11" ry="5.5" fill="#6B4A22"/><path d="M20 9.5V5" stroke="#6B4A22" stroke-width="2.5" stroke-linecap="round"/><ellipse cx="16" cy="22" rx="2.5" ry="4" fill="rgba(255,255,255,.35)"/></svg></button>
  </div>

  <button type="button" id="pauseBtn" class="glass round" hidden aria-label="Pause"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.5" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1.5" fill="currentColor"/></svg></button>

  <div id="menu">
    <div class="mtop">
      <div style="display:flex;gap:10px;align-items:center">
      <a href="../" id="homeBtn" class="glass round" aria-label="Abenteuer" title="Abenteuer"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5 12 4.5l8 7M6.5 9.5V19h4v-5h3v5h4V9.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
      <button type="button" id="langBtn" class="glass pill"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18" fill="none" stroke="currentColor" stroke-width="2"/></svg><span id="langName">DE</span></button>
      </div>
      <button type="button" id="howBtn" class="glass round" aria-label="How to play"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 9a3 3 0 1 1 4.2 2.8c-.8.4-1.2 1-1.2 1.9V15" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><circle cx="12" cy="18.6" r="1.6" fill="currentColor"/></svg></button>
    </div>
    <div class="mbottom">
      <div class="seg glass" id="diffs" role="group" aria-label="Difficulty"></div>
      <span class="lbl" id="lvlLbl">Mission</span>
      <div class="medals" id="medals" role="group" aria-label="Mission"></div>
      <button type="button" class="play" id="playBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12.5-7.5z" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg><span id="playLbl">PLAY</span></button>
    </div>
  </div>

  <div id="cine" hidden>
    <p id="caption"></p>
    <button type="button" id="skipBtn" class="glass pill"><span id="skipLbl">Skip</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5l7 7-7 7M13 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>

  <div class="scrim" id="howOv" hidden>
    <div class="sheet glass">
      <h2 id="howTitle">How to play</h2>
      <ol class="rules" id="rules"></ol>
      <div class="actions"><button type="button" class="act main" id="howClose"><span class="glass round"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span id="okLbl">OK</span></button></div>
    </div>
  </div>

  <div class="scrim" id="sheetOv" hidden>
    <div class="sheet glass" id="sheet">
      <h2 id="sTitle"></h2>
      <p id="sText"></p>
      <div class="cages" id="sCages"></div>
      <div class="stats" id="sStats"></div>
      <div class="actions" id="sActs"></div>
    </div>
  </div>

  <div id="fade"></div>
</div>

<script>
(()=>{
const $=id=>document.getElementById(id);
const cv=$('c');let ctx=cv.getContext('2d');
const css=getComputedStyle(document.documentElement);
const V=n=>css.getPropertyValue(n).trim();
const C={paper:V('--paper'),ink:V('--ink'),jungle:V('--jungle'),deep:V('--deep'),leaf:V('--leaf'),hedge:V('--hedge'),bark:V('--bark'),dirt:V('--dirt'),pop:V('--pop'),blue:V('--blue'),vest:V('--vest'),soda:V('--soda'),white:V('--white')};

// World units: the jungle is WW units wide, x to the right, y downward; the ground is at y=GY.
// Your home tree with the nest is on the far left, the six rescue missions lie to the right.
const WW=118,GY=14,HX=3,LINE=-1e9,MISSIONS=6,LEVELS=7;
const NEST={x:HX+1.75,y:5.2},WIFE={x:NEST.x+.72,y:NEST.y-.5},HOMEP={x:NEST.x-.66,y:NEST.y-.5};
const PR=.3,PV=4.8,G=6,GF=12;
const ITEM_R={rope:.34,net:.26,kescher:.36,basket:.36};
const BOSS_V=.8;   // the boss climbs a bit faster than in part 1 (there .5–.66)
// difficulty: slower throws, longer cooldowns, longer dizzy spells, a bigger target for drops
const DIFFS=[{k:'easy',cd:1.45,wind:1.25,speed:.8,walk:.85,lead:0,stun:1.45,aim:.18},{k:'medium',cd:1.2,wind:1.1,speed:.9,walk:.93,lead:.25,stun:1.2,aim:.09},{k:'hard',cd:1,wind:1,speed:1,walk:1,lead:.5,stun:1,aim:0}];
const FRUIT={nut:'nut',mango:'mango',palm:'coco'};
const ZONE={net:.7,cage:.9,ropes:0,cart:1.05,stake:1.25,bigcage:1.55};
// the six missions, getting harder: more workers, faster throws, shorter dizzy spells, a foreman who needs two hits
const MIS=[
  {animal:'monkey',trap:'net',tool:'knife',tx:13,ty:9.6,hang:1,tree:{type:'nut',x:9.4,y:2.6},crew:[{x:14.4,tool:1}],stun:9,cd:[5,8],wind:.85,speed:4.2,max:1},
  {animal:'toucan',trap:'cage',tool:'key',tx:22,ty:9,hang:1,tree:{type:'mango',x:18.2,y:6.4},crew:[{x:23.3,tool:1},{x:20.4,item:'rope'}],stun:8,cd:[5,8],wind:.85,speed:4.2,max:1},
  {animal:'sloth',trap:'ropes',tool:'knife',tx:31,ty:8.6,hang:1,tree:{type:'palm',x:26.8,y:4.8},crew:[{x:30.4,tool:1},{x:33.2,item:'net'}],stun:7.5,cd:[4.2,6.8],wind:.8,speed:4.8,max:1},
  {animal:'jaguar',trap:'cart',tool:'key',tx:40,ty:GY,tree:{type:'nut',x:44.4,y:3},crew:[{x:41.5,tool:1,hp:2},{x:38.2,item:'basket'},{x:43,item:'rope'}],stun:7,cd:[3.8,6],wind:.75,speed:5.2,max:2},
  {animal:'elephant',trap:'stake',tool:'scissors',tx:50,ty:GY,tree:{type:'mango',x:54.5,y:5.6},crew:[{x:51.6,tool:1},{x:48.2,item:'rope'},{x:53,item:'net'}],stun:6.5,cd:[3.2,5.2],wind:.7,speed:5.8,max:2},
  {animal:'gorilla',trap:'bigcage',tool:'key',tx:60,ty:GY,tree:{type:'palm',x:64.4,y:4.2},crew:[{x:61.9,tool:1,hp:2},{x:57.6,item:'net'},{x:56.2,item:'kescher'},{x:63.4,item:'basket'}],stun:6,cd:[2.8,4.8],wind:.62,speed:6.2,max:3},
];
// the animals are far apart: a long flight through the jungle from one to the next
const GAP=18;MIS.forEach((m,i)=>{const d=20+i*GAP-m.tx;m.tx+=d;m.tree.x+=d;for(const c of m.crew)c.x+=d});
// plain jungle trees along the way (not too close to a mission)
const DECOR=[];{let x=8;const R=(a=>()=>{a=(a*16807)%2147483647;return a/2147483647})(7);
  while(x<WW-2){if(MIS.every(m=>Math.abs(x-m.tx)>3.2&&Math.abs(x-m.tree.x)>2.2))DECOR.push({x,y:2.2+R()*6,r:.9+R()*.6,w:.45+R()*.35,c:R()<.5});x+=2.6+R()*3.2}}
// dry branches on the home tree: break one off and drop it on the boss
const BR=[{x:HX-.7,y:3.4,s:-1},{x:HX+.7,y:7.6,s:1},{x:HX-.7,y:8.9,s:-1},{x:HX+.7,y:10.6,s:1},{x:HX-.7,y:2.2,s:-1}];

// ---------- i18n ----------
const I18N={
  de:{name:'DE',play:'LOS GEHT’S',how:'So geht’s',ok:'ALLES KLAR',lvlLbl:'Mission',skip:'Überspringen',pause:'Pause',resume:'Weiter',restartL:'Neu starten',menu:'Menü',retry:'Nochmal',
    diff:['LEICHT','MITTEL','SCHWER'],drop:'Abwerfen',
    rules:['Flieg mit dem Joystick unten durch den riesigen Dschungel. Der gelbe Pfeil zeigt dir immer, wo es weitergeht.',
      'Die Arbeiter vom Chef haben 6 Tiere gefangen. Flieg zum Baum und pflück eine Nuss, eine Mango oder eine Kokosnuss.',
      'Flieg über den Arbeiter mit dem Werkzeug und lass sie mit dem runden Knopf auf seinen Kopf fallen. BONK!',
      'Solange er Sterne sieht: Schnapp dir das Werkzeug von seiner Hüfte und befrei das Tier.',
      'Die anderen werfen Seile, Netze und Körbe. Weich aus und flieg nicht zu nah an sie ran – sonst musst du die Mission nochmal machen.',
      'Am Schluss fliegst du heim zu deinem Nest. Dann kommt der Chef! Brich Äste von deinem Baum ab und wirf sie ihm auf den Kopf. Er hat 3 Leben.'],

function pickLang(){

}

let land=false,groundPx=600,W=0,H=0,dpr=1,S=40,VW=10,camX=0,camY=0,ctrlH=150,safe={t:0,r:0,b:0,l:0};
const VH=()=>groundPx/S;
const camMin=()=>-.3,camMax=()=>Math.max(camMin(),WW-VW+.3);
const camMinY=()=>-1.4,camMaxY=()=>Math.max(camMinY(),GY-VH()+.25);
function resize(){
  const r=cv.getBoundingClientRect();dpr=Math.min(2,window.devicePixelRatio||1);
  W=r.width;H=r.height;cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);
  const sp=getComputedStyle($('safe'));safe={t:parseFloat(sp.paddingTop)||0,r:parseFloat(sp.paddingRight)||0,b:parseFloat(sp.paddingBottom)||0,l:parseFloat(sp.paddingLeft)||0};
  ctrlH=$('ctrl').offsetHeight||150;land=W>H*1.25;
  const ground=land?H-safe.b-44:H-ctrlH;
  S=Math.max(18,Math.min(W/6.6,(ground-safe.t-64)/(land?6.4:8.2)));
  VW=W/S;groundPx=ground;tilesDirty=true;setupFg();
  camX=Math.max(camMin(),Math.min(camMax(),camX));camY=Math.max(camMinY(),Math.min(camMaxY(),camY));
}
addEventListener('resize',resize);
const X=x=>(x-camX)*S,Y=y=>(y-camY)*S;
function camTarget(){
  const p=st&&st.parrot;if(!p)return{x:camMin(),y:camMaxY()};
  const t=st.sceneT,home={x:NEST.x-VW*.5+(land?1.6:.6),y:NEST.y-VH()*.42};
  if(st.mode==='menu')return{x:NEST.x-VW*.5+(land?-VW*.12:.8),y:NEST.y-VH()*.5};
  if(st.mode==='intro'){if(t<2.6||t>5.8)return{x:p.x-VW*.45,y:p.y-VH()*.42};const m=MIS[0];return{x:m.tx-VW*.5-.6,y:GY-VH()*.8}}
  if(st.mode==='reunion'){if(t<3.6)return home;return{x:HX-VW*.4,y:GY-VH()*.62}}
  if(st.mode==='ending'&&t<2.4){const b=st.boss;return{x:b.x-VW*.45,y:b.y-VH()*.6}}
  if(st.mode==='ending')return{x:HX+.3-(land?VW*.2:0),y:t<4.8?NEST.y-1.4:camMaxY()};
  return{x:p.x-VW*.5+p.vx*.25,y:p.y-VH()*(st.mode==='boss'?.36:.45)+p.vy*.12};
}
function moveCam(dt,snap){
  const c=camTarget(),k=snap?1:Math.min(1,dt*(st.mode==='intro'?4.5:st.mode==='reunion'||st.mode==='reunion'||st.mode==='ending'?1.8:4));
  camX+=(c.x-camX)*k;camY+=(c.y-camY)*k;
  camX=Math.max(camMin(),Math.min(camMax(),camX));camY=Math.max(camMinY(),Math.min(camMaxY(),camY));
}

let st=null,last=performance.now(),paused=false;
const keys={};
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function fresh(){return{mode:'menu',m:0,runT:0,catches:0,fromStart:false,parts:[],projs:[],drops:[],banner:null,sceneT:0,diff,paused:false,mis:[],trees:[],boss:null,branches:[]}}
function mkTree(t){
  const f=t.type==='nut'?[[-.72,1.0],[.08,1.28],[.8,.96]]:t.type==='mango'?[[-.62,.9],[.12,1.12],[.7,.86]]:[[-.28,.36],[.04,.48],[.32,.34]];
  return{...t,fruits:f.map(([dx,dy])=>({x:t.x+dx,y:t.y+dy,taken:false,re:0}))};
}
function mkWorker(c,i){return{x:c.x,post:c.x,y:GY,f:-1,ph:Math.random()*7,tool:c.tool?MIS[i].tool:null,carrier:!!c.tool,hp:c.hp||1,maxHp:c.hp||1,item:c.item||null,
  cd:2.5+rnd(1,3)*DIFFS[st.diff].cd,wind:0,reload:0,stun:0,daze:0,hurt:0,walking:false,flee:false,saw:!c.tool&&!c.item}}
function resetMission(i){
  const ms=st.mis[i];ms.workers=MIS[i].crew.map(c=>mkWorker(c,i));ms.anim={free:0};ms.done=false;
  for(const w of ms.workers)if(!w.item&&!w.carrier)w.saw=true;
}
// start a run at mission l (1–6) or at the way home (7)
function newRun(l,withIntro){
  st=fresh();st.fromStart=l===1;st.m=l-1;
  st.trees=MIS.map(m=>mkTree(m.tree));
  for(let i=0;i<MISSIONS;i++){st.mis[i]={workers:[],anim:{free:0},done:i<st.m};if(i>=st.m)resetMission(i);st.mis[i].done=i<st.m}
  st.branches=BR.map(b=>({...b,ok:true,re:0}));
  setReached(l);
  if(withIntro){st.parrot={x:HOMEP.x,y:HOMEP.y,vx:0,vy:0,f:1,flap:0,sit:true,carry:null};st.mode='intro';st.sceneT=0;capIdx=-1;setUI('intro');moveCam(0,true);return}
  placeAtCheckpoint();startPlay();moveCam(0,true);
}
function placeAtCheckpoint(){
  const i=st.m;
  let x,y;
  if(i>=MISSIONS){x=HX+6;y=6}
  else if(i===0){x=NEST.x+.6;y=NEST.y-1}
  else{x=MIS[i].tx-10;y=6.5}
  st.parrot={x,y,vx:0,vy:0,f:1,flap:0,sit:false,carry:null};
}
function startPlay(){
  st.mode='play';st.sceneT=0;st.parrot.sit=false;setUI('play');
  for(const ms of st.mis)for(const w of ms.workers)if(w.carrier||w.item)w.saw=false;
  if(st.m<MISSIONS)st.banner={text:T.mis(st.m+1),sub:T.misSub(st.m),t:2.4,max:2.4};
  else st.banner={text:T.homeT,sub:T.homeSub,t:2.4,max:2.4};
}
// retry after being caught: the current mission starts over from its checkpoint
function retry(){
  st.projs=[];st.drops=[];st.parts=[];st.banner=null;
  if(st.mode==='caught'&&st.caught==='nest'||st.m>=MISSIONS&&st.boss){startBoss(true);return}
  if(st.m<MISSIONS)resetMission(st.m);
  placeAtCheckpoint();startPlay();moveCam(0,true);

function popText(x,y,text,col){st.parts.push({type:'pop',x,y,t:0,life:.8,rot:(Math.random()-.5)*.5,text,col})}
function burst(x,y,n,type,spd){
  for(let i=0;i<n;i++){const a=Math.random()*7,v=(.5+Math.random())*spd;
    st.parts.push({type,x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1,rot:Math.random()*7,vr:(Math.random()-.5)*10,t:0,life:.7+Math.random()*.5})}
}
const DROPPABLE={nut:1,mango:1,coco:1,stick:1};
function drop(){
  if(!st||(st.mode!=='play'&&st.mode!=='boss'))return;
  const p=st.parrot;if(!p.carry||!DROPPABLE[p.carry])return;
  st.drops.push({type:p.carry,x:p.x+.3*p.f,y:p.y+.3,vx:p.vx*.15,vy:Math.max(.5,p.vy*.3+1),rot:0,spin:(Math.random()-.5)*10});
  p.carry=null;
}
function throwFrom(w,M){
  const D=DIFFS[st.diff],p=st.parrot,o={x:w.x-w.f*.1,y:GY-1.55},sp=M.speed*D.speed;
  let tx=p.x,ty=p.y;const T0=Math.max(.5,Math.hypot(tx-o.x,ty-o.y)/sp);
  tx+=p.vx*T0*D.lead;ty+=p.vy*T0*D.lead*.5;
  tx=clamp(tx,.3,WW-.3);ty=clamp(ty,.4,GY-.4);
  const dx=tx-o.x,dy=ty-o.y,Tf=Math.max(.5,Math.hypot(dx,dy)/sp);
  st.projs.push({type:w.item,x:o.x,y:o.y,vx:dx/Tf,vy:(dy-.5*G*Tf*Tf)/Tf,rot:0,spin:(w.item==='net'?2:w.item==='basket'?3:7)*(dx<0?-1:1),age:0,landed:0,dud:false,r:ITEM_R[w.item]});
}
function catchParrot(type){
  if(st.mode!=='play'&&st.mode!=='boss')return;
  st.mode='caught';st.caught=type;st.sceneT=0;st.catches++;st.banner=null;
  const p=st.parrot;if(p.carry==='stick'||DROPPABLE[p.carry])p.carry=null;

      if(st.mode==='boss')for(const b of st.branches)if(b.ok&&!p.carry&&Math.hypot(p.x-(b.x+b.s*.45),p.y-b.y)<.62){b.ok=false;b.re=7;p.carry='stick';popText(b.x+b.s*.4,b.y-.4,T.knack,C.white);burst(b.x+b.s*.4,b.y,6,'leaf',2)}

function updDrops(dt){

function updMission(dt){

// ---------- objective: what to do now, and a yellow arrow pointing there ----------
function objective(){
  const p=st.parrot,m=st.m;
  if(st.mode==='boss'){
    if(p.carry==='stick')return{x:st.boss.x,y:st.boss.y-2,msg:T.objBoss,icon:'boss'};
    let best=null,bd=1e9;for(const b of st.branches)if(b.ok){const d=Math.hypot(p.x-b.x,p.y-b.y);if(d<bd){bd=d;best=b}}
    return best?{x:best.x+best.s*.45,y:best.y,msg:T.objBranch,icon:'stick'}:{x:HX,y:5,msg:T.objBranch,icon:'stick'};
  }
  if(m>=MISSIONS)return{x:HOMEP.x,y:HOMEP.y,msg:T.objHome,icon:'nest'};
  const M=MIS[m],ms=st.mis[m],tw=ms.workers.find(w=>w.carrier&&!w.flee);
  if(st.mode==='rescue')return null;
  if(p.carry===M.tool){const tp=trapPos(m);return{x:tp.x,y:tp.y-.3,msg:T.objFree(T.animalA[m]),icon:'animal'}}
  if(tw&&tw.tool&&tw.stun){const h=hipPos(tw);return{x:h.x,y:h.y,msg:T.objTool(T.tool[M.tool]),icon:'tool'}}
  if(p.carry&&DROPPABLE[p.carry]&&tw)return{x:tw.x,y:GY-2.5,msg:tw.hp>1?T.objMore:T.objDrop,icon:'drop'};
  const tr=st.trees[m];let f=tr.fruits.find(f=>!f.taken)||tr.fruits[0];
  return{x:f.x,y:f.y,msg:T.objFruit(T.fruit[FRUIT[tr.type]]),icon:'fruit',fruit:FRUIT[tr.type]};
}

  $('menu').hidden=mode!=='menu';$('cine').hidden=mode!=='intro';
  $('ctrl').classList.toggle('off',mode!=='play');$('pauseBtn').hidden=mode!=='play';
  if(mode!=='sheet'){$('sheetOv').hidden=true;card=null;cv.classList.remove('dim')}
  if(mode!=='menu')$('howOv').hidden=true;
  joyReset();
}
function fadeTo(cb){
  const f=$('fade');f.classList.add('on');
  setTimeout(()=>{cb();requestAnimationFrame(()=>requestAnimationFrame(()=>f.classList.remove('on')))},320);
}
function begin(level){
  try{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{})}catch(_){}
  fadeTo(()=>newRun(level,level===1));
}
function toMenu(){fadeTo(()=>{showMenu()})}
function showMenu(){
  st=fresh();st.trees=MIS.map(m=>mkTree(m.tree));for(let i=0;i<MISSIONS;i++){st.mis[i]={workers:[],anim:{free:0},done:false};resetMission(i)}
  st.branches=BR.map(b=>({...b,ok:true,re:0}));
  st.parrot={x:HOMEP.x,y:HOMEP.y,vx:0,vy:0,f:1,flap:0,sit:true,carry:null};st.mode='menu';setUI('menu');paintMenu();moveCam(0,true);
}
function pause(){if(!st||st.paused)return;st.paused=true;showCard('pause')}
function resume(){if(!st)return;st.paused=false;last=performance.now();setUI('play')}
function gameWon(){
  let best=null;
  if(st.fromStart){try{const b=+localStorage.getItem(bestKey(st.diff))||0;best=b&&b<st.runT?b:st.runT;localStorage.setItem(bestKey(st.diff),best)}catch(_){best=st.runT}}
  else{try{best=+localStorage.getItem(bestKey(st.diff))||null}catch(_){}}
  st.best=best;showCard('win');
}
function act(icon,label,fn,main){
  const b=document.createElement('button');b.type='button';b.className='act'+(main?' main':'');
  b.innerHTML='<span class="glass round">'+ICON[icon]+'</span>';const s=document.createElement('span');s.textContent=label;b.append(s);
  b.addEventListener('click',fn);return b;
}
function stat(icon,txt){const d=document.createElement('div');d.className='stat glass';d.innerHTML=ICON[icon];d.append(txt);return d}
function showCard(kind){
  setUI('sheet');card={kind};
  const sh=$('sheet');sh.className='sheet glass'+(kind==='caught'||kind==='nest'?' bad':'');
  cv.classList.toggle('dim',kind!=='win');
  const title={caught:T.caughtT,nest:T.nestT,win:T.winT,pause:T.pause}[kind];
  const text={caught:T.caughtP,nest:T.nestP,win:T.winP,pause:''}[kind];
  $('sTitle').textContent=title;$('sText').textContent=text;$('sText').hidden=!text;
  const freed=st.mis.filter(m=>m.done).length,showC=kind!=='nest';
  $('sCages').hidden=!showC;
  $('sCages').replaceChildren(...st.mis.map((m,i)=>{const s=document.createElement('span');s.className='glass'+(m.done?' free':'');
    if(m.done){const c=document.createElement('canvas');c.width=c.height=72;c.style.width=c.style.height='34px';const g=c.getContext('2d');const sv=ctx;
      // draw the animal into the badge with the shared drawing code
      g.scale(2,2);swapCtx(g,()=>drawAnimal(MIS[i].animal,18,21,26,{}));s.append(c)}
    else s.innerHTML=ICON.cage;return s}));
  $('sCages').setAttribute('aria-label',T.freed(freed));
  const stats=[];
  if(kind==='win'){stats.push(stat('clock',fmt(st.runT)));stats.push(stat('net',T.caught+' '+st.catches+'×'));if(st.best)stats.push(stat('trophy',T.bestL+' '+fmt(st.best)))}
  $('sStats').replaceChildren(...stats);$('sStats').hidden=!stats.length;
  const acts=[act('home',T.menu,toMenu)];
  if(kind==='caught'||kind==='nest')acts.push(act('retry',T.retry,()=>fadeTo(retry),true));
  if(kind==='win')acts.push(act('retry',T.retry,()=>begin(1),true));
  if(kind==='pause'){acts.push(act('retry',T.restartL,()=>fadeTo(()=>{st.paused=false;st.mode='caught';st.caught=st.m>=MISSIONS&&st.boss?'nest':'hands';retry()})));acts.push(act('play',T.resume,resume,true))}
  $('sActs').replaceChildren(...acts);
  $('sheetOv').hidden=false;
  setTimeout(()=>{const m=$('sActs').querySelector('.main');m&&m.focus({preventScroll:true})},60);
}
// draw with the shared code into another canvas (for the badges on the cards)
function swapCtx(g,fn){const o=ctx;ctx=g;try{fn()}finally{ctx=o}}
$('playBtn').addEventListener('click',()=>begin(startLvl||1));
$('pauseBtn').addEventListener('click',e=>{e.currentTarget.blur();pause()});
$('howBtn').addEventListener('click',()=>{$('howOv').hidden=false;$('howClose').focus()});
$('howClose').addEventListener('click',()=>{$('howOv').hidden=true});
$('howOv').addEventListener('click',e=>{if(e.target===e.currentTarget)$('howOv').hidden=true});

// title screen: home in the nest
st=fresh();
applyLang(lang,false);
resize();showMenu();
document.fonts&&document.fonts.ready.then(()=>{tilesDirty=true});
requestAnimationFrame(loop);
// test hook
window.__jungle2={get st(){return st},drop,keys,joy,begin,startPlay,pause,toMenu,MIS,update,moveCam,get cam(){return{x:camX,y:camY,S,VW}}};
})();
</script>
