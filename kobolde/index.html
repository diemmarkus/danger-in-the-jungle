<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#5E5A8C">
<title>Kobolde</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Same layout as Danger in the Jungle: the forest canvas fills the screen, glass controls float on top. */
:root{
  --ink:#3A2E3F;--white:#FFFDF6;--gold:#FFC53D;--night:#3E3A5E;--paper:#FFE3A3;
  --display:"Fredoka","Baloo 2","Arial Rounded MT Bold",system-ui,sans-serif;
  --hand:"Nunito","Segoe UI",system-ui,sans-serif;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;margin:0;background:var(--night)}
body{color:var(--white);font-family:var(--hand);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;overscroll-behavior:none}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0;touch-action:none}
canvas{display:block;width:100%;height:100%;transition:filter .6s ease}
canvas.dim{filter:saturate(.45) brightness(.75)}
#safe{position:absolute;visibility:hidden;padding:var(--st) var(--sr) var(--sb) var(--sl)}

.glass{background:linear-gradient(180deg,rgba(255,255,255,.26),rgba(255,255,255,.1));border:1.5px solid rgba(255,255,255,.42);box-shadow:0 8px 22px rgba(30,20,50,.35),inset 0 1px 0 rgba(255,255,255,.45);backdrop-filter:blur(10px) saturate(1.2);-webkit-backdrop-filter:blur(10px) saturate(1.2)}
.round{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;padding:0;cursor:pointer}
.round svg{width:22px;height:22px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}
.round:active{transform:scale(.92)}
a.round{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.act:focus-visible{outline:none}.act:focus-visible .round{outline:3px solid var(--gold);outline-offset:3px}

#pauseBtn{position:absolute;top:calc(var(--st) + 12px);right:calc(var(--sr) + 12px)}

/* joystick (same as Danger in the Jungle): touch anywhere in the bottom strip, it jumps under your thumb */
#ctrl{position:absolute;left:0;right:0;bottom:0;height:calc(150px + var(--sb));touch-action:none;transition:opacity .35s ease,transform .35s ease}
#ctrl.off{opacity:0;transform:translateY(30px);pointer-events:none}
#joyBase{position:absolute;width:124px;height:124px;margin:-62px 0 0 -62px;border-radius:50%;left:50%;top:calc(50% - var(--sb)/2);pointer-events:none;color:#fff;transition:left .18s ease,top .18s ease,opacity .2s}
#joyBase.live{transition:none}
#joyBase svg{position:absolute;inset:0;width:100%;height:100%}
#joyKnob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFFFFF,#FFE58A 45%,#F2B705);box-shadow:0 6px 14px rgba(30,20,50,.45),inset 0 -3px 6px rgba(150,90,0,.35);transition:transform .15s ease}
#joyBase.live #joyKnob{transition:none}

/* the hand button: give the egg back */
#handBtn{position:absolute;left:50%;bottom:calc(var(--sb) + 15% + 34px);width:96px;height:96px;margin-left:-48px;pointer-events:auto;animation:pulse 1.4s ease-in-out infinite}
#handBtn svg{width:58px;height:58px}
#handBtn::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:3px solid rgba(255,229,138,.9);animation:ring 1.4s ease-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
@keyframes ring{from{transform:scale(.85);opacity:1}to{transform:scale(1.35);opacity:0}}

/* hint at the top while walking */
#hint{position:absolute;top:calc(var(--st) + 14px);left:50%;transform:translateX(-50%);max-width:calc(100% - 140px);border-radius:999px;padding:9px 18px;font-family:var(--display);font-weight:600;font-size:16px;letter-spacing:.02em;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none;transition:background .3s}
#hint.hot{background:linear-gradient(180deg,#FFE58A,#FFC53D);color:#5A3B00;border-color:#FFF2C0}

#menu{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:calc(var(--st) + 12px) calc(var(--sr) + 14px) calc(var(--sb) + 18px) calc(var(--sl) + 14px);pointer-events:none}
#menu>*{pointer-events:auto}
.mtop{display:flex;justify-content:space-between;align-items:center}
.pill{border-radius:999px;padding:9px 16px;font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.04em;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.pill svg{width:18px;height:18px}
.mbottom{display:flex;flex-direction:column;align-items:center;gap:12px}
.lbl{font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.12em;opacity:.85;text-transform:uppercase;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.play{border:none;border-radius:999px;padding:14px 46px 14px 38px;font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.04em;cursor:pointer;color:#fff;background:linear-gradient(180deg,#F7B5CF,#D9709D);box-shadow:0 7px 0 #A84B76,0 14px 30px rgba(40,20,50,.45),inset 0 2px 0 rgba(255,255,255,.45);text-shadow:0 2px 0 rgba(0,0,0,.18);display:flex;align-items:center;gap:12px;animation:breathe 2.4s ease-in-out infinite}
.play svg{width:26px;height:26px}
.play:active{transform:translateY(5px);box-shadow:0 2px 0 #A84B76,0 6px 14px rgba(40,20,50,.4);animation:none}
@keyframes breathe{50%{transform:scale(1.04)}}

.scrim{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:calc(var(--st) + 20px) 20px calc(var(--sb) + 20px);background:radial-gradient(circle at 50% 40%,rgba(62,58,94,.25),rgba(30,26,52,.75));animation:fade .3s ease}
@keyframes fade{from{opacity:0}}
.sheet{width:min(360px,100%);max-height:100%;overflow-y:auto;box-sizing:border-box;border-radius:30px;padding:26px 22px 22px;text-align:center;animation:rise .45s cubic-bezier(.2,1.3,.4,1)}
@keyframes rise{from{transform:translateY(40px) scale(.94);opacity:0}}
.sheet h2{font-family:var(--display);font-weight:700;font-size:40px;line-height:1;margin:0 0 10px;letter-spacing:.01em;background:linear-gradient(180deg,#FFF6C8,#FFC53D);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 rgba(120,70,0,.45)) drop-shadow(0 8px 16px rgba(0,0,0,.35));text-wrap:balance}
.sheet p{margin:6px 0;font-size:15px;line-height:1.45;color:rgba(255,255,255,.92)}
.actions{display:flex;justify-content:center;gap:16px;margin-top:18px}
.act{display:flex;flex-direction:column;align-items:center;gap:6px;font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.06em;cursor:pointer;background:none;border:none;padding:0}
.act .round{width:58px;height:58px}
.act .round svg{width:26px;height:26px}
.act.main .round{width:72px;height:72px;background:linear-gradient(180deg,#F7B5CF,#D9709D);border-color:#FFD6E6;box-shadow:0 6px 0 #A84B76,0 12px 26px rgba(40,20,50,.45)}
.act.main .round svg{width:32px;height:32px}
.rules{list-style:none;padding:0;margin:14px 0 4px;text-align:left;display:grid;gap:12px}
.rules li{display:flex;gap:12px;align-items:flex-start;font-size:14.5px;line-height:1.4}
.rules li b{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:15px;background:linear-gradient(180deg,#FFE58A,#FFC53D);color:#5A3B00}

/* intro: letterbox bars, subtitles, skip */
#cine{position:absolute;inset:0;pointer-events:none}
#cine::before,#cine::after{content:"";position:absolute;left:0;right:0;height:12%;background:#1E1A30;animation:bar .6s ease both}
#cine::before{top:0;transform-origin:top}
#cine::after{bottom:0;transform-origin:bottom}
@keyframes bar{from{transform:scaleY(0)}}
#caption{position:absolute;left:24px;right:24px;bottom:calc(12% + 18px);text-align:center;font-weight:700;font-size:18px;line-height:1.35;text-shadow:0 2px 6px rgba(0,0,0,.8),0 0 2px rgba(0,0,0,.9);transition:opacity .35s ease;z-index:1}
#cine.ask #caption{bottom:calc(12% + 150px)}
#skipBtn{position:absolute;top:calc(var(--st) + 12px);right:calc(var(--sr) + 12px);pointer-events:auto;z-index:1}

#fade{position:absolute;inset:0;background:#2A2640;opacity:0;pointer-events:none;transition:opacity .35s ease}
#fade.on{opacity:1}
#fade.slow{transition:opacity 1.1s ease}
@media (orientation:landscape) and (max-height:540px){
  #ctrl{height:calc(110px + var(--sb))}
  #joyBase{width:104px;height:104px;margin:-52px 0 0 -52px}#joyKnob{width:50px;height:50px;margin:-25px 0 0 -25px}
  .mbottom{position:absolute;right:calc(var(--sr) + 14px);bottom:calc(var(--sb) + 22px)}
  #handBtn{bottom:calc(var(--sb) + 15% + 14px);width:80px;height:80px;margin-left:-40px}
  #cine.ask #caption{bottom:calc(12% + 112px)}
}
@media (prefers-reduced-motion:reduce){.play,#handBtn,#handBtn::after{animation:none}}
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>
  <div id="safe"></div>

  <div id="ctrl" class="off">
    <div id="joyBase" class="glass" aria-hidden="true">
      <svg viewBox="0 0 120 120"><g fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity=".75"><path d="M52 18l8-8 8 8"/><path d="M52 102l8 8 8-8"/><path d="M18 52l-8 8 8 8"/><path d="M102 52l8 8-8 8"/></g></svg>
      <div id="joyKnob"></div>
    </div>
  </div>

  <div id="hint" class="glass" hidden></div>
  <button type="button" id="pauseBtn" class="glass round" hidden aria-label="Pause"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.5" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1.5" fill="currentColor"/></svg></button>

  <div id="menu">
    <div class="mtop">
      <div style="display:flex;gap:10px;align-items:center">
      <a href="../" id="homeBtn" class="glass round" aria-label="Abenteuer" title="Abenteuer"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5 12 4.5l8 7M6.5 9.5V19h4v-5h3v5h4V9.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
      <button type="button" id="langBtn" class="glass pill"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18" fill="none" stroke="currentColor" stroke-width="2"/></svg><span id="langName">DE</span></button>
      </div>
      <button type="button" id="howBtn" class="glass round" aria-label="So geht’s"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 9a3 3 0 1 1 4.2 2.8c-.8.4-1.2 1-1.2 1.9V15" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><circle cx="12" cy="18.6" r="1.6" fill="currentColor"/></svg></button>
    </div>
    <div class="mbottom">
      <span class="lbl" id="lvlLbl">Kapitel 1 · Im Urwald</span>
      <button type="button" class="play" id="playBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12.5-7.5z" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg><span id="playLbl">LOS GEHT’S</span></button>
    </div>
  </div>

  <div id="cine" hidden>
    <p id="caption"></p>
    <button type="button" id="skipBtn" class="glass pill"><span id="skipLbl">Überspringen</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5l7 7-7 7M13 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button type="button" id="handBtn" class="glass round" hidden aria-label="Ei zurückgeben"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M16 40c-4-3-7-8-7-13v-5c0-1.7 1.3-3 3-3s3 1.3 3 3v4V10c0-1.7 1.3-3 3-3s3 1.3 3 3v12V7c0-1.7 1.3-3 3-3s3 1.3 3 3v15V9c0-1.7 1.3-3 3-3s3 1.3 3 3v14-6c0-1.7 1.3-3 3-3s3 1.3 3 3v11c0 7-4 12-10 15z" fill="#F3CDB4" stroke="#8A5A4A" stroke-width="2" stroke-linejoin="round"/><path d="M21 22V12M27 22V9M33 23V12" stroke="#C99A86" stroke-width="1.5" stroke-linecap="round"/></svg></button>
  </div>

  <div class="scrim" id="howOv" hidden>
    <div class="sheet glass">
      <h2 id="howTitle">So geht’s</h2>
      <ol class="rules" id="rules"></ol>
      <div class="actions"><button type="button" class="act main" id="howClose"><span class="glass round"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span id="okLbl">OK</span></button></div>
    </div>
  </div>

  <div class="scrim" id="sheetOv" hidden>
    <div class="sheet glass" id="sheet">
      <h2 id="sTitle"></h2>
      <p id="sText"></p>
      <div class="actions" id="sActs"></div>
    </div>
  </div>

  <div id="fade"></div>
</div>

<script>
(()=>{
const $=id=>document.getElementById(id);
const cv=$('c');let ctx=cv.getContext('2d');
const DISPLAY=getComputedStyle(document.documentElement).getPropertyValue('--display').trim();

// ---------- world (units; x to the right, y down, the forest floor is at y=GY) ----------
const GY=10;
const CX=3.9;                          // Lilly's camp: sleeping bag from CX to CX+1.85
const PIV={x:CX+.5,y:GY-.24};          // her hips in the sleeping bag (she sits up around here)
const TX=6.7;                          // the parrots' tree
const NX=5.15,NY=4.7;                  // the nest on a branch of that tree
const PERCH={x:NX+.95,y:NY-.42};       // where the blue parrot sits
const PURP={x:NX-.55,y:NY-.36};        // the purple parrot on the rim of the nest
const EGG_RX=.12,EGG_RY=.155;
const SLOT=i=>({x:NX+(i-1)*.25,y:NY-.1});
const REST={x:SLOT(2).x,y:GY-.5};      // where the falling egg lands on the sleeping bag
const GX=30;                           // the gate
const WW=34;
const WALK=2.3;

// ---------- i18n ----------
const I18N={
  de:{name:'DE',play:'LOS GEHT’S',how:'So geht’s',ok:'ALLES KLAR',lvl:'Kapitel 1 · Im Urwald',skip:'Überspringen',pause:'Pause',resume:'Weiter',restartL:'Neu starten',menu:'Menü',retry:'Nochmal',hand:'Ei zurückgeben',
    rules:['Lilly schläft mitten im Urwald. Fällt ein Ei aus dem Nest, tipp auf die Hand und gib es den Papageien zurück.',
      'Am Morgen gehst du mit dem Joystick unten durch den Wald – nach links und nach rechts.',
      'Wenn du beim Tor bist, tipp direkt auf das Tor. Dann geht es auf.'],
    cap:['Mitten im Urwald schläft Lilly …','Über ihr passen zwei Papageien auf ihre drei Eier auf.','Oh nein! Ein Ei fällt aus dem Nest!','Tipp auf die Hand und gib das Ei zurück!','Die Papageien sagen Danke!','Lilly schläft wieder ein …'],
    huch:'HUCH!',danke:'DANKE!',knarr:'KNARR!',closer:'Geh näher hin!',
    lvlT:'KAPITEL 1',lvlSub:'IM URWALD',hintWalk:'Geh durch den Wald →',hintGate:'Tipp auf das Tor!',
    sign:['BETRETEN','VERBOTEN'],winT:'KAPITEL 1 GESCHAFFT!',winP:'Lilly ist durch das verbotene Tor gegangen. Was wartet wohl dahinter? Kapitel 2 kommt bald!'},
  en:{name:'EN',play:'PLAY',how:'How to play',ok:'GOT IT',lvl:'Chapter 1 · The Old Forest',skip:'Skip',pause:'Paused',resume:'Resume',restartL:'Restart',menu:'Menu',retry:'Again',hand:'Give the egg back',
    rules:['Lilly is asleep deep in the old forest. When an egg falls out of the nest, tap the hand and give it back to the parrots.',
      'In the morning, walk through the forest with the joystick at the bottom – left and right.',
      'When you reach the gate, tap right on the gate. Then it opens.'],
    cap:['Deep in the old forest, Lilly is asleep…','Above her, two parrots are looking after their three eggs.','Oh no! An egg falls out of the nest!','Tap the hand and give the egg back!','The parrots say thank you!','Lilly falls asleep again…'],
    huch:'WHOA!',danke:'THANKS!',knarr:'CREAK!',closer:'Walk closer!',
    lvlT:'CHAPTER 1',lvlSub:'THE OLD FOREST',hintWalk:'Walk through the forest →',hintGate:'Tap the gate!',
    sign:['KEEP','OUT'],winT:'CHAPTER 1 DONE!',winP:'Lilly went through the forbidden gate. What could be behind it? Chapter 2 is coming soon!'},
};
const ICON={
  home:'<svg viewBox="0 0 24 24"><path d="M4 11.5 12 4.5l8 7M6.5 10v9h4v-5h3v5h4v-9" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  retry:'<svg viewBox="0 0 24 24"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/><path d="M20.5 3.5v5.5H15z" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>',
  play:'<svg viewBox="0 0 24 24"><path d="M7.5 4.5v15l12-7.5z" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>',
};
function pickLang(){
  const want=[];
  try{const q=new URLSearchParams(location.search).get('lang');if(q)want.push(q)}catch(_){}
  try{const s=localStorage.getItem('jungle.lang');if(s)want.push(s)}catch(_){}
  want.push(...(navigator.languages||[navigator.language||'']));
  for(const w of want){const k=String(w).toLowerCase().slice(0,2);if(I18N[k])return k}
  return 'de';
}
let lang=pickLang(),T=I18N[lang],card=null,capIdx=-1;
function applyLang(k,save){
  lang=k;T=I18N[k];document.documentElement.lang=k;
  if(save)try{localStorage.setItem('jungle.lang',k)}catch(_){}
  $('langName').textContent=T.name;$('playLbl').textContent=T.play;$('lvlLbl').textContent=T.lvl;$('skipLbl').textContent=T.skip;
  $('howTitle').textContent=T.how;$('okLbl').textContent=T.ok;$('howBtn').setAttribute('aria-label',T.how);$('pauseBtn').setAttribute('aria-label',T.pause);$('handBtn').setAttribute('aria-label',T.hand);
  $('rules').replaceChildren(...T.rules.map((r,i)=>{const li=document.createElement('li'),b=document.createElement('b'),s=document.createElement('span');b.textContent=i+1;s.textContent=r;li.append(b,s);return li}));
  if(card)showCard(card.kind);
  capIdx=-1;
}
$('langBtn').addEventListener('click',()=>{const ks=Object.keys(I18N);applyLang(ks[(ks.indexOf(lang)+1)%ks.length],true)});

// ---------- canvas & camera ----------
let land=false,groundPx=600,W=0,H=0,dpr=1,S=40,VW=10,camX=0,camY=0,ctrlH=150,safe={t:0,r:0,b:0,l:0};
const camMin=()=>-2,camMax=()=>Math.max(camMin(),WW-VW+.5);
function resize(){
  const r=cv.getBoundingClientRect();dpr=Math.min(2,window.devicePixelRatio||1);
  W=r.width;H=r.height;cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);
  const sp=getComputedStyle($('safe'));safe={t:parseFloat(sp.paddingTop)||0,r:parseFloat(sp.paddingRight)||0,b:parseFloat(sp.paddingBottom)||0,l:parseFloat(sp.paddingLeft)||0};
  ctrlH=$('ctrl').offsetHeight||150;land=W>H*1.25;
  groundPx=land?H-safe.b-40:H-ctrlH;
  // landscape: zoom out so the nest and the camp both fit between the letterbox bars of the intro
  S=Math.max(18,Math.min(W/6.6,land?(H*.76-70)/6.4:(groundPx-safe.t-64)/8.2));
  VW=W/S;camY=camYTarget();
  buildLayers();setupFg();
  camX=clamp(camTarget(),camMin(),camMax());
}
let rzT=0;addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(resize,80)});
const X=x=>(x-camX)*S,Y=y=>(y-camY)*S;
function camTarget(){
  if(!st)return 0;
  if(st.mode==='play'||st.mode==='gate'){const L=st.lilly;return(st.mode==='gate'?GX:L.x+L.f*.6)-VW*.5}
  return (CX+1.2)-VW*.5+(land&&st.mode==='menu'?-VW*.15:0);
}
// in landscape the intro lifts the forest floor above the letterbox bar and the subtitles
function camYTarget(){const cine=st&&(st.mode==='intro'||st.mode==='egg'||st.mode==='give');return GY+.3-(land&&cine?Math.min(groundPx,H*.88-70):groundPx)/S}
function moveCam(dt,snap){const k=snap?1:Math.min(1,dt*3.5);camX+=(camTarget()-camX)*k;camX=clamp(camX,camMin(),camMax());camY+=(camYTarget()-camY)*(snap?1:Math.min(1,dt*2.5))}

// ---------- helpers ----------
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,k)=>a+(b-a)*k;
const ease=k=>{k=clamp(k,0,1);return k*k*(3-2*k)};
const rnd=(a,b)=>a+Math.random()*(b-a);
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shade(c,f){

function rr(x,y,w,h,r){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h)}

// soft, rounded title text: coloured fill, darker rim, drop shadow
function inkText(txt,x,y,size,fill,rim,rot=0){

  ctx.shadowColor='rgba(30,20,50,.35)';ctx.shadowBlur=size*.3;ctx.shadowOffsetY=size*.08;

// ---------- the forest: painted once per size into three parallax layers ----------
// far (misty firs), middle (pale beeches and firs), near (the trees along the path, the forest floor)
const LAYERS=[{p:.25,paint:paintFar},{p:.55,paint:paintMid},{p:1,paint:paintNear}];
const LTOP=-5,LBOT=GY+5;
function buildLayers(){
  for(const L of LAYERS){
    const x0=camMin()*L.p-1,x1=camMax()*L.p+VW+1;
    const c=L.c||(L.c=document.createElement('canvas'));
    c.width=Math.ceil((x1-x0)*S*dpr);c.height=Math.ceil((LBOT-LTOP)*S*dpr);
    const g=c.getContext('2d');g.setTransform(dpr,0,0,dpr,-x0*S*dpr,-LTOP*S*dpr);g.clearRect(x0*S,LTOP*S,(x1-x0)*S,(LBOT-LTOP)*S);
    L.x0=x0;swapCtx(g,()=>L.paint(x0,x1,mulberry(11+L.p*100)));
  }
}
function drawLayers(){
  for(const L of LAYERS){
    if(!L.c)continue;
    ctx.drawImage(L.c,(L.x0-camX*L.p)*S,(LTOP-camY)*S,L.c.width/dpr,L.c.height/dpr);
    // mist between the layers: the far ones fade into the green haze
    if(L.p<1){const y0=Y(GY-(L.p<.4?6:3.2)),y1=Y(GY+.3),g=ctx.createLinearGradient(0,y0,0,y1);
      g.addColorStop(0,'rgba(212,238,220,0)');g.addColorStop(.7,`rgba(212,238,220,${L.p<.4?.55:.5})`);g.addColorStop(1,`rgba(212,238,220,${L.p<.4?.6:.35})`);
      ctx.fillStyle=g;ctx.fillRect(0,y0,W,y1-y0+2)}
  }
}
function swapCtx(g,fn){const o=ctx;ctx=g;try{fn()}finally{ctx=o}}

// a fir: drooping tiers, light from the upper left
function drawFir(x,base,h,w,c,detail){
  const u=S,n=detail?7:5;
  ctx.fillStyle='#8C7A6A';ctx.fillRect((x-w*.05)*u,(base-h*.18)*u,w*.1*u,h*.2*u);
  for(let i=0;i<n;i++){
    const k=i/n,yb=base-h*.12-k*h*.8,yt=yb-h*.3,hw=(w*.5)*(1-k*.82),steps=detail?6:4;
    ctx.beginPath();ctx.moveTo(x*u,yt*u);
    ctx.quadraticCurveTo((x+hw*.45)*u,(yt+(yb-yt)*.55)*u,(x+hw)*u,(yb+.05)*u);
    for(let j=1;j<=steps*2;j++){const xx=x+hw-j*hw/steps,yy=yb+(j%2?-h*.035:.03*(1-Math.abs(xx-x)/hw));ctx.lineTo(xx*u,yy*u)}
    ctx.quadraticCurveTo((x-hw*.45)*u,(yt+(yb-yt)*.55)*u,x*u,yt*u);ctx.closePath();
    hGradFill((x-hw)*u,(x+hw)*u,shade(c,1.12),shade(c,.86));
    if(detail){
      ctx.beginPath();ctx.moveTo(x*u,(yt+.05)*u);ctx.quadraticCurveTo((x-hw*.4)*u,(yt+(yb-yt)*.5)*u,(x-hw*.85)*u,(yb-.02)*u);
      ctx.lineWidth=Math.max(1,u*.035);ctx.strokeStyle=shade(c,1.28);ctx.lineCap='round';ctx.stroke();
      for(let j=0;j<3;j++){const xx=x-hw*.2+j*hw*.35;ctx.beginPath();ctx.moveTo(xx*u,(yb-.1)*u);ctx.lineTo((xx+.06)*u,(yb-.02)*u);ctx.strokeStyle=shade(c,.78);ctx.lineWidth=Math.max(1,u*.02);ctx.stroke()}
    }
  }
}
// a beech: smooth grey-beige trunk with root flare, branches and a leafy crown
function drawBeech(x,top,w,R,greens,detail,rand){
  const u=S;
  const tr=()=>{ctx.beginPath();ctx.moveTo((x-w*.95)*u,(GY+.05)*u);
    ctx.quadraticCurveTo((x-w*.5)*u,(GY-.2)*u,(x-w*.45)*u,(GY-1.2)*u);ctx.lineTo((x-w*.36)*u,(top+R*.4)*u);
    ctx.lineTo((x+w*.36)*u,(top+R*.4)*u);ctx.lineTo((x+w*.45)*u,(GY-1.2)*u);
    ctx.quadraticCurveTo((x+w*.5)*u,(GY-.2)*u,(x+w*.95)*u,(GY+.05)*u);ctx.closePath()};
  tr();hGradFill((x-w*.6)*u,(x+w*.6)*u,'#DCD5CB','#A79D91');
  if(detail){
    ctx.save();tr();ctx.clip();
    ctx.strokeStyle='rgba(120,108,96,.45)';ctx.lineWidth=Math.max(1,u*.02);ctx.lineCap='round';
    for(let i=0;i<9;i++){const yy=GY-.6-rand()*(GY-top-1),xx=x-w*.3+rand()*w*.5;ctx.beginPath();ctx.moveTo(xx*u,yy*u);ctx.lineTo((xx+.08+rand()*.1)*u,(yy+.01)*u);ctx.stroke()}
    ctx.fillStyle='rgba(150,190,120,.45)';ctx.beginPath();ctx.ellipse((x-w*.38)*u,(GY-.5)*u,w*.18*u,.45*u,0,0,7);ctx.fill();
    ctx.fillStyle='rgba(255,255,240,.18)';ctx.fillRect((x-w*.3)*u,(top+R*.4)*u,w*.12*u,(GY-top-R*.4)*u);
    ctx.restore();
  }
  // branches up into the crown
  ctx.strokeStyle='#B5AA9C';ctx.lineCap='round';
  for(const[s,l,a]of[[-1,.9,.9],[1,1,.8],[-1,.6,1.2]]){ctx.beginPath();ctx.moveTo(x*u,(top+R*.6)*u);ctx.quadraticCurveTo((x+s*l*.4)*u,(top+R*.3)*u,(x+s*l)*u,(top+R*.05-a*.2)*u);ctx.lineWidth=w*.22*u;ctx.stroke()}
  // crown: three tones of soft leaf clusters
  const blobs=[];for(let i=0;i<(detail?16:9);i++){const a=rand()*Math.PI*2,d=Math.sqrt(rand());blobs.push({x:x+Math.cos(a)*R*d*1.15,y:top+Math.sin(a)*R*d*.7-R*.15,r:R*(.32+rand()*.25)})}
  for(const[k,c,dx,dy]of[[1,greens[0],.04,.06],[.78,greens[1],-.02,0],[.5,greens[2],-.07,-.06]])
    for(const b of blobs){ctx.beginPath();ctx.arc((b.x+dx*R)*u,(b.y+dy*R)*u,b.r*k*u,0,7);ctx.fillStyle=c;ctx.fill()}
  if(detail){ctx.fillStyle=shade(greens[2],1.15);for(let i=0;i<22;i++){const b=blobs[i%blobs.length];ctx.beginPath();ctx.ellipse((b.x+(rand()-.5)*b.r)*u,(b.y-b.r*.3+(rand()-.5)*b.r*.6)*u,.07*u,.04*u,rand()*3,0,7);ctx.fill()}}
}
function drawFern(x,y,s,f,c){
  const u=S;ctx.save();ctx.translate(x*u,y*u);ctx.scale(f,1);ctx.lineCap='round';
  for(const[a,l]of[[-1.1,.85],[-.55,1],[-.1,.95],[.45,.8],[-1.6,.6]]){
    ctx.save();ctx.rotate(a);const L=s*l*u;
    ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(L*.15,-L*.6,L*.55,-L*.95);ctx.lineWidth=Math.max(1,u*.025);ctx.strokeStyle=shade(c,.8);ctx.stroke();
    for(let i=1;i<11;i++){const t=i/11,px=2*(1-t)*t*L*.15+t*t*L*.55,py=2*(1-t)*t*(-L*.6)+t*t*(-L*.95),ll=(1-t*.85)*L*.17;
      for(const sd of[-1,1]){ctx.beginPath();ctx.ellipse(px+sd*ll*.55,py+ll*.15,ll*.6,ll*.22,sd*.6-.3,0,7);ctx.fillStyle=sd<0?shade(c,1.1):c;ctx.fill()}}

}

  if(kind){gradFill((y-s*.9)*u,(y-s*.4)*u,'#F4B1AA','#DC8A84');ctx.fillStyle='#FFF8F0';for(const[dx,dy,r]of[[-.18,-.55,.06],[.06,-.7,.07],[.22,-.5,.05],[-.02,-.5,.04]]){ctx.beginPath();ctx.arc((x+dx*s)*u,(y+dy*s)*u,r*s*u,0,7);ctx.fill()}}

function drawStone(x,y,w,h){const u=S;ctx.beginPath();ctx.ellipse(x*u,y*u,w*u,h*u,0,Math.PI,0);ctx.closePath();gradFill((y-h)*u,y*u,'#D2CFC8','#A9A59D');ctx.beginPath();ctx.ellipse((x-w*.25)*u,(y-h*.62)*u,w*.35*u,h*.2*u,-.2,0,7);ctx.fillStyle='rgba(160,200,130,.55)';ctx.fill()}
function drawFlower(x,y,s,c){const u=S;ctx.beginPath();ctx.moveTo(x*u,y*u);ctx.lineTo(x*u,(y-s)*u);ctx.lineWidth=Math.max(1,u*.02);ctx.strokeStyle='#7FAE79';ctx.stroke();ctx.fillStyle=c;for(let i=0;i<5;i++){const a=i/5*Math.PI*2;ctx.beginPath();ctx.arc((x+Math.cos(a)*s*.18)*u,(y-s+Math.sin(a)*s*.18)*u,s*.13*u,0,7);ctx.fill()}ctx.fillStyle='#FFE28A';ctx.beginPath();ctx.arc(x*u,(y-s)*u,s*.09*u,0,7);ctx.fill()}

// ---------- the old forest: lush, misty jungle (tall trunks with buttress roots, moss, lianas, big leaves, fog) ----------
function drawLeaf(x,y,len,ang,col,vein){
  ctx.save();ctx.translate(x,y);ctx.rotate(ang);
  ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(len*.3,-len*.3,len,0);ctx.quadraticCurveTo(len*.3,len*.3,0,0);
  const g=ctx.createLinearGradient(0,-len*.3,0,len*.3);g.addColorStop(0,shade(col,1.18));g.addColorStop(1,shade(col,.82));ctx.fillStyle=g;ctx.fill();
  if(vein){ctx.beginPath();ctx.moveTo(len*.02,0);ctx.lineTo(len*.92,0);ctx.lineWidth=Math.max(.8,len*.025);ctx.strokeStyle=shade(col,1.35);ctx.stroke();
    ctx.lineWidth=Math.max(.6,len*.012);for(let k=1;k<5;k++){const t=k/5;for(const s of[-1,1]){ctx.beginPath();ctx.moveTo(len*t*.9,0);ctx.lineTo(len*(t*.9+.1),s*len*.13*(1-t*.6));ctx.stroke()}}}
  ctx.restore();
}
// a clump of big jungle leaves on stems, fanned upward
function drawLeafPlant(x,y,s,f,col){
  const u=S;ctx.lineCap='round';
  for(const[a,l]of[[-2.75,.8],[-2.3,1],[-1.75,1.05],[-1.2,.95],[-.6,.8]]){
    const ang=f>0?a:-Math.PI-a,sx=x*u,sy=y*u,ex=sx+Math.cos(ang)*s*l*.45*u,ey=sy+Math.sin(ang)*s*l*.45*u;
    ctx.beginPath();ctx.moveTo(sx,sy);ctx.quadraticCurveTo((sx+ex)/2,ey,ex,ey);ctx.lineWidth=Math.max(1,u*.03*s);ctx.strokeStyle=shade(col,.75);ctx.stroke();
    drawLeaf(ex,ey,s*l*.62*u,ang+(f>0?.35:-.35),col,true);
  }
}
function drawLiana(x0,y0,x1,y1,sag,col,leafCol,R){
  const u=S,cx=(x0+x1)/2,cy=Math.max(y0,y1)+sag;
  ctx.beginPath();ctx.moveTo(x0*u,y0*u);ctx.quadraticCurveTo(cx*u,cy*u,x1*u,y1*u);ctx.lineWidth=Math.max(1,u*.035);ctx.strokeStyle=col;ctx.lineCap='round';ctx.stroke();
  for(let i=1;i<9;i++){const t=i/9,px=(1-t)*(1-t)*x0+2*(1-t)*t*cx+t*t*x1,py=(1-t)*(1-t)*y0+2*(1-t)*t*cy+t*t*y1;drawLeaf(px*u,py*u,(.14+R()*.08)*u,1.2+R()*1.6,leafCol,false)}

// a hanging liana straight down from a branch
function drawHang(x,y0,len,col,leafCol,R){
  const u=S;ctx.beginPath();ctx.moveTo(x*u,y0*u);ctx.bezierCurveTo((x+.15)*u,(y0+len*.4)*u,(x-.15)*u,(y0+len*.7)*u,(x+.05)*u,(y0+len)*u);
  ctx.lineWidth=Math.max(1,u*.025);ctx.strokeStyle=col;ctx.lineCap='round';ctx.stroke();
  for(let i=1;i<8;i++){const t=i/8;drawLeaf((x+Math.sin(t*5)*.06)*u,(y0+len*t)*u,(.12+R()*.06)*u,(i%2?.6:2.5)+R()*.4,leafCol,false)}

// a jungle tree: buttress roots, tall trunk with moss and grooves, dense crown
function drawJTree(x,w,crown,R2,rand,P){
  const u=S,lean=(rand()-.5)*.35,tx=x+lean;
  for(const s of[-1,1])for(const k of[.55,1]){ctx.beginPath();ctx.moveTo((x+s*w*.35)*u,(GY-1.5*k)*u);ctx.quadraticCurveTo((x+s*w*.5)*u,(GY-.35)*u,(x+s*w*(.8+k*.9))*u,(GY+.06)*u);ctx.lineTo((x+s*w*.1)*u,(GY+.06)*u);ctx.closePath();hGradFill((x-w*1.5)*u,(x+w*1.5)*u,P.trunk[0],P.trunk[1])}
  const tr=()=>{ctx.beginPath();ctx.moveTo((x-w*.5)*u,(GY+.05)*u);ctx.quadraticCurveTo((x-w*.45+lean*.3)*u,((GY+crown)/2)*u,(tx-w*.36)*u,(crown+R2*.3)*u);ctx.lineTo((tx+w*.36)*u,(crown+R2*.3)*u);ctx.quadraticCurveTo((x+w*.45+lean*.3)*u,((GY+crown)/2)*u,(x+w*.5)*u,(GY+.05)*u);ctx.closePath()};
  tr();hGradFill((x-w*.55)*u,(x+w*.55)*u,P.trunk[0],P.trunk[1]);
  if(P.detail){
    ctx.save();tr();ctx.clip();
    ctx.strokeStyle='rgba(40,35,25,.28)';ctx.lineWidth=Math.max(1,u*.02);
    for(let i=0;i<5;i++){const xx=x-w*.35+i*w*.18;ctx.beginPath();ctx.moveTo(xx*u,GY*u);ctx.bezierCurveTo((xx+.05)*u,(GY-3)*u,(xx-.05+lean*.5)*u,(crown+2)*u,(xx+lean)*u,crown*u);ctx.stroke()}
    // moss on the lit side
    for(let i=0;i<14;i++){const yy=GY-.2-rand()*(GY-crown-1),k=(GY-yy)/(GY-crown);ctx.beginPath();ctx.ellipse((x-w*.38+lean*k)*u,yy*u,(.08+rand()*.12)*u,(.18+rand()*.3)*u,0,0,7);ctx.fillStyle=rand()<.5?P.moss:shade(P.moss,1.15);ctx.fill()}
    ctx.fillStyle='rgba(230,255,220,.12)';ctx.fillRect((x-w*.45)*u,crown*u,w*.18*u,(GY-crown)*u);
    ctx.restore();
  }
  // branches
  ctx.strokeStyle=P.trunk[1];ctx.lineCap='round';
  for(const[s,l,a]of[[-1,1.1,.3],[1,1.3,.1],[-1,.7,.9],[1,.6,1.1]]){ctx.beginPath();ctx.moveTo(tx*u,(crown+R2*.45)*u);ctx.quadraticCurveTo((tx+s*l*.5)*u,(crown+R2*.35)*u,(tx+s*l)*u,(crown+R2*.1-a*.3)*u);ctx.lineWidth=w*.2*u;ctx.stroke()}

  const blobs=[];for(let i=0;i<(P.detail?22:12);i++){const a=rand()*Math.PI*2,d=Math.sqrt(rand());blobs.push({x:tx+Math.cos(a)*R2*d*1.3,y:crown+Math.sin(a)*R2*d*.62-R2*.1,r:R2*(.3+rand()*.24)})}
  for(const[k,c,dx,dy]of[[1,P.g[0],.03,.1],[.8,P.g[1],-.02,0],[.52,P.g[2],-.07,-.08]])
    for(const b of blobs){ctx.beginPath();ctx.arc((b.x+dx*R2)*u,(b.y+dy*R2)*u,b.r*k*u,0,7);ctx.fillStyle=c;ctx.fill()}
  if(P.detail){for(let i=0;i<40;i++){const b=blobs[i%blobs.length];drawLeaf((b.x+(rand()-.5)*b.r*1.4)*u,(b.y+(rand()-.3)*b.r)*u,(.16+rand()*.12)*u,rand()*6.3,rand()<.5?P.g[2]:P.g[1],false)}
    // leaves dangling under the crown
    for(let i=0;i<10;i++){const xx=tx+(rand()-.5)*R2*2.2,yy=crown+R2*(.35+rand()*.25);drawLeaf(xx*u,yy*u,(.18+rand()*.1)*u,1.2+rand()*.8,P.g[1],false)}}
}
const PAL_NEAR={trunk:['#9A8B6C','#5C523F'],moss:'#7DA85E',g:['#2E6A48','#3F8A58','#68AE6E'],detail:true};
const PAL_MID={trunk:['#93A58E','#6E8471'],moss:'#8DB07E',g:['#5E9373','#74A783','#8FBD94'],detail:false};
function paintFar(x0,x1,R){
  const u=S;
  for(let x=x0;x<x1;x+=.7+R()*.9){const w=.18+R()*.15;ctx.fillStyle=R()<.5?'#A9CDB8':'#B4D4C0';ctx.fillRect((x-w/2)*u,(LTOP)*u,w*u,(GY-LTOP)*u)}
  for(let x=x0;x<x1;x+=.6+R()*.6){ctx.beginPath();ctx.arc(x*u,(LTOP+2+R()*2.5)*u,(1+R()*.8)*u,0,7);ctx.fillStyle=R()<.5?'#A3C9B2':'#B0D2BC';ctx.fill()}
  ctx.beginPath();ctx.moveTo(x0*u,LBOT*u);for(let x=x0;x<=x1+.5;x+=.4)ctx.lineTo(x*u,(GY-1.6+Math.sin(x*.7)*.35+Math.sin(x*2.1)*.15)*u);ctx.lineTo(x1*u,LBOT*u);ctx.closePath();ctx.fillStyle='#A6CBB2';ctx.fill();

function paintMid(x0,x1,R){

  ctx.beginPath();ctx.moveTo(x0*u,LBOT*u);for(let x=x0;x<=x1+.5;x+=.35)ctx.lineTo(x*u,(GY-.75+Math.sin(x*1.3)*.2+Math.sin(x*3.7)*.08)*u);ctx.lineTo(x1*u,LBOT*u);ctx.closePath();ctx.fillStyle='#7EAA80';ctx.fill();
  for(let x=x0;x<x1;x+=.5+R()*.6)drawLeafPlant(x,GY-.6,.7+R()*.5,R()<.5?1:-1,'#6FA27A');
  ctx.globalCompositeOperation='source-atop';ctx.fillStyle='rgba(185,222,200,.5)';ctx.fillRect(x0*u,LTOP*u,(x1-x0)*u,(LBOT-LTOP)*u);ctx.globalCompositeOperation='source-over';
}
const NEAR_TREES=[-1.6,.7,9.6,12.4,15.2,17.9,20.6,23.4,26.2,34.8];
const FLOOR=[];{const R=mulberry(5);for(let x=-3;x<WW+3;x+=.6+R()*.9){const k=R();FLOOR.push({x,k:k<.34?'plant':k<.58?'fern':k<.68?'mush':k<.76?'stone':k<.84?'flower':'tuft',s:.7+R()*.5,f:R()<.5?-1:1,c:R()})}}
function paintNear(x0,x1,R){
  const u=S;

  const top=x=>GY-2.4-Math.sin(x*3.1)*.18-Math.sin(x*1.3)*.25-(x>GX+3?.8:0);
  ctx.beginPath();ctx.moveTo((GX-4.5)*u,GY*u);for(let x=GX-4.5;x<=WW+3;x+=.35)ctx.lineTo(x*u,top(x)*u);ctx.lineTo((WW+3)*u,GY*u);ctx.closePath();
  gradFill((GY-3.4)*u,GY*u,'#3F7E55','#2C5C3E');
  for(let x=GX-4.4;x<WW+3;x+=.28)drawLeaf(x*u,(top(x)+.25)*u,(.35+R()*.25)*u,-1.2-R()*.8,R()<.5?'#4E9462':'#5DA36C',true);
  // trees, lianas between them
  const trees=NEAR_TREES.map(x=>({x,crown:.6+R()*1.2,R:2+R()*.6}));
  for(const t of trees)drawJTree(t.x,.55+R()*.18,t.crown,t.R,R,PAL_NEAR);
  drawJTree(TX,.7,.6,2.5,R,PAL_NEAR);
  for(let i=0;i<trees.length-1;i++)if(R()<.7){const a=trees[i],b=trees[i+1];if(Math.abs(b.x-GX)<2||Math.abs(a.x-GX)<2)continue;drawLiana(a.x+.25,a.crown+1.2,b.x-.25,b.crown+1.4,1.6+R()*1.6,'#5E6E45','#4F9560',R)}
  for(const t of trees)if(R()<.8)drawHang(t.x+(R()<.5?-.9:.9),t.crown+1,2+R()*3,'#5E6E45','#4F9560',R);
  // the branch out to the nest
  ctx.beginPath();ctx.moveTo((TX-.2)*u,(NY+.55)*u);ctx.quadraticCurveTo((TX-.9)*u,(NY+.35)*u,(NX-.2)*u,(NY+.12)*u);ctx.lineTo((NX-.25)*u,(NY+.28)*u);ctx.quadraticCurveTo((TX-.9)*u,(NY+.6)*u,(TX-.2)*u,(NY+.95)*u);ctx.closePath();
  gradFill(NY*u,(NY+1)*u,'#9A8B6C','#5C523F');
  ctx.fillStyle=PAL_NEAR.moss;ctx.beginPath();ctx.ellipse((TX-.8)*u,(NY+.42)*u,.3*u,.07*u,-.2,0,7);ctx.fill();
  ctx.beginPath();ctx.moveTo((NX+.4)*u,(NY+.2)*u);ctx.quadraticCurveTo((NX+.2)*u,(NY-.2)*u,(NX+.05)*u,(NY-.5)*u);ctx.lineWidth=.06*u;ctx.strokeStyle='#6E6250';ctx.lineCap='round';ctx.stroke();
  for(const[dx,dy,a]of[[.05,-.55,-.5],[.25,-.25,.6],[-.1,-.4,-1.3]])drawLeaf((NX+dx)*u,(NY+dy)*u,.28*u,a-1,'#4F9560',true);
  // the forest floor: moss and dark earth
  ctx.beginPath();ctx.moveTo(x0*u,LBOT*u);for(let x=x0;x<=x1+.4;x+=.4)ctx.lineTo(x*u,(GY-.1+Math.sin(x*1.7)*.05)*u);ctx.lineTo(x1*u,LBOT*u);ctx.closePath();
  gradFill(GY*u,(GY+3)*u,'#6F9E62','#3F6B48');

  ctx.beginPath();ctx.moveTo(x0*u,(GY+.08)*u);for(let x=x0;x<=x1+.4;x+=.4)ctx.lineTo(x*u,(GY+.02+Math.sin(x*.8)*.04)*u);for(let x=x1+.4;x>=x0;x-=.4)ctx.lineTo(x*u,(GY+.62+Math.sin(x*.55)*.06)*u);ctx.closePath();

  ctx.fillStyle='rgba(80,60,40,.3)';for(let x=x0;x<x1;x+=.3+R()*.5){ctx.beginPath();ctx.ellipse(x*u,(GY+.15+R()*.4)*u,(.03+R()*.04)*u,.02*u,0,0,7);ctx.fill()}
  for(let x=x0;x<x1;x+=.5+R()*1)drawLeaf(x*u,(GY+.12+R()*.4)*u,.12*u,R()*6,R()<.5?'#C99A5E':'#8FAE5E',false);
  // big leaves, ferns, mushrooms, stones and flowers behind the path
  for(const o of FLOOR){

    if(o.k==='plant')drawLeafPlant(o.x,y,o.s*1.1,o.f,o.c<.5?'#3F8A58':'#4E9A62');

  }
}

// screen-space foreground: big dark leaves in the corners, light motes
let fgLeaves=[],motes=[],flies=[];
const FGP=1.35;
function setupFg(){
  // foreground in front of the path, scrolling faster than the forest (FGP): clumps of bushes, sometimes sparse,
  // sometimes dense, and now and then a big dark tree trunk (never in front of the camp or the gate)
  const R=mulberry(99);fgLeaves=[];
  const x0=camMin()*FGP-2,x1=camMax()*FGP+VW+3;
  const spots=[(CX+1.2-VW*.5)*FGP,(GX-VW*.5)*FGP];   // where the camera stands at the camp and at the gate
  const free=x=>spots.every(c=>x<c+VW*.05-1||x>c+VW*.95+1);
  for(let t=x0+2+R()*3;t<x1;t+=6+R()*4){if(!free(t))continue;fgLeaves.push({k:'trunk',x:t,w:.8+R()*.5,lean:(R()-.5)*.12,ph:R()*7});
    for(let i=0;i<3;i++)fgLeaves.push({k:R()<.5?'plant':'fern',x:t+(R()-.5)*1.6,dy:1+R()*.4,s:.9+R()*.4,f:R()<.5?1:-1,a:(R()-.5)*.3,ph:R()*7,c:R()})}
  let x=x0;
  while(x<x1){
    const r=R();
    const dense=r>.35,n=dense?4+Math.floor(R()*4):1+Math.floor(R()*2),w=dense?1.6+R()*2:.6+R()*.6;
    if(dense)fgLeaves.push({k:'mass',x:x+w/2,w,dy:.9,ph:R()*7,c:R()});
    for(let i=0;i<n;i++){const k=R();fgLeaves.push({k:k<.55?'plant':k<.85?'fern':'grass',x:x+R()*w,dy:(dense?.95:1.1)+R()*(dense?.9:.5),s:(dense?1.1:.9)+R()*(dense?.7:.35),f:R()<.5?1:-1,a:(R()-.5)*.35,ph:R()*7,c:R()})}
    x+=w+(dense?.4:1)+R()*(dense?1:2.2);
  }
  // trunks first, then the plants from back to front
  fgLeaves.sort((p,q)=>(p.k==='trunk'?0:1)-(q.k==='trunk'?0:1)||(p.dy||0)-(q.dy||0));
  motes=Array.from({length:22},()=>({x:Math.random()*W,y:Math.random()*H,r:1+Math.random()*2.2,ph:Math.random()*7,v:4+Math.random()*10}));
  flies=Array.from({length:12},()=>({x:Math.random()*W,y:Math.random()*groundPx,ph:Math.random()*7,v:.4+Math.random()*.6}));
}
function drawFgTrunk(l,x){
  const u=S,w=l.w*u,top=-20,bot=H+20,lean=l.lean*u*8;
  ctx.beginPath();ctx.moveTo(x-w*.5+lean,top);ctx.lineTo(x+w*.5+lean,top);
  ctx.quadraticCurveTo(x+w*.52,H*.6,x+w*.6,groundPx+u*.6);ctx.quadraticCurveTo(x+w*1.1,groundPx+u*1.1,x+w*1.6,bot);
  ctx.lineTo(x-w*1.5,bot);ctx.quadraticCurveTo(x-w*1.05,groundPx+u*1.1,x-w*.6,groundPx+u*.6);ctx.quadraticCurveTo(x-w*.52,H*.6,x-w*.5+lean,top);ctx.closePath();
  const g=ctx.createLinearGradient(x-w*.6,0,x+w*.6,0);g.addColorStop(0,'#4A4836');g.addColorStop(.35,'#3A3A2B');g.addColorStop(1,'#1F2219');ctx.fillStyle=g;ctx.fill();
  ctx.save();ctx.clip();
  ctx.strokeStyle='rgba(0,0,0,.22)';ctx.lineWidth=Math.max(1,u*.03);
  for(let i=0;i<4;i++){const xx=x-w*.3+i*w*.2;ctx.beginPath();ctx.moveTo(xx+lean,top);ctx.bezierCurveTo(xx+w*.05,H*.4,xx-w*.05,H*.7,xx+(i-1.5)*w*.25,bot);ctx.stroke()}
  ctx.fillStyle='rgba(95,140,70,.55)';for(let i=0;i<6;i++){const yy=H*(.1+i*.15)+Math.sin(l.ph+i)*u*.3;ctx.beginPath();ctx.ellipse(x-w*.38+lean*(1-yy/H),yy,w*.14,u*(.25+((i*37)%5)*.06),0,0,7);ctx.fill()}
  ctx.fillStyle='rgba(220,255,200,.08)';ctx.fillRect(x-w*.5,top,w*.15,bot-top);
  ctx.restore();
}
function drawFg(){
  const now=performance.now()/1000;
  for(const l of fgLeaves){
    const x=(l.x-camX*FGP)*S;
    if(l.k==='trunk'){if(x>-S*3&&x<W+S*3)drawFgTrunk(l,x);continue}
    const y=groundPx+S*l.dy;if(x<-S*2.5||x>W+S*2.5)continue;
    ctx.save();ctx.translate(x,y);ctx.rotate(l.a+Math.sin(now*.8+l.ph)*.04);ctx.translate(-x,-y);
    const col=l.c<.5?'#2A5E3E':'#33704A';
    if(l.k==='mass'){ctx.restore();const n=Math.max(3,Math.round(l.w*2.2));
      for(let i=0;i<n;i++){const bx=x+(i/(n-1)-.5)*l.w*S,by=y+S*(.55+Math.sin(l.ph+i*2.1)*.12),r=S*(.45+Math.abs(Math.sin(l.ph*3+i))*.3);
        ctx.beginPath();ctx.arc(bx,by,r,0,7);const g=ctx.createRadialGradient(bx-r*.3,by-r*.4,r*.1,bx,by,r);g.addColorStop(0,'#3C7E52');g.addColorStop(1,'#1F4A30');ctx.fillStyle=g;ctx.fill();
        for(let j=0;j<4;j++){const a2=-2.6+j*.7;drawLeaf(bx+Math.cos(a2)*r*.7,by+Math.sin(a2)*r*.7,r*.7,a2,j%2?'#2F6A45':'#3B7C52',true)}}
      for(let i=0;i<n+1;i++){const bx=x+(i/n-.5)*l.w*S*1.1,by=y+S*1.25,r=S*.6;ctx.beginPath();ctx.arc(bx,by,r,0,7);ctx.fillStyle='#21492F';ctx.fill()}
      continue}
    if(l.k==='plant')drawLeafPlant(x/S,y/S,l.s,l.f,col);
    else if(l.k==='fern')drawFern(x/S,y/S,l.s*1.1,l.f,l.c<.5?'#2E6A45':'#3A7A50');
    else{ctx.strokeStyle=col;ctx.lineCap='round';ctx.lineWidth=Math.max(1.5,S*.035);for(let k=-4;k<=4;k++){ctx.beginPath();ctx.moveTo(x+k*S*.04,y);ctx.quadraticCurveTo(x+k*S*.08,y-S*l.s*.5,x+k*S*.2+Math.sin(now+l.ph+k)*S*.03,y-S*l.s*(.75+Math.abs(Math.sin(k*1.7))*.3));ctx.stroke()}}
    ctx.restore();
  }
  const day=1-st.night;
  if(day>0){ctx.save();ctx.globalCompositeOperation='lighter';
    for(const m of motes){const y=(m.y-now*m.v)%H,yy=y<0?y+H:y,x=m.x+Math.sin(now*.7+m.ph)*12,a=(.2+.2*Math.sin(now*2+m.ph))*day;
      const g=ctx.createRadialGradient(x,yy,0,x,yy,m.r*4);g.addColorStop(0,`rgba(245,255,215,${a})`);g.addColorStop(1,'rgba(245,255,215,0)');ctx.fillStyle=g;ctx.fillRect(x-m.r*4,yy-m.r*4,m.r*8,m.r*8)}
    ctx.restore()}
}
function drawRays(){
  const a=(1-st.night)*.32;if(a<=0)return;
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(const[k,w]of[[.62,.09],[.78,.05],[.3,.06],[.05,.04]]){const x=W*k-(camX*S*.08)%W;
    const g=ctx.createLinearGradient(0,0,0,groundPx);g.addColorStop(0,`rgba(240,255,215,${a})`);g.addColorStop(1,'rgba(240,255,215,0)');
    ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x+W*w,0);ctx.lineTo(x-W*.25+W*w*2,groundPx);ctx.lineTo(x-W*.3,groundPx);ctx.closePath();ctx.fillStyle=g;ctx.fill()}
  ctx.restore();
}
function drawNight(){
  const n=st.night;if(n<=0)return;
  ctx.save();ctx.globalCompositeOperation='multiply';ctx.globalAlpha=n;ctx.fillStyle='#93AFC8';ctx.fillRect(0,0,W,H);ctx.restore();
  // a big soft moon and fireflies
  ctx.save();ctx.globalAlpha=n;
  const mx=W*.82,my=safe.t+H*.1,mr=Math.min(W,H)*.06;
  let g=ctx.createRadialGradient(mx,my,mr*.5,mx,my,mr*3);g.addColorStop(0,'rgba(255,250,225,.35)');g.addColorStop(1,'rgba(255,250,225,0)');ctx.fillStyle=g;ctx.fillRect(mx-mr*3,my-mr*3,mr*6,mr*6);
  ctx.beginPath();ctx.arc(mx,my,mr,0,7);ctx.fillStyle='#FFF6D8';ctx.fill();
  const now=performance.now()/1000;ctx.globalCompositeOperation='lighter';
  for(const f of flies){const x=f.x+Math.sin(now*f.v+f.ph)*30,y=f.y+Math.cos(now*f.v*1.3+f.ph)*18,a=.4+.6*Math.max(0,Math.sin(now*2*f.v+f.ph));
    g=ctx.createRadialGradient(x,y,0,x,y,7);g.addColorStop(0,`rgba(235,255,120,${a})`);g.addColorStop(.3,`rgba(215,250,90,${a*.6})`);g.addColorStop(1,'rgba(215,250,90,0)');ctx.fillStyle=g;ctx.fillRect(x-7,y-7,14,14)}
  ctx.restore();
}
function drawSky(){
  const g=ctx.createLinearGradient(0,0,0,groundPx);g.addColorStop(0,'#E4F3E2');g.addColorStop(1,'#B9DCC4');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
}

// ---------- characters ----------
const PALS={
  blue:{body:['#6CB8FF','#1E62D0'],head:['#79C2FF','#2470DA'],belly:['#FFE58A','#F5A623'],crown:['#9BE36E','#3FAF4A'],wing:['#174FB0','#2266D6','#3A86F0'],tail:['#1C56B8','#2F86F0','#1F66D0'],rim:'#174A9E'},
  hyacinth:{body:['#A88BFF','#5A3BC8'],head:['#B39AFF','#6346D2'],belly:['#9C7FF5','#5A3BC8'],crown:['#B39AFF','#6346D2'],wing:['#47309E','#5A3BC8','#7A5CE8'],tail:['#47309E','#6A4CD8','#5A3BC8'],rim:'#3A2588'},
};
function rimLight(path,col,w){ctx.save();path();ctx.clip();path();ctx.translate(w*.6,-w*.5);ctx.lineWidth=w*2;ctx.strokeStyle=col;ctx.stroke();ctx.restore()}
function cEye(x,y,rx,ry,iris,lx,ly,blink,soft){
  ry=blink?ry*.12:ry;
  ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,7);ctx.fillStyle='#FFFDF8';ctx.fill();
  ctx.lineWidth=Math.max(.6,rx*(soft?.05:.09));ctx.strokeStyle=soft?'rgba(30,40,90,.25)':'rgba(60,35,30,.5)';ctx.stroke();
  if(blink)return;
  ctx.save();ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,7);ctx.clip();
  const ix=x+lx*rx*.38,iy=y+ly*ry*.32,ir=Math.min(rx,ry)*.64;
  ctx.beginPath();ctx.arc(ix,iy,ir,0,7);const g=ctx.createRadialGradient(ix-ir*.3,iy-ir*.3,ir*.1,ix,iy,ir);g.addColorStop(0,iris[0]);g.addColorStop(1,iris[1]);ctx.fillStyle=g;ctx.fill();
  ctx.beginPath();ctx.arc(ix,iy,ir*.52,0,7);ctx.fillStyle='#120A06';ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ix+ir*.34,iy-ir*.38,ir*.3,0,7);ctx.fill();ctx.beginPath();ctx.arc(ix-ir*.3,iy+ir*.34,ir*.13,0,7);ctx.fill();
  ctx.restore();
}
function brow(x1,y1,cx,cy,x2,y2,w,col){ctx.beginPath();ctx.moveTo(x1,y1);ctx.quadraticCurveTo(cx,cy,x2,y2);ctx.lineWidth=w;ctx.lineCap='round';ctx.strokeStyle=col;ctx.stroke()}

// the parrots (same drawing as in Danger in the Jungle); x,y body centre in px, u px per unit, f facing
function drawParrot(x,y,u,f,flap,o={}){
  const P=o.pal||PALS.blue,now=performance.now()/1000;
  ctx.save();ctx.translate(x,y);ctx.scale(f,1);ctx.lineJoin='round';ctx.lineCap='round';
  const sway=Math.sin(flap*.5)*.06,wingA=o.sit?.15:-.55+Math.sin(flap)*.9;

    ctx.save();ctx.translate(-.18*u,.14*u);ctx.rotate(1.05+k+sway);
    ctx.beginPath();ctx.moveTo(-.045*u,0);ctx.quadraticCurveTo(-.1*u,.38*u,0,.66*u);ctx.quadraticCurveTo(.1*u,.38*u,.045*u,0);ctx.closePath();

  ctx.save();body();ctx.clip();ctx.beginPath();ctx.ellipse(.1*u,.17*u,.2*u,.22*u,-.2,0,7);radFill(.06*u,.08*u,.26*u,P.belly[0],P.belly[1]);ctx.restore();
  rimLight(body,'rgba(255,245,200,.45)',.025*u);
  const hx=.2*u,hy=-.25*u,hr=.26*u,head=()=>{ctx.beginPath();ctx.arc(hx,hy,hr,0,7)};
  head();radFill(hx-.08*u,hy-.12*u,hr*1.25,P.head[0],P.head[1]);rimLight(head,'rgba(255,245,200,.5)',.025*u);
  for(let k=0;k<3;k++){ctx.save();ctx.translate(hx-.08*u+k*.07*u,hy-hr*.92);ctx.rotate(-.7+k*.35+Math.sin(now*3+k)*.05);ctx.beginPath();ctx.ellipse(0,-.07*u,.03*u,.09*u,0,0,7);ctx.fillStyle=k%2?P.crown[0]:P.crown[1];ctx.fill();ctx.restore()}
  const blink=o.sleep||((now+(o.seed||0))%3.4)<.12,lx=o.look!=null?o.look:.45,ly=o.lookY||-.1;
  cEye(hx+.01*u,hy-.03*u,.12*u,.15*u,['#FFE07A','#C9780A'],lx,ly,blink,true);
  cEye(hx+.21*u,hy-.04*u,.1*u,.13*u,['#FFE07A','#C9780A'],lx,ly+.05,blink,true);
  if(P===PALS.hyacinth){
    const lash=(ex,ey,rx,ry,sc)=>{
      ctx.strokeStyle='#1C1030';ctx.lineCap='round';
      if(blink){ctx.beginPath();ctx.moveTo(ex-rx,ey);ctx.quadraticCurveTo(ex,ey+ry*.35,ex+rx,ey);ctx.lineWidth=.022*u*sc;ctx.stroke();return}
      ctx.beginPath();ctx.ellipse(ex,ey,rx,ry,0,Math.PI*1.05,Math.PI*1.95);ctx.lineWidth=.024*u*sc;ctx.stroke();
      for(let k=0;k<3;k++){const a=-1.25+k*.42,x0=ex+Math.cos(a)*rx,y0=ey+Math.sin(a)*ry,l=(.07+k*.012)*u*sc;
        ctx.beginPath();ctx.moveTo(x0,y0);ctx.quadraticCurveTo(x0+Math.cos(a-.3)*l*.6,y0+Math.sin(a-.3)*l*.9,x0+Math.cos(a+.25)*l,y0+Math.sin(a+.25)*l-.02*u*sc);ctx.lineWidth=.016*u*sc;ctx.stroke()}
    };
    lash(hx+.01*u,hy-.03*u,.12*u,.15*u,1);lash(hx+.21*u,hy-.04*u,.1*u,.13*u,.85);
  }
  const bc=shade(P.rim,.9);
  brow(hx-.1*u,hy-.2*u,hx+.01*u,hy-.3*u,hx+.11*u,hy-.22*u,.035*u,bc);
  brow(hx+.13*u,hy-.2*u,hx+.21*u,hy-.25*u,hx+.3*u,hy-.18*u,.03*u,bc);
  const beak=()=>{ctx.beginPath();ctx.moveTo(hx+.13*u,hy+.08*u);ctx.bezierCurveTo(hx+.3*u,hy-.02*u,hx+.47*u,hy+.08*u,hx+.41*u,hy+.27*u);ctx.bezierCurveTo(hx+.36*u,hy+.17*u,hx+.28*u,hy+.15*u,hx+.18*u,hy+.17*u);ctx.closePath()};

function introBlue(t,loop){
  // circles around the nest, then lands on its branch
  const cy=Math.max(NY-1.25,camY+.9),A=t*1.25;
  if(loop||t<3.6)return{x:NX+.6+Math.cos(A)*1.5,y:cy+Math.sin(A*2)*.4,f:-Math.sin(A)>=0?1:-1,sit:false};

}
function updIntro(dt){
  const t=st.t,b=st.blue;

    if(st.mode==='menu')return;
    if(t>4.7&&!st.egg){st.egg={x:SLOT(2).x,y:SLOT(2).y,vy:0,rot:0,state:'wobble',t:0}}

      if(e.state==='wobble'&&e.t>.8){e.state='fall';st.eggs=2;popText(PURP.x,PURP.y-.6,'!','#FFFFFF','#B4423E')}
      if(e.state==='fall'){e.vy+=13*dt;e.y+=e.vy*dt;e.rot+=dt*5;
        if(e.y>=REST.y){e.y=REST.y;if(e.vy>3){e.vy=-e.vy*.25}else{e.state='bag';e.vy=0;e.rot=.4;e.t=0}
          if(!st.awake){st.awake=true;popText(CX-.2,GY-1.3,T.huch)}}}
      if(e.state==='bag'&&e.t>1.1)askHand();
    }
  }

function askHand(){st.mode='egg';st.t=0;$('handBtn').hidden=false;$('cine').classList.add('ask');capIdx=-1;setTimeout(()=>{try{$('handBtn').focus({preventScroll:true})}catch(_){}},50)}

function bez(a,c,b,k){return{x:(1-k)*(1-k)*a.x+2*(1-k)*k*c.x+k*k*b.x,y:(1-k)*(1-k)*a.y+2*(1-k)*k*c.y+k*k*b.y}}
function updGive(dt){
  const t=st.t,b=st.blue,e=st.egg;
  // she sits up, grabs the egg from her sleeping bag and stretches her arm up high; the parrot takes it from her hand
  st.sit=t<5.4?ease(t/.8):1-ease((t-5.4)/.9);
  st.arm=t<3.4?ease((t-1.1)/.8):1-ease((t-3.4)/.6);
  const down=eggInHand(handWorld(1,0)),up=eggInHand(handWorld(1,1));
  const above={x:up.x,y:up.y-.45},slot=SLOT(2),slotAbove={x:slot.x,y:slot.y-.45};
  if(t<.8){/* she sits up */}
  else if(t<1.1){const k=ease((t-.8)/.3);e.x=lerp(REST.x,down.x,k);e.y=lerp(REST.y,down.y,k);e.rot=lerp(.4,0,k);e.state='grab'}
  else if(t<3.1){e.state='hand';const h=eggInHand(handWorld(1,st.arm));e.x=h.x;e.y=h.y;e.rot=0}
  if(t<1.9){b.x=PERCH.x;b.y=PERCH.y;b.sit=true;b.f=-1}
  else if(t<3.1){const k=ease((t-1.9)/1.2),p=bez(PERCH,{x:(PERCH.x+above.x)/2+.8,y:above.y-.2},above,k);b.f=p.x<b.x?-1:1;b.x=p.x;b.y=p.y;b.sit=false}
  else if(t<4.6){const k=ease((t-3.1)/1.5),p=bez(above,{x:(above.x+slot.x)/2-.6,y:slotAbove.y-1.3},slotAbove,k);b.f=p.x<b.x?-1:(p.x>b.x?1:b.f);b.x=p.x;b.y=p.y;b.sit=false;e.state='carry';e.x=b.x;e.y=b.y+.45}
  else if(t<5.4){if(e.state!=='done'){e.state='done';st.eggs=3;hearts(NX,NY-.5,7);popText(NX+.2,NY-1.1,T.danke)}
    const k=ease((t-4.6)/.8),p=bez(slotAbove,{x:(slotAbove.x+PERCH.x)/2,y:slotAbove.y-.6},PERCH,k);b.f=1;b.x=p.x;b.y=p.y;b.sit=k>=1;if(b.sit)b.f=-1}

function updPlay(dt){

  L.x=clamp(L.x+dx*WALK*dt,-.6,GX);L.ph+=dt*11.5*Math.abs(dx);

function updGate(dt){
  const t=st.t,L=st.lilly;
  st.gate=ease(t/1.2);
  if(t>1.2&&t<2.4){const d=GX-L.x;L.moving=Math.abs(d)>.03;if(L.moving){L.f=d>0?1:-1;L.x+=Math.sign(d)*Math.min(Math.abs(d),WALK*dt);L.ph+=dt*9}}
  else L.moving=false;
  if(t>=2.4){L.depth=clamp((t-2.4)/1.8,0,1);L.moving=L.depth<1;L.ph+=dt*7}
  st.eyes=t>3.2?clamp((t-3.2)/.5,0,1):0;

function update(dt){
  st.t+=dt;st.blue.flap+=dt*14;
  if(st.banner){st.banner.t-=dt;if(st.banner.t<=0)st.banner=null}
  if(st.mode==='menu'||st.mode==='intro')updIntro(dt);

function draw(){

  drawButterflies();
  if(st.camp){
    const sit=st.mode==='give'?st.sit:0,arm=st.mode==='give'?st.arm:0;
    const surprised=st.awake&&(st.mode==='intro'||st.mode==='egg'||(st.mode==='give'&&st.t<.8));
    drawCamp({sit,arm,egg:!!(egg&&egg.state==='hand'),sleep:!st.awake,zzz:!st.awake,surprise:surprised,lookY:-.4,lookX:.4});
  }else if(L.depth<=0)drawWalker(L);
  const b=st.blue;drawParrot(X(b.x),Y(b.y),S*.85,b.f,b.flap,{sit:b.sit,claws:egg&&egg.state==='carry',look:b.sit?.3:.5,lookY:b.sit?.4:.1});
  if(egg&&egg.state!=='done'&&egg.state!=='hand')drawEgg(X(egg.x),Y(egg.y),S,egg.rot);
  drawParts();
  drawFg();
  drawNight();
  if(st.mode==='menu')drawTitle();
  if(st.banner)drawBanner();
}
function drawWalker(L){
  const d=L.depth,sc=1-d*.45;
  ctx.save();ctx.globalAlpha=1-Math.max(0,d-.55)/.45;
  drawLilly(X(L.x),Y(GY+.38-d*.75),S*sc,L.f,L.ph,{moving:L.moving,back:d>0,wave:false});
  ctx.restore();
}

// ---------- flow ----------
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(st&&!st.paused){update(dt);moveCam(dt);captions()}
  draw();requestAnimationFrame(loop);
}
function captions(){
  const c=$('caption');
  let i=-1;
  if(st.mode==='intro')i=st.t<2.6?0:st.t<4.9?1:2;
  else if(st.mode==='egg')i=3;
  else if(st.mode==='give')i=st.t<4.6?-1:st.t<6.3?4:5;
  if(i!==capIdx){capIdx=i;c.style.opacity=0;setTimeout(()=>{c.textContent=i<0?'':T.cap[i];c.style.opacity=i<0?0:1},i===0?0:250)}
}
function setUI(mode){
  $('menu').hidden=mode!=='menu';
  const cine=mode==='intro';$('cine').hidden=!cine;if(cine){$('handBtn').hidden=true;$('cine').classList.remove('ask')}
  $('ctrl').classList.toggle('off',mode!=='play');$('pauseBtn').hidden=mode!=='play';
  if(mode!=='play')hint(null);
  if(mode!=='sheet'){$('sheetOv').hidden=true;card=null;cv.classList.remove('dim')}
  if(mode!=='menu')$('howOv').hidden=true;
  joyReset();for(const k in keys)keys[k]=0;
}
function fadeTo(cb,hold){
  const f=$('fade');f.classList.add('on');
  setTimeout(()=>{cb();requestAnimationFrame(()=>requestAnimationFrame(()=>f.classList.remove('on')))},hold||360);
}
function begin(){
  try{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{})}catch(_){}
  fadeTo(()=>{st=fresh('intro');capIdx=-1;setUI('intro');moveCam(0,true)});
}
function showMenu(){st=fresh('menu');setUI('menu');moveCam(0,true)}
function toMenu(){fadeTo(showMenu)}
function pause(){if(!st||st.paused)return;st.paused=true;showCard('pause')}
function resume(){if(!st)return;st.paused=false;last=performance.now();setUI('play')}
function act(icon,label,fn,main){
  const b=document.createElement('button');b.type='button';b.className='act'+(main?' main':'');
  b.innerHTML='<span class="glass round">'+ICON[icon]+'</span>';const s=document.createElement('span');s.textContent=label;b.append(s);
  b.addEventListener('click',fn);return b;
}
function showCard(kind){
  setUI('sheet');card={kind};cv.classList.toggle('dim',kind!=='win');
  $('sTitle').textContent=kind==='win'?T.winT:T.pause;
  const text=kind==='win'?T.winP:'';$('sText').textContent=text;$('sText').hidden=!text;
  const acts=[act('home',T.menu,toMenu)];
  if(kind==='win')acts.push(act('retry',T.retry,begin,true));
  if(kind==='pause'){acts.push(act('retry',T.restartL,()=>{st.paused=false;begin()}));acts.push(act('play',T.resume,resume,true))}
  $('sActs').replaceChildren(...acts);
  $('sheetOv').hidden=false;
  setTimeout(()=>{const m=$('sActs').querySelector('.main');m&&m.focus({preventScroll:true})},60);
}
$('playBtn').addEventListener('click',begin);
$('pauseBtn').addEventListener('click',e=>{e.currentTarget.blur();pause()});
$('howBtn').addEventListener('click',()=>{$('howOv').hidden=false;$('howClose').focus()});
$('howClose').addEventListener('click',()=>{$('howOv').hidden=true});
$('howOv').addEventListener('click',e=>{if(e.target===e.currentTarget)$('howOv').hidden=true});

st=fresh('menu');
applyLang(lang,false);
resize();showMenu();
document.fonts&&document.fonts.ready.then(()=>{});
requestAnimationFrame(loop);
// test hook
window.__kobolde={get st(){return st},begin,giveBack,openGate,morning,keys,joy,get cam(){return{x:camX,y:camY,S,VW}}};
})();
</script>
