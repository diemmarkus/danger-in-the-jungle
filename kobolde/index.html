<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#5E5A8C">
<title>Kobolde</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Same layout as Danger in the Jungle: the forest canvas fills the screen, glass controls float on top. */
:root{
  --ink:#3A2E3F;--white:#FFFDF6;--gold:#FFC53D;--night:#3E3A5E;--paper:#FFE3A3;
  --display:"Fredoka","Baloo 2","Arial Rounded MT Bold",system-ui,sans-serif;
  --hand:"Nunito","Segoe UI",system-ui,sans-serif;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;margin:0;background:var(--night)}
body{color:var(--white);font-family:var(--hand);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;overscroll-behavior:none}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0;touch-action:none}
canvas{display:block;width:100%;height:100%;transition:filter .6s ease}
canvas.dim{filter:saturate(.45) brightness(.75)}
#safe{position:absolute;visibility:hidden;padding:var(--st) var(--sr) var(--sb) var(--sl)}

.glass{background:linear-gradient(180deg,rgba(255,255,255,.26),rgba(255,255,255,.1));border:1.5px solid rgba(255,255,255,.42);box-shadow:0 8px 22px rgba(30,20,50,.35),inset 0 1px 0 rgba(255,255,255,.45);backdrop-filter:blur(10px) saturate(1.2);-webkit-backdrop-filter:blur(10px) saturate(1.2)}
.round{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;padding:0;cursor:pointer}
.round svg{width:22px;height:22px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}
.round:active{transform:scale(.92)}
a.round{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.act:focus-visible{outline:none}.act:focus-visible .round{outline:3px solid var(--gold);outline-offset:3px}

#pauseBtn{position:absolute;top:calc(var(--st) + 12px);right:calc(var(--sr) + 12px)}

/* joystick (same as Danger in the Jungle): touch anywhere in the bottom strip, it jumps under your thumb */
#ctrl{position:absolute;left:0;right:0;bottom:0;height:calc(150px + var(--sb));touch-action:none;transition:opacity .35s ease,transform .35s ease}
#ctrl.off{opacity:0;transform:translateY(30px);pointer-events:none}
#joyBase{position:absolute;width:124px;height:124px;margin:-62px 0 0 -62px;border-radius:50%;left:50%;top:calc(50% - var(--sb)/2);pointer-events:none;color:#fff;transition:left .18s ease,top .18s ease,opacity .2s}
#joyBase.live{transition:none}
#joyBase svg{position:absolute;inset:0;width:100%;height:100%}
#joyKnob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFFFFF,#FFE58A 45%,#F2B705);box-shadow:0 6px 14px rgba(30,20,50,.45),inset 0 -3px 6px rgba(150,90,0,.35);transition:transform .15s ease}
#joyBase.live #joyKnob{transition:none}

/* the hand button: give the egg back */
#handBtn{position:absolute;left:50%;bottom:calc(var(--sb) + 15% + 34px);width:96px;height:96px;margin-left:-48px;pointer-events:auto;animation:pulse 1.4s ease-in-out infinite}
#handBtn svg{width:58px;height:58px}
#handBtn::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:3px solid rgba(255,229,138,.9);animation:ring 1.4s ease-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
@keyframes ring{from{transform:scale(.85);opacity:1}to{transform:scale(1.35);opacity:0}}

/* hint at the top while walking */
#hint{position:absolute;top:calc(var(--st) + 14px);left:50%;transform:translateX(-50%);max-width:calc(100% - 140px);border-radius:999px;padding:9px 18px;font-family:var(--display);font-weight:600;font-size:16px;letter-spacing:.02em;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none;transition:background .3s}
/* what the characters say (they also speak it out loud) */
#say{position:absolute;left:18px;right:18px;top:calc(var(--st) + 66px);margin:0;text-align:center;font-family:var(--display);font-weight:600;font-size:19px;line-height:1.3;pointer-events:none;text-shadow:0 2px 6px rgba(0,0,0,.75),0 0 2px rgba(0,0,0,.9);z-index:2;animation:fade .25s ease}
#say.lilly{color:#FFD3E2}#say.ria{color:#FFE88A}
.medals{display:flex;gap:10px;justify-content:center}
.medal{width:48px;height:48px;border-radius:50%;cursor:pointer;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:20px;padding:0}
.medal[aria-pressed="true"]{background:linear-gradient(180deg,#F7B5CF,#D9709D);border-color:#FFD6E6;box-shadow:0 0 0 4px rgba(247,181,207,.35),0 8px 22px rgba(30,20,50,.35)}
#hint.hot{background:linear-gradient(180deg,#FFE58A,#FFC53D);color:#5A3B00;border-color:#FFF2C0}

#menu{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:calc(var(--st) + 12px) calc(var(--sr) + 14px) calc(var(--sb) + 18px) calc(var(--sl) + 14px);pointer-events:none}
#menu>*{pointer-events:auto}
.mtop{display:flex;justify-content:space-between;align-items:center}
.pill{border-radius:999px;padding:9px 16px;font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.04em;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.pill svg{width:18px;height:18px}
.mbottom{display:flex;flex-direction:column;align-items:center;gap:12px}
.lbl{font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.12em;opacity:.85;text-transform:uppercase;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.play{border:none;border-radius:999px;padding:14px 46px 14px 38px;font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.04em;cursor:pointer;color:#fff;background:linear-gradient(180deg,#F7B5CF,#D9709D);box-shadow:0 7px 0 #A84B76,0 14px 30px rgba(40,20,50,.45),inset 0 2px 0 rgba(255,255,255,.45);text-shadow:0 2px 0 rgba(0,0,0,.18);display:flex;align-items:center;gap:12px;animation:breathe 2.4s ease-in-out infinite}
.play svg{width:26px;height:26px}
.play:active{transform:translateY(5px);box-shadow:0 2px 0 #A84B76,0 6px 14px rgba(40,20,50,.4);animation:none}
@keyframes breathe{50%{transform:scale(1.04)}}

.scrim{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:calc(var(--st) + 20px) 20px calc(var(--sb) + 20px);background:radial-gradient(circle at 50% 40%,rgba(62,58,94,.25),rgba(30,26,52,.75));animation:fade .3s ease}
@keyframes fade{from{opacity:0}}
.sheet{width:min(360px,100%);max-height:100%;overflow-y:auto;box-sizing:border-box;border-radius:30px;padding:26px 22px 22px;text-align:center;animation:rise .45s cubic-bezier(.2,1.3,.4,1)}
@keyframes rise{from{transform:translateY(40px) scale(.94);opacity:0}}
.sheet h2{font-family:var(--display);font-weight:700;font-size:40px;line-height:1;margin:0 0 10px;letter-spacing:.01em;background:linear-gradient(180deg,#FFF6C8,#FFC53D);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 rgba(120,70,0,.45)) drop-shadow(0 8px 16px rgba(0,0,0,.35));text-wrap:balance}
.sheet p{margin:6px 0;font-size:15px;line-height:1.45;color:rgba(255,255,255,.92)}
.actions{display:flex;justify-content:center;gap:16px;margin-top:18px}
.act{display:flex;flex-direction:column;align-items:center;gap:6px;font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.06em;cursor:pointer;background:none;border:none;padding:0}
.act .round{width:58px;height:58px}
.act .round svg{width:26px;height:26px}
.act.main .round{width:72px;height:72px;background:linear-gradient(180deg,#F7B5CF,#D9709D);border-color:#FFD6E6;box-shadow:0 6px 0 #A84B76,0 12px 26px rgba(40,20,50,.45)}
.act.main .round svg{width:32px;height:32px}
.rules{list-style:none;padding:0;margin:14px 0 4px;text-align:left;display:grid;gap:12px}
.rules li{display:flex;gap:12px;align-items:flex-start;font-size:14.5px;line-height:1.4}
.rules li b{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:15px;background:linear-gradient(180deg,#FFE58A,#FFC53D);color:#5A3B00}

/* intro: letterbox bars, subtitles, skip */
#cine{position:absolute;inset:0;pointer-events:none}
#cine::before,#cine::after{content:"";position:absolute;left:0;right:0;height:12%;background:#1E1A30;animation:bar .6s ease both}
#cine::before{top:0;transform-origin:top}
#cine::after{bottom:0;transform-origin:bottom}
@keyframes bar{from{transform:scaleY(0)}}
#caption{position:absolute;left:24px;right:24px;bottom:calc(12% + 18px);text-align:center;font-weight:700;font-size:18px;line-height:1.35;text-shadow:0 2px 6px rgba(0,0,0,.8),0 0 2px rgba(0,0,0,.9);transition:opacity .35s ease;z-index:1}
#cine.ask #caption{bottom:calc(12% + 150px)}
#skipBtn{position:absolute;top:calc(var(--st) + 12px);right:calc(var(--sr) + 12px);pointer-events:auto;z-index:1}

#fade{position:absolute;inset:0;background:#2A2640;opacity:0;pointer-events:none;transition:opacity .35s ease}
#fade.on{opacity:1}
#fade.slow{transition:opacity 1.1s ease}
@media (orientation:landscape) and (max-height:540px){
  #ctrl{height:calc(110px + var(--sb))}
  #joyBase{width:104px;height:104px;margin:-52px 0 0 -52px}#joyKnob{width:50px;height:50px;margin:-25px 0 0 -25px}
  .mbottom{position:absolute;right:calc(var(--sr) + 14px);bottom:calc(var(--sb) + 22px)}
  #handBtn{bottom:calc(var(--sb) + 15% + 14px);width:80px;height:80px;margin-left:-40px}
  #cine.ask #caption{bottom:calc(12% + 112px)}
}
@media (prefers-reduced-motion:reduce){.play,#handBtn,#handBtn::after{animation:none}}
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>
  <div id="safe"></div>

  <div id="ctrl" class="off">
    <div id="joyBase" class="glass" aria-hidden="true">
      <svg viewBox="0 0 120 120"><g fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity=".75"><path d="M52 18l8-8 8 8"/><path d="M52 102l8 8 8-8"/><path d="M18 52l-8 8 8 8"/><path d="M102 52l8 8-8 8"/></g></svg>
      <div id="joyKnob"></div>

  <div id="hint" class="glass" hidden></div>
  <p id="say" hidden></p>

  <div id="menu">
    <div class="mtop">
      <div style="display:flex;gap:10px;align-items:center">
      <a href="../" id="homeBtn" class="glass round" aria-label="Abenteuer" title="Abenteuer"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5 12 4.5l8 7M6.5 9.5V19h4v-5h3v5h4V9.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
      <button type="button" id="langBtn" class="glass pill"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18" fill="none" stroke="currentColor" stroke-width="2"/></svg><span id="langName">DE</span></button>
      </div>
      <button type="button" id="howBtn" class="glass round" aria-label="So geht’s"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 9a3 3 0 1 1 4.2 2.8c-.8.4-1.2 1-1.2 1.9V15" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><circle cx="12" cy="18.6" r="1.6" fill="currentColor"/></svg></button>

      <span class="lbl" id="lvlLbl">Kapitel 1 · Im Urwald</span>
      <div class="medals" id="chs" role="group" aria-label="Kapitel"></div>
      <button type="button" class="play" id="playBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12.5-7.5z" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg><span id="playLbl">LOS GEHT’S</span></button>
    </div>
  </div>

  <div id="cine" hidden>
    <p id="caption"></p>
    <button type="button" id="skipBtn" class="glass pill"><span id="skipLbl">Überspringen</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5l7 7-7 7M13 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button type="button" id="handBtn" class="glass round" hidden aria-label="Ei zurückgeben"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M16 40c-4-3-7-8-7-13v-5c0-1.7 1.3-3 3-3s3 1.3 3 3v4V10c0-1.7 1.3-3 3-3s3 1.3 3 3v12V7c0-1.7 1.3-3 3-3s3 1.3 3 3v15V9c0-1.7 1.3-3 3-3s3 1.3 3 3v14-6c0-1.7 1.3-3 3-3s3 1.3 3 3v11c0 7-4 12-10 15z" fill="#F3CDB4" stroke="#8A5A4A" stroke-width="2" stroke-linejoin="round"/><path d="M21 22V12M27 22V9M33 23V12" stroke="#C99A86" stroke-width="1.5" stroke-linecap="round"/></svg></button>
  </div>

  <div class="scrim" id="howOv" hidden>
    <div class="sheet glass">
      <h2 id="howTitle">So geht’s</h2>
      <ol class="rules" id="rules"></ol>
      <div class="actions"><button type="button" class="act main" id="howClose"><span class="glass round"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span id="okLbl">OK</span></button></div>
    </div>
  </div>

  <div class="scrim" id="sheetOv" hidden>
    <div class="sheet glass" id="sheet">
      <h2 id="sTitle"></h2>
      <p id="sText"></p>
      <div class="actions" id="sActs"></div>
    </div>
  </div>

  <div id="fade"></div>
</div>

<script>

const WW=34;
const WALK=2.3;

// screen-space foreground: big dark leaves in the corners, light motes

  // sometimes dense, and now and then a big dark tree trunk (never in front of the camp or the gate)
  const R=mulberry(99);fgLeaves=[];
  const x0=camMin()*FGP-2,x1=camMax()*FGP+VW+3;
  const spots=[(CX+1.2-VW*.5)*FGP,(GX-VW*.5)*FGP];   // where the camera stands at the camp and at the gate
  const free=CH===2?(x=>x<(NT-1.5-VW*.5)*FGP-1):(x=>spots.every(c=>x<c+VW*.05-1||x>c+VW*.95+1));
  for(let t=x0+1+expo(R,3);t<x1;t+=4+expo(R,7)){if(!free(t))continue;fgLeaves.push({k:'trunk',x:t,w:R()<.3?.35+R()*.25:.75+R()*.7,lean:(R()-.5)*.14,ph:R()*7});

  const Lt=.31,Ls=.31,th=Math.sin(p)*.5*mv,kn=mv*(.08+.62*Math.max(0,Math.cos(p))),sh=th-kn;
  const kx=dir*Math.sin(th)*Lt,ky=Math.cos(th)*Lt,fx=kx+dir*Math.sin(sh)*Ls,fy=ky+Math.cos(sh)*Ls;
  return{kx,ky,fx,fy,sh};
}
function drawLilly(x,y,u,f,ph,o={}){
  const mv=o.moving?1:0,back=!!o.back,dir=back?0:f;
  const legs=[{side:-f,p:ph+Math.PI},{side:f,p:ph}].map(l=>({...l,...legPose(l.p,mv,dir)}));
  const low=Math.max(...legs.map(l=>l.fy)),drop=(.62-low)*u;     // lift the body so the lower foot touches the ground
  ctx.save();ctx.translate(x,y);ctx.lineJoin='round';
  ctx.beginPath();ctx.ellipse(0,0,.32*u,.06*u,0,0,7);ctx.fillStyle='rgba(60,70,50,.22)';ctx.fill();
  ctx.translate(0,drop);
  if(mv&&!back)ctx.rotate(f*.035);
  if(!back&&!o.noPack){ctx.save();ctx.translate(-f*.13*u,0);drawPack(u,ph,mv,true);ctx.restore()}
  for(const l of legs){
    const hx=l.side*.08*u*(back?1:.6),hy=-.62*u,kx=hx+l.kx*u,ky=hy+l.ky*u,fx=hx+l.fx*u,fy=hy+l.fy*u,near=l.side===f,col=near?JEANS:shade(JEANS,.86);
    ctx.lineCap='round';ctx.strokeStyle=col;
    ctx.beginPath();ctx.moveTo(hx,hy);ctx.lineTo(kx,ky);ctx.lineWidth=.16*u;ctx.stroke();
    ctx.beginPath();ctx.moveTo(kx,ky);ctx.lineTo(fx,fy-.03*u);ctx.lineWidth=.135*u;ctx.stroke();
    // shoe: flat while standing on the ground, tipped with the shin while the foot is in the air
    const air=l.fy<low-.012,rot=air?clamp(l.sh*dir*.7,-.5,.5):0;
    ctx.save();ctx.translate(fx,fy-.02*u);ctx.rotate(rot);
    ctx.beginPath();ctx.ellipse(dir*.05*u,0,.11*u,.06*u,0,0,7);radFill(0,-.03*u,.12*u,near?'#C2C4C9':'#B3B5BA',SHOE);
    ctx.beginPath();ctx.moveTo(-.09*u+dir*.05*u,.04*u);ctx.lineTo(.09*u+dir*.05*u,.04*u);ctx.lineWidth=Math.max(1,.02*u);ctx.strokeStyle='#F2F2F2';ctx.stroke();

  }

  ctx.translate(0,-.6*u);
  drawUpper(u,f,{...o,ph,mv,straps:!back&&!o.noPack});
  ctx.restore();
}

function updIntro(dt){
  const t=st.t,b=st.blue;

    const p=introBlue(t,st.mode==='menu');Object.assign(b,p);
    if(st.mode==='menu')return;
    if(t>4.7&&!st.egg){st.egg={x:SLOT(2).x,y:SLOT(2).y,vy:0,rot:0,state:'wobble',t:0}}

      if(e.state==='wobble'&&e.t>.8){e.state='fall';st.eggs=2;popText(PURP.x,PURP.y-.6,'!','#FFFFFF','#B4423E')}
      if(e.state==='fall'){e.vy+=13*dt;e.y+=e.vy*dt;e.rot+=dt*5;
        if(e.y>=REST.y){e.y=REST.y;if(e.vy>3){e.vy=-e.vy*.25}else{e.state='bag';e.vy=0;e.rot=.4;e.t=0}
          if(!st.awake){st.awake=true;popText(CX-.2,GY-1.3,T.huch)}}}

  const t=st.t,b=st.blue,e=st.egg;

  st.sit=t<5.4?ease(t/.8):1-ease((t-5.4)/.9);

  const egg=st.egg,wob=egg&&egg.state==='wobble'?1:0;
  drawNest(st.eggs,wob);
  drawParrot(X(PURP.x),Y(PURP.y),S*.8,1,st.blue.flap*.9,{pal:PALS.hyacinth,sit:true,sleep:st.mode==='menu'||(st.night>.5&&st.mode!=='intro'&&st.mode!=='egg'&&st.mode!=='give'),look:.2,lookY:.5,seed:1.3});
  // the gate (back part); Lilly inside it while she walks through
  drawGateBack();
  const L=st.lilly;
  if(!st.camp&&L.depth>0)drawWalker(L);
  drawGateFront(st.gate,st.mode==='play'&&nearGate());
  drawButterflies();
  if(st.camp){
    const sit=st.mode==='give'?st.sit:0,arm=st.mode==='give'?st.arm:0;
    const surprised=st.awake&&(st.mode==='intro'||st.mode==='egg'||(st.mode==='give'&&st.t<.8));
    drawCamp({sit,arm,egg:!!(egg&&egg.state==='hand'),sleep:!st.awake,zzz:!st.awake,surprise:surprised,lookY:-.4,lookX:.4});
  }else if(L.depth<=0)drawWalker(L);
  const b=st.blue;drawParrot(X(b.x),Y(b.y),S*.85,b.f,b.flap,{sit:b.sit,claws:egg&&egg.state==='carry',look:b.sit?.3:.5,lookY:b.sit?.4:.1});
  if(egg&&egg.state!=='done'&&egg.state!=='hand')drawEgg(X(egg.x),Y(egg.y),S,egg.rot);
  drawParts();
  drawFg();
  drawNight();
  if(st.mode==='menu')drawTitle();
  if(st.banner)drawBanner();
}
function drawWalker(L){
  const d=L.depth,sc=1-d*.45;
  ctx.save();ctx.globalAlpha=1-Math.max(0,d-.55)/.45;
  drawLilly(X(L.x),Y(GY+.38-d*.75),S*sc,L.f,L.ph,{moving:L.moving,back:d>0,wave:false});
  ctx.restore();
}

// ---------- flow ----------
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(st&&!st.paused){update(dt);moveCam(dt);captions()}
  draw();requestAnimationFrame(loop);
}
function captions(){
  const c=$('caption');
  let i=-1;
  if(st.ch===2){const txt=st.cap||'';if(txt!==capIdx){capIdx=txt;c.style.opacity=0;setTimeout(()=>{c.textContent=txt;c.style.opacity=txt?1:0},txt?250:0)}return}
  if(st.mode==='intro')i=st.t<2.6?0:st.t<4.9?1:2;
  else if(st.mode==='egg')i=3;
  else if(st.mode==='give')i=st.t<4.6?-1:st.t<6.3?4:5;
  if(i!==capIdx){capIdx=i;c.style.opacity=0;setTimeout(()=>{c.textContent=i<0?'':T.cap[i];c.style.opacity=i<0?0:1},i===0?0:250)}
}
function setUI(mode){
  $('menu').hidden=mode!=='menu';
  const cine=mode==='intro'||mode==='cine2';$('cine').hidden=!cine;$('skipBtn').hidden=mode==='cine2';if(cine){$('handBtn').hidden=true;$('cine').classList.remove('ask')}
  $('ctrl').classList.toggle('off',mode!=='play');$('pauseBtn').hidden=mode!=='play';
  if(mode!=='play')hint(null);
  if(mode!=='sheet'){$('sheetOv').hidden=true;card=null;cv.classList.remove('dim')}
  if(mode!=='menu')$('howOv').hidden=true;
  joyReset();for(const k in keys)keys[k]=0;
}
function fadeTo(cb,hold){
  const f=$('fade');f.classList.add('on');
  setTimeout(()=>{cb();requestAnimationFrame(()=>requestAnimationFrame(()=>f.classList.remove('on')))},hold||360);
}
function setChapter(c){if(CH===c)return;CH=c;buildLayers();setupFg()}
function begin(ch){
  ch=ch===2?2:1;unlockSpeech();stopSpeech();
  try{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{})}catch(_){}
  fadeTo(()=>{setChapter(ch);$('say').hidden=true;
    if(ch===2){st=fresh2();capIdx=-1;setUI('play');moveCam(0,true);c2Hint();return}
    st=fresh('intro');capIdx=-1;setUI('intro');moveCam(0,true)});
}
function showMenu(){stopSpeech();$('say').hidden=true;setChapter(1);st=fresh('menu');setUI('menu');moveCam(0,true);paintChapters()}
function toMenu(){fadeTo(showMenu)}
function pause(){if(!st||st.paused)return;st.paused=true;try{speechSynthesis.pause()}catch(_){}showCard('pause')}
function resume(){if(!st)return;st.paused=false;try{speechSynthesis.resume()}catch(_){}last=performance.now();setUI('play');if(st.ch===2&&st.mode==='w2')c2Hint()}
let pickCh=1;
function paintChapters(){const box=$('chs');if(!box.children.length)[1,2].forEach(c=>{const b=document.createElement('button');b.type='button';b.className='medal glass';b.textContent=c;b.addEventListener('click',()=>{pickCh=c;paintChapters()});box.append(b)});
  [...box.children].forEach((b,i)=>b.setAttribute('aria-pressed',i+1===pickCh));$('lvlLbl').textContent=T.chName[pickCh-1]}
function act(icon,label,fn,main){
  const b=document.createElement('button');b.type='button';b.className='act'+(main?' main':'');
  b.innerHTML='<span class="glass round">'+ICON[icon]+'</span>';const s=document.createElement('span');s.textContent=label;b.append(s);
  b.addEventListener('click',fn);return b;
}
function showCard(kind){
  setUI('sheet');card={kind};cv.classList.toggle('dim',kind!=='win');
  $('sTitle').textContent=kind==='win'?T.winT:kind==='win2'?T.win2T:T.pause;
  const text=kind==='win'?T.winP:kind==='win2'?T.win2P:'';$('sText').textContent=text;$('sText').hidden=!text;
  cv.classList.toggle('dim',kind==='pause');
  const acts=[act('home',T.menu,toMenu)];
  if(kind==='win'){acts.push(act('retry',T.retry,()=>begin(1)));acts.push(act('play',T.next,()=>begin(2),true))}
  if(kind==='win2')acts.push(act('retry',T.retry,()=>begin(2),true));
  if(kind==='pause'){const c=st.ch||1;acts.push(act('retry',T.restartL,()=>{st.paused=false;begin(c)}));acts.push(act('play',T.resume,resume,true))}
  $('sActs').replaceChildren(...acts);
  $('sheetOv').hidden=false;
  setTimeout(()=>{const m=$('sActs').querySelector('.main');m&&m.focus({preventScroll:true})},60);
}
$('playBtn').addEventListener('click',()=>begin(pickCh));
$('pauseBtn').addEventListener('click',e=>{e.currentTarget.blur();pause()});
$('howBtn').addEventListener('click',()=>{$('howOv').hidden=false;$('howClose').focus()});
$('howClose').addEventListener('click',()=>{$('howOv').hidden=true});
$('howOv').addEventListener('click',e=>{if(e.target===e.currentTarget)$('howOv').hidden=true});

st=fresh('menu');
applyLang(lang,false);
resize();showMenu();
document.fonts&&document.fonts.ready.then(()=>{});
requestAnimationFrame(loop);
// test hook
window.__kobolde={get st(){return st},begin,startFly,giveBack,openGate,morning,keys,joy,get cam(){return{x:camX,y:camY,S,VW}}};
})();
</script>
